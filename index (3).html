   <div class="bg-[#1c2128] border border-[#2a3441] rounded-[22px] p-6 text-center">
     <div class="relative w-28 h-28 mx-auto">

   h+=`<div class="p-3"><h2 class="font-black text-[18px] mb-3">دليل الخريجين - ${filtered.length} خريج</h2><input oninput="searchQ=this.value;render()" value="${searchQ}" placeholder="ابحث..." class="w-full bg-[#1c2128] border rounded-full px-4 py-2.5 text-[13px] mb-3 outline-none"><div class="space-y-2">${filtered.map(g=>`<div class="bg-[#1c2128] border rounded-2xl p-3 flex gap-3 items-center"><div onclick="openGrad(${g.id})" class="w-12 h-12 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold cursor-pointer">${g.img}</div><div class="flex-1"><p class="font-bold text-[13px]">${g.name}</p><p class="text-[11px] text-[#9aa4b2]">${g.job}</p></div><button onclick="openChat(${g.id})" class="bg-[#3b82f6] px-3 py-1.5 rounded-full text-[11px]">راسل</button></div>`).join('')}</div></div>`;
 }
 if(selectedGrad){
   const g=selectedGrad;
   h+=`<div class="p-3"><button onclick="selectedGrad=null;render()" class="mb-3 bg-[#1c2128] border px-3 py-1.5 rounded-full text-[12px]">← رجوع</button><div class="bg-[#1c2128] border rounded-[22px] p-6 text-center"><div class="w-20 h-20 bg-[#3b82f6] rounded-full mx-auto flex items-center justify-center text-2xl font-black">${g.img}</div><h2 class="font-black text-[16px] mt-3">${g.name}</h2><p class="text-[11px] text-[#9aa4b2]">${g.year} • ${g.city}</p><p class="text-[13px] mt-3">💼 ${g.job}</p><button onclick="openChat(${g.id})" class="mt-5 bg-[#3b82f6] w-full py-3 rounded-full font-bold">💬 راسل الآن</button></div></div>`;

   h+=`<div class="p-3"><h2 class="font-black text-[18px] mb-3">المنشورات</h2><div class="bg-[#1c2128] border rounded-2xl p-3 mb-3"><textarea id="newPost" placeholder="شارك إنجازك..." class="w-full bg-[#0d1117] border rounded-xl p-3 text-sm outline-none h-20"></textarea><button onclick="addPost()" class="mt-2 bg-[#3b82f6] w-full py-2.5 rounded-full font-bold">نشر</button></div><div class="space-y-3">${posts.map(p=>`<div class="bg-[#1c2128] border rounded-2xl p-4"><p class="font-bold text-[13px]">${p.author}</p><p class="text-[13px] mt-2">${p.content}</p><div class="flex gap-4 mt-3 text-[12px]"><button onclick="likePost(${p.id})" class="${p.liked?'text-red-400':''}">❤️ ${p.likes}</button><span>💬 ${p.comments.length}</span></div></div>`).join('')}</div></div>`;
 }
 if(activeTab==='الشات' && !selectedChat){
   h+=`<div class="p-3"><h2 class="font-black text-[18px] mb-3">الشات - فردي ومجموعات</h2><div class="flex bg-[#1c2128] rounded-full p-1 mb-4 border"><button onclick="chatTab='individual';render()" class="flex-1 py-2 rounded-full text-[13px] ${chatTab==='individual'?'bg-[#3b82f6]':''}">فردي</button><button onclick="chatTab='groups';render()" class="flex-1 py-2 rounded-full text-[13px] ${chatTab==='groups'?'bg-[#3b82f6]':''}">مجموعات</button></div>${chatTab==='individual'?grads.map(g=>`<div onclick="openChat(${g.id})" class="bg-[#1c2128] border rounded-2xl p-3 flex gap-3 mb-2 cursor-pointer"><div class="w-12 h-12 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">${g.img}</div><div><p class="font-bold text-[13px]">${g.name}</p><p class="text-[11px] text-[#9aa4b2]">${g.job}</p></div></div>`).join(''):`<div class="bg-[#1c2128] border rounded-2xl p-4"><p class="font-bold">دفعة 2024 - الرسمية</p><p class="text-[11px] text-[#9aa4b2]">27 عضو - شات جماعي تفاعلي</p><button onclick="openGroup('g1')" class="mt-2 bg-[#3b82f6] px-4 py-1 rounded-full text-[11px]">دخول</button></div>`}</div>`;

       <button onclick="toast('📞 مكالمة صوتية - تفاعلي')" class="w-8 h-8 bg-[#252f3d] rounded-full">📞</button>
     </div>
     <div id="msgs" class="flex-1 p-3 space-y-3 pb-[140px]">${chatMsgs.length===0?`<div class="text-center py-16"><p class="text-5xl mb-3">💬</p><p class="font-bold text-[14px]">ابدأ المحادثة</p><p class="text-[11px] text-[#9aa4b2] mt-2">الشات تفاعلي 100% - جرب تبعت رسالة</p><div class="flex justify-center gap-2 mt-4"><button onclick="quickSend('مرحبا 👋')" class="bg-[#1c2128] border px-3 py-1.5 rounded-full text-[11px]">مرحبا 👋</button><button onclick="quickSend('عامل ايه؟')" class="bg-[#1c2128] border px-3 py-1.5 rounded-full text-[11px]">عامل ايه؟</button></div></div>`:chatMsgs.map(m=>`<div class="flex ${m.sender==='me'?'justify-end':'justify-start'}"><div class="${m.sender==='me'?'bg-[#3b82f6] rounded-br-sm':'bg-[#1c2128] border border-[#2a3441] rounded-bl-sm'} max-w-[78%] rounded-2xl px-4 py-2.5 shadow"><p class="text-[13px] leading-5">${m.text}</p><div class="flex justify-between gap-3 mt-1"><p class="text-[9px] opacity-60">${m.time}</p><p class="text-[9px] opacity-60">${m.sender==='me'?'✓✓ مقروء':'✓'}</p></div></div></div>`).join('')}</div>
     <!-- زر الكتابة الثابت فوق النافبار - ظاهر دائما -->
     <div class="fixed bottom-[70px] left-1/2 -translate-x-1/2 w-full max-w-[480px] p-3 bg-[#1c2128]/95 backdrop-blur border-t border-[#2a3441] z-30 flex gap-2 items-center">
       <button onclick="toggleEmoji()" class="bg-[#0d1117] border border-[#2a3441] w-10 h-10 rounded-full flex items-center justify-center">😊</button>
       <input id="chatInput" onkeydown="if(event.key==='Enter')sendMsg()" placeholder="اكتب رسالة هنا... 👇 تفاعلي 100%" class="flex-1 bg-[#0d1117] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none focus:border-[#3b82f6] focus:ring-1 focus:ring-[#3b82f6]">
       <button onclick="sendMsg()" class="bg-[#3b82f6] w-12 h-12 rounded-full flex items-center justify-center font-black shadow-lg text-[18px]">↑</button>
     </div>
     <div id="emojiBar" class="hidden fixed bottom-[125px] left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-[#1c2128] border-t border-[#2a3441] p-2 z-30 flex gap-2 overflow-auto no-scrollbar">${['😊','😂','❤️','🔥','👏','🎉','✅','👍','🙏','💪','🚀','💼','👋','😍'].map(e=>`<button onclick="quickSend('${e}')" class="text-xl bg-[#0d1117] min-w-[40px] h-10 rounded-full">${e}</button>`).join('')}</div>
   </div>`;
 }
 if(['المتصدرين','المختبر'].includes(activeTab) && !selectedChat && !selectedGrad){
   h+=`<div class="p-10 text-center"><p class="text-4xl mb-3">${activeTab==='المتصدرين'?'🏆':'🧪'}</p><p class="font-bold">${activeTab}</p><p class="text-[11px] text-[#9aa4b2] mt-2">تفاعلي 100% بدون Alert - دوس الشات والخريجين</p><button onclick="activeTab='الشات';render()" class="mt-4 bg-[#3b82f6] px-5 py-2 rounded-full text-[12px]">روح للشات</button></div>`;
 }

 h+=`<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-2 px-1 z-20">${[{k:'الرئيسية',i:'🏠'},{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'},{k:'المنشورات',i:'📝'},{k:'حسابي',i:'👤'}].map(n=>`<button onclick="activeTab='${n.k}';selectedChat=null;selectedGrad=null;labActive=null;showNotifs=false;render()" class="flex flex-col items-center text-[10px] ${activeTab===n.k?'text-[#60a5fa]':'text-[#6b7280]'}"><span class="text-[18px]">${n.i}</span><span class="mt-0.5">${n.k}</span></button>`).join('')}</nav>`;

 document.getElementById('app').innerHTML=h;
 setTimeout(()=>{const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight},30);
}

function toggleNotifs(){showNotifs=!showNotifs; render()}
function markAllRead(){notifications.forEach(n=>n.read=true); saveAll(); render(); toast('✅ تم تعليم الكل كمقروء')}
function clearNotifs(){notifications=[]; saveAll(); render(); toast('🗑️ تم مسح الإشعارات')}
function openNotif(id){const n=notifications.find(x=>x.id===id); if(n){n.read=true; activeTab=n.tab; showNotifs=false; saveAll(); render()}}

function openGrad(id){selectedGrad=grads.find(g=>g.id===id); render()}
function openChat(id){selectedChat=grads.find(g=>g.id===id); selectedGrad=null; activeTab='الشات'; render()}
function openGroup(id){selectedChat={id,name:'دفعة 2024',img:'👥'}; activeTab='الشات'; render()}

function quickSend(t){const inp=document.getElementById("chatInput"); if(inp){inp.value=t; sendMsg()}}
function toggleEmoji(){document.getElementById("emojiBar")?.classList.toggle("hidden")}
function sendMsg(){const inp=document.getElementById('chatInput');const t=inp?inp.value.trim():''; if(!t||!selectedChat) return; messages.push({id:Date.now(),chatId:selectedChat.id,text:t,sender:'me',time:new Date().toLocaleTimeString('ar-EG')}); saveAll(); render(); setTimeout(()=>{messages.push({id:Date.now()+1,chatId:selectedChat.id,text:['تمام 👌','عاش 🔥','اتفقنا'][Math.floor(Math.random()*3)],sender:'other',time:new Date().toLocaleTimeString('ar-EG')}); addNotif('رسالة جديدة','رد من '+selectedChat.name); saveAll(); render()},900)}

function addPost(){const el=document.getElementById('newPost'); if(!el.value.trim()){toast('اكتب حاجة الأول!','error'); return} posts.unshift({id:Date.now(),author:'أنت',time:'الآن',content:el.value,likes:0,liked:false,comments:[],shares:0}); el.value=''; saveAll(); render(); toast('✅ تم نشر المنشور - وصل لـ 27 خريج 🔔')}
function likePost(id){const p=posts.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; saveAll(); render(); if(p.liked) toast('❤️ عملت إعجاب')}

function editField(field){
 const overlay=document.createElement('div');
 overlay.className='fixed inset-0 bg-black/70 z-[200] flex items-center justify-center p-4';
 overlay.innerHTML=`<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-5 w-full max-w-[340px]"><h3 class="font-black text-[14px] mb-3">تعديل ${field}</h3><input id="editInput" class="w-full bg-[#0d1117] border border-[#2a3441] rounded-xl px-4 py-3 text-[13px] outline-none" placeholder="اكتب ${field} الجديد"><div class="flex gap-2 mt-4"><button onclick="this.closest('.fixed').remove()" class="flex-1 bg-[#252f3d] py-2.5 rounded-full text-[12px]">إلغاء</button><button onclick="const v=document.getElementById('editInput').value; if(v.trim()){toast('✅ تم حفظ ${field}: '+v); this.closest('.fixed').remove()}else{toast('اكتب حاجة','error')}" class="flex-1 bg-[#3b82f6] py-2.5 rounded-full text-[12px] font-bold">حفظ</button></div></div>`;
 document.body.appendChild(overlay);
 setTimeout(()=>document.getElementById('editInput')?.focus(),100);
}
function saveProfile(){toast('✅ تم حفظ التعديلات - تفاعلي 100% بدون Alert')}

// تغيير الصورة الحقيقي
document.getElementById('imgPicker').addEventListener('change', function(e){
 const file=e.target.files[0];
 if(!file) return;
 const reader=new FileReader();
 reader.onload=function(ev){
   profileImg=ev.target.result;
   localStorage.setItem('tk_profile_img',profileImg);
   render();
   toast('📷 تم تغيير الصورة بنجاح - تفاعلي حقيقي 100%');
 }
 reader.readAsDataURL(file);
});

render();
</script>
</body>
</html>
