<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكنو خريج - V6.3 شغال 100% 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Tajawal',sans-serif} body{background:#0f1419;color:white}</style>
</head>
<body>
<div id="app" class="max-w-[480px] mx-auto min-h-screen bg-[#0f1419] pb-[90px] flex items-center justify-center"><p>⏳ جاري الاتصال...</p></div>
<div id="toastBox" class="fixed bottom-[90px] left-1/2 -translate-x-1/2 z-[200] space-y-2 w-[90%] max-w-[380px]"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, setDoc, getDocs, query, where, onSnapshot, orderBy, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAX_yrLx7ltNv6HXh4KMwioi-YxsO0WVCM", authDomain: "technokhareeg2.firebaseapp.com", projectId: "technokhareeg2", storageBucket: "technokhareeg2.firebasestorage.app", messagingSenderId: "526382735312", appId: "1:526382735312:web:cebbef6f52ac20f1c063d5" };
let db; try{ const app=initializeApp(firebaseConfig); db=getFirestore(app); }catch(e){}
var users=[], msgs=[], groups=[], posts=[];
var logged=false, cur=null, tab='الرئيسية', selChat=null, selGroup=null, auth='login', showPass=false, form={name:'',email:'',pass:''}, showCG=false, gName='', newPost='';
function toast(m){ var b=document.getElementById('toastBox'); var d=document.createElement('div'); d.className='px-4 py-3 rounded-2xl text-[12px] font-bold bg-[#1c2128] border border-[#2a3441] text-white text-center'; d.innerText=m; b.appendChild(d); setTimeout(()=>d.remove(),3000); }
window.toast=toast;
window.switchTab=function(k){ tab=k; selChat=null; selGroup=null; render(); }
window.setAuth=function(k){ auth=k; render(); }
window.togglePass=function(){ showPass=!showPass; render(); }
window.openChat=function(id){ selChat=id; selGroup=null; render(); }
window.openGroup=function(id){ selGroup=id; selChat=null; render(); }
window.backHome=function(){ selChat=null; selGroup=null; render(); }
window.toggleCreateGroup=function(){ showCG=!showCG; render(); }
function getPresenceText(id){ var u=users.find(x=>String(x.id)===String(id) || String(x.email)===String(id).toLowerCase()); if(!u) return '⚪ غير متصل'; var diff=Date.now()-(u.lastActive||0); if(diff<120000) return '🟢 متصل الآن'; var m=Math.floor(diff/60000); if(m<60) return '⚪ منذ '+m+' د'; var h=Math.floor(m/60); if(h<24) return '⚪ منذ '+h+' س'; return '⚪ منذ '+Math.floor(h/24)+' يوم'; }
function render(){
 var app=document.getElementById('app');
 if(!logged){
  var h='<div class="p-5 min-h-screen flex flex-col justify-center"><div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-3xl mx-auto flex items-center justify-center text-3xl">🔥</div><h1 class="font-black text-[22px] mt-3">تكنو خريج V6.3</h1><p class="text-[11px] text-[#9aa4b2]">✅ كل الأزرار شغالة 100% - Firebase متصل</p><div class="mt-2 bg-green-500/20 border rounded-xl p-2 text-[10px] text-green-300">🔥 '+users.length+' مستخدم حقيقي</div></div><div class="bg-[#1c2128] border border-[#2a3441] rounded-3xl p-5 space-y-3"><div class="flex gap-2"><button onclick="setAuth(\'login\')" class="flex-1 py-2.5 rounded-full text-[11px] font-bold '+(auth==='login'?'bg-[#3b82f6]':'bg-[#252f3d]')+'">دخول</button><button onclick="setAuth(\'reg\')" class="flex-1 py-2.5 rounded-full text-[11px] font-bold '+(auth==='reg'?'bg-[#3b82f6]':'bg-[#252f3d]')+'">حساب جديد</button></div>';
  if(auth==='reg'){ h+='<input id="fn" value="'+form.name+'" placeholder="الاسم" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[12px] outline-none">'; }
  h+='<input id="fe" value="'+form.email+'" placeholder="الإيميل" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[12px] outline-none"><div class="relative"><input id="fp" value="'+form.pass+'" type="'+(showPass?'text':'password')+'" placeholder="الباسورد" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[12px] outline-none"><button onclick="togglePass()" class="absolute left-3 top-1/2 -translate-y-1/2">👁️</button></div>';
  if(auth==='login'){ h+='<button onclick="doLogin()" class="w-full bg-[#3b82f6] py-3 rounded-full font-black">دخول 🔥</button><button onclick="form.email=\'ahmed@admin.com\';form.pass=\'admin123\';render();setTimeout(()=>{document.getElementById(\'fe\').value=\'ahmed@admin.com\';document.getElementById(\'fp\').value=\'admin123\';},100)" class="w-full bg-gradient-to-r from-[#f59e0b] to-[#d97706] py-2.5 rounded-full text-[10px] font-black text-black">👑 دخول الأدمن</button>'; }
  else{ h+='<button onclick="doReg()" class="w-full bg-[#10b981] py-3 rounded-full font-black">إنشاء حساب ✅</button>'; }
  h+='</div></div>'; app.innerHTML=h;
  setTimeout(()=>{ let fn=document.getElementById('fn'); if(fn) fn.oninput=e=>form.name=e.target.value; let fe=document.getElementById('fe'); if(fe) fe.oninput=e=>form.email=e.target.value; let fp=document.getElementById('fp'); if(fp) fp.oninput=e=>form.pass=e.target.value; },50); return;
 }
 var curGroup=groups.find(g=>String(g.id)===String(selGroup));
 var curChat=users.find(u=>String(u.id)===String(selChat) || String(u.email)===String(selChat));
 if(selChat||selGroup){
  var title=curGroup?curGroup.name:curChat?curChat.name:'شات'; var sub=curGroup?curGroup.members+' عضو':(curChat?getPresenceText(curChat.id||curChat.email):'');
  var hh='<div class="flex flex-col h-screen"><div class="p-3 bg-[#1c2128] border-b flex items-center gap-3"><button onclick="backHome()" class="text-xl">←</button><div class="w-9 h-9 bg-[#8b5cf6] rounded-full flex items-center justify-center font-bold">'+title[0]+'</div><div class="flex-1"><p class="font-bold text-[12px]">'+title+'</p><p class="text-[10px] text-[#9aa4b2]">'+sub+'</p></div></div><div class="flex-1 overflow-auto p-3 space-y-2">';
  var fMsgs=msgs.filter(m=> curGroup ? String(m.gid)===String(selGroup) : String(m.cid)===String(selChat));
  if(fMsgs.length===0) hh+='<p class="text-center text-[#6b7280] text-[11px] mt-10">ابدأ المحادثة 💬</p>';
  for(let mm of fMsgs){ let me=cur && String(mm.sid)===String(cur.id); hh+='<div class="flex '+(me?'justify-end':'justify-start')+'"><div class="max-w-[75%]"><div class="'+(me?'bg-[#3b82f6]':'bg-[#1c2128] border border-[#2a3441]')+' rounded-2xl px-3 py-2"><p class="text-[12px]">'+(mm.txt||'')+'</p></div></div></div>'; }
  hh+='</div><div class="p-2 bg-[#161b22] border-t flex gap-2"><input id="cin" placeholder="اكتب..." class="flex-1 bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-2.5 text-[12px] outline-none" onkeydown="if(event.key===\'Enter\')send()"><button onclick="send()" class="bg-[#3b82f6] w-9 h-9 rounded-full">➤</button></div></div>'; app.innerHTML=hh; return;
 }
 var html='<div class="p-3 space-y-3 pb-[100px]">';
 if(tab==='الرئيسية'){
  html+='<div class="bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-3xl p-4"><p class="font-black">👋 أهلاً '+cur.name+'</p><p class="text-[11px] mt-1">🔥 V6.3 - كل الأزرار شغالة 100%</p><div class="flex gap-2 mt-3"><span class="bg-black/30 px-3 py-1 rounded-full text-[10px]">🔥 '+users.length+' مستخدم</span><span class="bg-black/30 px-3 py-1 rounded-full text-[10px]">'+msgs.length+' رسالة</span></div></div><div class="grid grid-cols-2 gap-2"><div class="bg-[#1c2128] border rounded-2xl p-3"><p class="text-[11px] text-[#9aa4b2]">الخريجين</p><p class="font-black text-[18px]">'+users.length+'</p></div><div class="bg-[#1c2128] border rounded-2xl p-3"><p class="text-[11px] text-[#9aa4b2]">المنشورات</p><p class="font-black text-[18px]">'+posts.length+'</p></div></div>';
 }
 else if(tab==='الخريجين'){
  html+='<h2 class="font-black">👥 الخريجين - '+users.length+'</h2>';
  for(let u of users){ html+='<div class="bg-[#1c2128] border rounded-2xl p-3 flex gap-3 mt-2"><div class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">'+u.name[0]+'</div><div class="flex-1"><p class="font-bold text-[12px]">'+u.name+'</p><p class="text-[10px] text-[#9aa4b2]">'+getPresenceText(u.id||u.email)+'</p></div><button onclick="openChat(\''+(u.id||u.email)+'\')" class="bg-[#3b82f6] px-3 py-1.5 rounded-full text-[10px]">شات</button></div>'; }
 }
 else if(tab==='المتصدرين'){ html+='<h2 class="font-black">🏆 المتصدرين</h2>'; let s=[...users].sort((a,b)=>(b.points||0)-(a.points||0)); s.forEach((u,i)=>{ html+='<div class="bg-[#1c2128] border rounded-2xl p-3 flex gap-3 mt-2"><span>#'+(i+1)+'</span><div class="flex-1"><p class="font-bold text-[12px]">'+u.name+'</p></div></div>'; }); }
 else if(tab==='المختبر'){ html+='<h2 class="font-black">🧪 المختبر</h2><div class="bg-[#1c2128] border rounded-2xl p-4 mt-2"><p class="text-[12px]">قريباً اختبارات 💻</p><button onclick="toast(\'قريباً 🚀\')" class="mt-2 bg-[#8b5cf6] w-full py-2 rounded-full font-bold">ابدأ</button></div>'; }
 else if(tab==='الشات'){
  html+='<div class="flex justify-between items-center"><h2 class="font-black">💬 الشات</h2><button onclick="toggleCreateGroup()" class="bg-[#3b82f6] px-3 py-1 rounded-full text-[10px]">+ مجموعة</button></div>';
  if(showCG){ html+='<div class="bg-[#1c2128] border rounded-2xl p-3 space-y-2 mt-2"><input id="gn" placeholder="اسم المجموعة" class="w-full bg-[#0f1419] border rounded-full px-4 py-2 text-[11px]"><button onclick="createG()" class="w-full bg-[#10b981] py-2 rounded-full text-[11px] font-bold">إنشاء</button></div>'; }
  for(let g of groups){ html+='<div onclick="openGroup(\''+g.id+'\')" class="bg-[#1c2128] border rounded-2xl p-3 flex gap-3 mt-2 cursor-pointer"><div class="w-10 h-10 bg-[#10b981] rounded-full flex items-center justify-center">👥</div><div class="flex-1"><p class="font-bold text-[12px]">'+g.name+'</p><p class="text-[10px] text-[#9aa4b2]">'+(g.members||0)+' عضو</p></div></div>'; }
  for(let u of users){ if(cur && String(u.id||u.email)===String(cur.id)) continue; html+='<div onclick="openChat(\''+(u.id||u.email)+'\')" class="bg-[#1c2128] border rounded-2xl p-3 flex gap-3 mt-2 cursor-pointer"><div class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center">'+u.name[0]+'</div><div class="flex-1"><p class="font-bold text-[12px]">'+u.name+'</p><p class="text-[10px] text-green-400">'+getPresenceText(u.id||u.email)+'</p></div></div>'; }
 }
 else if(tab==='المنشورات'){
  html+='<h2 class="font-black">📝 المنشورات</h2><div class="bg-[#1c2128] border rounded-2xl p-3 mt-2"><textarea id="np" placeholder="شارك حاجة..." class="w-full bg-[#0f1419] border rounded-2xl p-3 text-[11px] min-h-[60px] outline-none">'+newPost+'</textarea><button onclick="doPost()" class="mt-2 bg-[#3b82f6] w-full py-2 rounded-full font-bold text-[11px]">نشر 🔥</button></div>';
  for(let p of posts){ html+='<div class="bg-[#1c2128] border rounded-2xl p-3 mt-2"><p class="font-bold text-[11px]">'+p.author+'</p><p class="text-[12px] mt-1">'+p.text+'</p></div>'; }
 }
 else if(tab==='حسابي'){ html+='<h2 class="font-black">👤 حسابي</h2><div class="bg-[#1c2128] border rounded-3xl p-5 text-center mt-2"><div class="w-20 h-20 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-full mx-auto flex items-center justify-center text-2xl">'+cur.name[0]+'</div><p class="font-black mt-2">'+cur.name+'</p><p class="text-[11px] text-[#9aa4b2]">'+cur.email+'</p><button onclick="logout()" class="mt-4 bg-red-500/20 border text-red-400 w-full py-2.5 rounded-full font-bold text-[11px]">خروج</button></div>'; }
 html+='</div><nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-2 z-20">';
 var tabs=[{k:'الرئيسية',i:'🏠'},{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'},{k:'المنشورات',i:'📝'},{k:'حسابي',i:'👤'}];
 for(let t of tabs){ html+='<button onclick="switchTab(\''+t.k+'\')" class="flex flex-col items-center text-[9px] '+(tab===t.k?'text-[#fbbf24]':'text-[#6b7280]')+'"><span class="text-[16px]">'+t.i+'</span>'+t.k+'</button>'; }
 html+='</nav>'; app.innerHTML=html;
 setTimeout(()=>{ let gn=document.getElementById('gn'); if(gn) gn.oninput=e=>gName=e.target.value; let np=document.getElementById('np'); if(np) np.oninput=e=>newPost=e.target.value; },50);
}
window.render=render;
window.doLogin=async function(){
 let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); if(fe) form.email=fe.value; if(fp) form.pass=fp.value;
 if(!form.email||!form.pass){ toast('اكتب البيانات'); return; }
 try{ let q=query(collection(db,"users"), where("email","==",form.email.toLowerCase()), where("pass","==",form.pass)); let snap=await getDocs(q); if(snap.empty){ toast('بيانات غلط'); return; } let data=snap.docs[0].data(); cur={...data, lastActive:Date.now()}; logged=true; localStorage.setItem('tk_cur',JSON.stringify(cur)); localStorage.setItem('tk_log','1'); await updateDoc(doc(db,"users",snap.docs[0].id), {lastActive:Date.now()}); render(); }catch(e){ toast('خطأ: '+e.message); }
}
window.doReg=async function(){
 let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); let fn=document.getElementById('fn'); if(fe) form.email=fe.value; if(fp) form.pass=fp.value; if(fn) form.name=fn.value;
 if(!form.name||!form.email||!form.pass){ toast('املأ البيانات'); return; }
 try{ let q=query(collection(db,"users"), where("email","==",form.email.toLowerCase())); let snap=await getDocs(q); if(!snap.empty){ toast('الإيميل مسجل'); return; } let nu={id:form.email.toLowerCase(),name:form.name,email:form.email.toLowerCase(),pass:form.pass,role:'user',lastActive:Date.now(),online:true,createdAt:Date.now()}; let ref=await addDoc(collection(db,"users"), nu); await setDoc(doc(db,"users",ref.id), {...nu, docId:ref.id}); cur={...nu, docId:ref.id}; logged=true; localStorage.setItem('tk_cur',JSON.stringify(cur)); localStorage.setItem('tk_log','1'); render(); }catch(e){ toast('خطأ: '+e.message); }
}
window.logout=function(){ logged=false; cur=null; localStorage.removeItem('tk_log'); localStorage.removeItem('tk_cur'); render(); }
window.createG=async function(){ if(!gName.trim()){ toast('اكتب اسم المجموعة'); return; } try{ let ng={id:Date.now(),name:gName,members:1,createdAt:Date.now()}; await addDoc(collection(db,"groups"), ng); showCG=false; gName=''; toast('تم إنشاء المجموعة'); }catch(e){ toast('خطأ'); } }
window.doPost=async function(){ let inp=document.getElementById('np'); if(inp) newPost=inp.value; if(!newPost.trim()){ toast('اكتب حاجة'); return; } try{ let np={id:Date.now(),author:cur.name,authorId:cur.id,text:newPost,time:new Date().toLocaleTimeString('ar-EG'),likes:0,createdAt:Date.now()}; await addDoc(collection(db,"posts"), np); newPost=''; toast('تم النشر'); }catch(e){ toast('خطأ'); } }
window.send=async function(){ let inp=document.getElementById('cin'); let t=inp?inp.value.trim():''; if(!t) return; try{ let m={id:Date.now(),txt:t,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; await addDoc(collection(db,"messages"), m); if(inp) inp.value=''; }catch(e){ toast('خطأ'); } }
async function initFirebase(){
 try{
  let q=query(collection(db,"users"), where("email","==","ahmed@admin.com")); let s=await getDocs(q); if(s.empty){ await addDoc(collection(db,"users"), {id:"ahmed@admin.com",name:"أحمد خالد مصطفى 👑",email:"ahmed@admin.com",pass:"admin123",role:"admin",lastActive:Date.now(),online:true}); }
  onSnapshot(collection(db,"users"), snap=>{ users=snap.docs.map(d=>d.data()); render(); });
  onSnapshot(query(collection(db,"messages"), orderBy("createdAt","asc")), snap=>{ msgs=snap.docs.map(d=>d.data()); render(); });
  onSnapshot(collection(db,"groups"), snap=>{ groups=snap.docs.map(d=>d.data()); if(groups.length===0) groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',members:5},{id:102,name:'فرص عمل 💼',members:4}]; render(); });
  onSnapshot(query(collection(db,"posts"), orderBy("createdAt","desc")), snap=>{ posts=snap.docs.map(d=>d.data()); render(); });
  let cl=JSON.parse(localStorage.getItem('tk_cur')||'null'); let ll=localStorage.getItem('tk_log')==='1'; if(cl&&ll){ cur=cl; logged=true; }
  render();
 }catch(e){ console.log(e); }
}
initFirebase();
</script>
</body>
</html>
