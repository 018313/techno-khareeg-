function normalizeArabic(text){ if(!text) return ''; return text.toLowerCase().trim().replace(/[ـ_]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^ء-ي\w\s]/g,' ').replace(/\s+/g,' ').trim(); }
function containsBadWord(text){
 if(!text) return false;
 var lower = text.toLowerCase().trim(); var normalized = normalizeArabic(text);
 var noSpace = lower.replace(/\s+/g,'').replace(/[ـ_\-\.\,\:\;\!\@\#\$\%\^\&\*\(\)\+\=\<\>\?\/\\\|]/g,''); var noSpaceNorm = normalized.replace(/\s+/g,'');
 for(var i=0;i<badWords.length;i++){
  var w = badWords[i].toLowerCase().trim(); var wNorm = normalizeArabic(w); var wNoSpace = w.replace(/\s+/g,'');
  if(lower.indexOf(w)>=0) return badWords[i]; if(normalized.indexOf(w)>=0) return badWords[i]; if(normalized.indexOf(wNorm)>=0) return badWords[i];
  if(noSpace.indexOf(w)>=0) return badWords[i]; if(noSpace.indexOf(wNoSpace)>=0) return badWords[i]; if(noSpaceNorm.indexOf(wNorm)>=0) return badWords[i];
  if(low.indexOf('كس')>=0 || low.indexOf('ك س')>=0) return 'كس';
 }
 return false;
}
function checkContent(text){

 return true;
}

function isAdmin(){ return cur && cur.email==='ahmed@admin.com'; }
function getPresenceText(id){
 var u = users.find(x=>String(x.id)===String(id) || x.email===String(id).toLowerCase());
 if(!u) return '⚪ غير متصل';
 if(u.lastActive){
  var diff = Date.now() - u.lastActive;
  if(diff < 2*60*1000) return '🟢 متصل الآن';
  var m=Math.floor(diff/60000); if(m<60) return '⚪ منذ '+m+' د';
  var h=Math.floor(m/60); if(h<24) return '⚪ منذ '+h+' س';
  return '⚪ منذ '+(Math.floor(h/24))+' يوم';
 }
 return u.online ? '🟢 متصل الآن' : '⚪ غير متصل';
}

window.doLogin = async function(){
 var e=document.getElementById('fe'); var p=document.getElementById('fp'); if(e) form.email=e.value; if(p) form.pass=p.value;
 if(!form.email || !form.pass){toast('اكتب البيانات',true); return;}
 if(useLocalFallback){
  var u=users.find(x=>x.email.toLowerCase()===form.email.toLowerCase()); if(!u || u.pass!==form.pass){toast('بيانات غلط',true); return;}
  logged=true; cur={id:u.email.toLowerCase(),name:u.name,email:u.email,role:u.role,pic:u.pic||'',lastActive:Date.now()}; localStorage.setItem('tk_log','1'); localStorage.setItem('tk_cur',JSON.stringify(cur)); render(); toast('أهلاً '+cur.name); return;
 }
 try{
  var q = query(collection(db, "users"), where("email","==",form.email.toLowerCase()), where("pass","==",form.pass));
  var snap = await getDocs(q);
  if(snap.empty){ toast('بيانات غلط - اعمل حساب جديد',true); return; }
  var uDoc = snap.docs[0].data();
  cur = {...uDoc, lastActive: Date.now()}; logged=true;

  await updateDoc(doc(db,"users",snap.docs[0].id), {lastActive: Date.now(), online:true});
  render(); toast('أهلاً '+cur.name+' 🔥');
 }catch(err){ toast('خطأ: '+err.message, true); console.error(err); }
}

window.startR = async function(){
 if(isRec) return; try{ var stream=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(stream); chunks=[]; isRec=true; recTime=0; rec.ondataavailable=function(e){chunks.push(e.data);}; rec.onstop=function(){ var blob=new Blob(chunks,{type:'audio/webm'}); var r=new FileReader(); r.onload=function(ev){ var b={id: Date.now(), type:'voice', aud: ev.target.result, dur: recTime+'s', sid: cur.id, sname: cur.name, time: new Date().toLocaleTimeString('ar-EG'), cid: selChat?String(selChat):null, gid: selGroup?String(selGroup):null, createdAt: Date.now()}; if(useLocalFallback){ msgs.push(b); saveM(); render(); } else { addDoc(collection(db,"messages"), b); } }; r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop()); }; rec.start(); recInt=setInterval(function(){recTime++; var inp=document.getElementById('cin'); if(inp) inp.placeholder='🔴 '+recTime+'s';},1000); render(); toast('🎤 جاري التسجيل...'); }catch(err){toast('الميك مش شغال',true);}
}
window.stopR = function(){ if(!isRec||!rec) return; rec.stop(); isRec=false; clearInterval(recInt); render(); }

// ==================== تهيئة Firebase والـ listeners ====================
async function initFirebase(){
 window._fbConnected = false;
 try{
  // إنشاء المستخدمين الافتراضيين لو مش موجودين
  var adminQ = query(collection(db,"users"), where("email","==","ahmed@admin.com"));
  var adminSnap = await getDocs(adminQ);
  if(adminSnap.empty){ await addDoc(collection(db,"users"), {id:"ahmed@admin.com",name:"أحمد خالد مصطفى 👑",email:"ahmed@admin.com",pass:"admin123",role:"admin",city:"القاهرة",job:"مؤسس المنصة",lastActive:Date.now(),online:true}); }
  var juryQ = query(collection(db,"users"), where("email","==","jury@edu-tech.com"));
  var jurySnap = await getDocs(juryQ);
  if(jurySnap.empty){ await addDoc(collection(db,"users"), {id:"jury@edu-tech.com",name:"لجنة التحكيم 🎓",email:"jury@edu-tech.com",pass:"123456",role:"jury",city:"المنصورة",job:"لجنة التحكيم",lastActive:Date.now(),online:true}); }

  // listeners لحظية
  onSnapshot(collection(db,"users"), (snap)=>{
    users = snap.docs.map(d=>{ var data=d.data(); return {...data, docId:d.id, lastActive: data.lastActive||Date.now()}; });
    window._fbConnected=true; if(logged) render();
  });
  onSnapshot(query(collection(db,"messages"), orderBy("createdAt","asc")), (snap)=>{
    msgs = snap.docs.map(d=>{ var data=d.data(); return {...data, docId:d.id}; });
    window._fbConnected=true; render();
  });
  onSnapshot(collection(db,"groups"), (snap)=>{
    groups = snap.docs.map(d=>d.data()); if(groups.length===0){ groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:5,desc:'جروب الدفعة'},{id:102,name:'فرص عمل - TIEC 💼',img:'💼',members:4,desc:'وظائف'}]; } window._fbConnected=true; render();
  });
  onSnapshot(query(collection(db,"posts"), orderBy("createdAt","desc")), (snap)=>{
    posts = snap.docs.map(d=>d.data()); window._fbConnected=true; render();
  });

  // تحميل أولي
  var curLocal = JSON.parse(localStorage.getItem('tk_cur')||'null');
  var logLocal = localStorage.getItem('tk_log')==='1';
  if(curLocal && logLocal){ cur=curLocal; logged=true; }
  window._fbConnected=true;
  render();
  toast('🔥 Firebase متصل - كل شيء لحظي!');
 }catch(err){
  console.error("Firebase error, fallback to local", err);
  useLocalFallback=true;
  initLocal();
  toast('⚠️ Firebase لم يتصل - شغال محلي مؤقتاً', true);
 }
}

function initLocal(){
 console.log("Init local fallback");
 users=JSON.parse(localStorage.getItem('tk_u')||'[]');
 if(!users.find(u=>u.email==='ahmed@admin.com')){users.push({id:'ahmed@admin.com',name:'أحمد خالد مصطفى',email:'ahmed@admin.com',pass:'admin123',role:'admin',lastActive:Date.now()}); localStorage.setItem('tk_u',JSON.stringify(users));}
 if(!users.find(u=>u.email==='jury@edu-tech.com')){users.push({id:'jury@edu-tech.com',name:'لجنة التحكيم',email:'jury@edu-tech.com',pass:'123456',role:'jury',lastActive:Date.now()}); localStorage.setItem('tk_u',JSON.stringify(users));}
 msgs=JSON.parse(localStorage.getItem('tk_m')||'[]');
 groups=JSON.parse(localStorage.getItem('tk_g')||'[]');
 posts=JSON.parse(localStorage.getItem('tk_p')||'[]');
 if(groups.length===0){groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:5,desc:'جروب الدفعة'},{id:102,name:'فرص عمل - TIEC 💼',img:'💼',members:4,desc:'وظائف'},{id:103,name:'مشاريع التخرج 🚀',img:'🚀',members:4,desc:'مشاريع'}]; localStorage.setItem('tk_g',JSON.stringify(groups));}
 if(posts.length===0){posts=[{id:1,author:'سارة محمد',text:'المنصة الجديدة جامدة! مجموعات + صور + فويس 🔥',time:'منذ ساعة',likes:12,img:'س'},{id:2,author:'محمود أحمد',text:'مين عنده فرصة Backend؟',time:'منذ 3 ساعات',likes:5,img:'م'}]; localStorage.setItem('tk_p',JSON.stringify(posts));}
 var curLocal = JSON.parse(localStorage.getItem('tk_cur')||'null');
 var logLocal = localStorage.getItem('tk_log')==='1';
 if(curLocal && logLocal){ cur=curLocal; logged=true; }
 render();
}

if(!useLocalFallback){
 initFirebase();
} else {
 initLocal();
}
