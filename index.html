<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تكنو خريج - لايف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Cairo',sans-serif;box-sizing:border-box}
    body{background:#0f172a;color:white;margin:0;padding:10px}
    .header{text-align:center;padding:20px 0}
    .header h1{color:#38bdf8;margin:0;font-size:28px}
    .header p{color:#94a3b8}
    .container{max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr;gap:20px}
    @media(min-width:800px){.container{grid-template-columns:1fr 1fr}}
    .box{background:#1e293b;padding:18px;border-radius:15px}
    .box h3{color:#38bdf8;margin-top:0}
    input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#0f172a;color:white}
    button{width:100%;padding:12px;background:#38bdf8;color:#0f172a;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:5px}
    .card{background:#0f172a;padding:12px;border-radius:10px;margin:8px 0;border-right:4px solid #38bdf8}
    #chatBox{height:350px;overflow-y:auto;background:#0f172a;border-radius:10px;padding:10px;margin-bottom:10px}
    .msg{background:#1e293b;padding:8px 12px;border-radius:12px;margin:6px 0;max-width:90%}
    .msg b{color:#38bdf8}
    .msg span{color:#94a3b8;font-size:12px;display:block}
    .live-dot{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;animation:blink 1s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  </style>
</head>
<body>

<div class="header">
  <h1>🎓 تكنو خريج <span class="live-dot"></span> LIVE</h1>
  <p>🔥 منصة خريجين المعهد - شات مباشر مربوط بـ Firebase</p>
</div>

<div class="container">
  <div class="box">
    <h3>➕ إضافة خريج</h3>
    <input id="name" placeholder="الاسم: أحمد">
    <input id="dept" placeholder="القسم: تكنولوجيا التعليم">
    <input id="year" placeholder="السنة: 2023">
    <button onclick="addUser()">إضافة +</button>
    <hr style="margin:15px 0;border-color:#334155">
    <h3>👥 الخريجين - لايف</h3>
    <div id="users">جاري التحميل...</div>
  </div>

  <div class="box">
    <h3>💬 الشات العام - لايف <span class="live-dot"></span></h3>
    <div id="chatBox"></div>
    <input id="chatName" placeholder="اسمك في الشات">
    <input id="chatMsg" placeholder="اكتب رسالتك هنا...">
    <button onclick="sendMsg()" style="background:#22c55e">إرسال 🚀</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAX_yrLx7ltNv6HXh4KMwioi-YxsO0WVCM",
    authDomain: "technokhareeg2.firebaseapp.com",
    projectId: "technokhareeg2",
    storageBucket: "technokhareeg2.firebasestorage.app",
    messagingSenderId: "526382735312",
    appId: "1:526382735312:web:8ac2463836cadc37c063d5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // لايف للخريجين
  onSnapshot(collection(db, "المستخدمون"), (snap) => {
    const container = document.getElementById('users');
    if (snap.empty) { container.innerHTML = "لا يوجد أحد بعد"; return; }
    let html = "";
    snap.forEach(doc => {
      const d = doc.data();
      html += `<div class="card"><b>👤 ${d.name || doc.id}</b><br><small>القسم: ${d.department || d.dept || ''} | السنة: ${d.year || ''}</small></div>`;
    });
    container.innerHTML = html;
  });

  // لايف للشات
  const q = query(collection(db, "الشات"), orderBy("time","asc"));
  onSnapshot(q, (snap) => {
    const box = document.getElementById('chatBox');
    let html = "";
    snap.forEach(doc => {
      const d = doc.data();
      const t = d.time?.toDate ? d.time.toDate().toLocaleTimeString('ar-EG') : 'الآن';
      html += `<div class="msg"><b>${d.sender}:</b> ${d.text}<span>${t}</span></div>`;
    });
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  });

  window.addUser = async function() {
    const name = document.getElementById('name').value;
    const dept = document.getElementById('dept').value;
    const year = document.getElementById('year').value;
    if(!name) return alert("اكتب الاسم");
    await addDoc(collection(db, "المستخدمون"), { name, department: dept, year, createdAt: serverTimestamp() });
    document.getElementById('name').value="";document.getElementById('dept').value="";document.getElementById('year').value="";
  }

  window.sendMsg = async function() {
    const sender = document.getElementById('chatName').value || "مجهول";
    const text = document.getElementById('chatMsg').value;
    if(!text) return;
    await addDoc(collection(db, "الشات"), { sender, text, time: serverTimestamp() });
    document.getElementById('chatMsg').value="";
  }
</script>
</body>
</html>
