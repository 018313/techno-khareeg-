<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكنو خريج - V6.1 شغال كامل 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Tajawal',sans-serif} body{background:#0f1419;color:white} .scroll{overflow-y:auto} .scroll::-webkit-scrollbar{width:0}</style>
</head>
<body>
<div id="app" class="max-w-[480px] mx-auto min-h-screen bg-[#0f1419] pb-[80px] flex items-center justify-center"><p class="text-center">⏳ جاري الاتصال بـ Firebase...</p></div>
<div id="toastBox" class="fixed bottom-[90px] left-1/2 -translate-x-1/2 z-[200] space-y-2 w-[90%] max-w-[380px]"></div>
<input type="file" id="imgInput" accept="image/*" class="hidden"><input type="file" id="profilePicInput" accept="image/*" class="hidden">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, getDocs, query, where, onSnapshot, orderBy, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX_yrLx7ltNv6HXh4KMwioi-YxsO0WVCM",
  authDomain: "technokhareeg2.firebaseapp.com",
  projectId: "technokhareeg2",
  storageBucket: "technokhareeg2.firebasestorage.app",
  messagingSenderId: "526382735312",
  appId: "1:526382735312:web:cebbef6f52ac20f1c063d5"
};

let db; let useLocalFallback=false;
try{ const app=initializeApp(firebaseConfig); db=getFirestore(app); setTimeout(()=>{ if(!window._fbConnected){ useLocalFallback=true; initLocal(); } },4000); }catch(e){ useLocalFallback=true; }

var grads=[
{id:1,name:'أحمد خالد مصطفى 👑',job:'مؤسس المنصة - الأدمن',city:'القاهرة',img:'أ',points:999,admin:true},
{id:2,name:'سارة محمد',job:'Instructional Designer',city:'المنصورة',img:'س',points:510},
{id:3,name:'محمود أحمد',job:'Backend - Vezeeta',city:'الإسكندرية',img:'م',points:480},
];

var users=[], msgs=[], groups=[], posts=[];
var logged=false, cur=null, tab='الرئيسية', showPass=false, selChat=null, selGroup=null, auth='login';
var form={name:'',email:'',pass:''};
var isRec=false, rec=null, chunks=[], recTime=0, recInt=null;
var showCG=false, gName='', selM=[], newPost='';

function toast(m,err){
 var box=document.getElementById('toastBox'); if(!box) return; var d=document.createElement('div');
 d.className='px-4 py-3 rounded-2xl text-[12px] font-bold text-center border '+(err?'bg-red-500/90 border-red-400':'bg-[#1c2128] border-[#2a3441]')+' text-white whitespace-pre-wrap';
 d.innerText=m; box.appendChild(d); setTimeout(()=>d.remove(), err?6000:3000);
}

var badWords=['كس','طيز','شرموط','fuck','shit'];
function checkContent(text){ return true; }

function saveM(){ if(useLocalFallback) localStorage.setItem('tk_m',JSON.stringify(msgs)); }
function saveG(){ if(useLocalFallback) localStorage.setItem('tk_g',JSON.stringify(groups)); }
function saveP(){ if(useLocalFallback) localStorage.setItem('tk_p',JSON.stringify(posts)); }

window.deleteMsg = async function(id){
 if(!confirm('مسح الرسالة؟')) return;
 if(useLocalFallback){ msgs=msgs.filter(m=>String(m.id)!==String(id)); saveM(); render(); return; }
 try{ let q=query(collection(db,"messages"), where("id","==",Number(id))); let snap=await getDocs(q); for(let d of snap.docs) await deleteDoc(doc(db,"messages",d.id)); }catch(e){ toast('خطأ',true); }
}
window.deletePost = async function(id){
 if(!confirm('مسح المنشور؟')) return;
 if(useLocalFallback){ posts=posts.filter(p=>String(p.id)!==String(id)); saveP(); render(); return; }
 try{ let q=query(collection(db,"posts"), where("id","==",Number(id))); let snap=await getDocs(q); for(let d of snap.docs) await deleteDoc(doc(db,"posts",d.id)); }catch(e){}
}

function isAdmin(){ return cur && cur.email==='ahmed@admin.com'; }
function getPresenceText(id){
 var u=users.find(x=>String(x.id)===String(id) || String(x.email)===String(id).toLowerCase());
 if(!u) return '⚪ غير متصل';
 var diff=Date.now()-(u.lastActive||0);
 if(diff<2*60*1000) return '🟢 متصل الآن';
 var m=Math.floor(diff/60000); if(m<60) return '⚪ منذ '+m+' د';
 var h=Math.floor(m/60); if(h<24) return '⚪ منذ '+h+' س';
 return '⚪ منذ '+Math.floor(h/24)+' يوم';
}

window.render = function(){
 var app=document.getElementById('app'); if(!app) return;
 if(!logged){
  var html='<div class="p-5 min-h-screen flex flex-col justify-center">';
  html+='<div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-3xl mx-auto flex items-center justify-center text-3xl">🔥</div><h1 class="font-black text-[22px] mt-3">تكنو خريج V6.1</h1><p class="text-[12px] text-[#9aa4b2]">✅ كل الحسابات تظهر عند بعض - متصل حقيقي</p></div>';
  html+='<div class="bg-[#1c2128] border border-[#2a3441] rounded-3xl p-5 space-y-3">';
  html+='<div class="flex gap-2"><button onclick="auth=\'login\';render()" class="flex-1 py-2.5 rounded-full text-[12px] font-bold '+(auth==='login'?'bg-[#3b82f6]':'bg-[#252f3d]')+'">دخول</button><button onclick="auth=\'reg\';render()" class="flex-1 py-2.5 rounded-full text-[12px] font-bold '+(auth==='reg'?'bg-[#3b82f6]':'bg-[#252f3d]')+'">حساب جديد</button></div>';
  if(auth==='reg'){html+='<input id="fn" value="'+form.name+'" placeholder="الاسم الكامل" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">';}
  html+='<input id="fe" value="'+form.email+'" placeholder="الإيميل" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">';
  html+='<div class="relative"><input id="fp" value="'+form.pass+'" type="'+(showPass?'text':'password')+'" placeholder="الباسورد" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none"><button onclick="showPass=!showPass;render()" class="absolute left-3 top-1/2 -translate-y-1/2">👁️</button></div>';
  if(auth==='login'){ html+='<button onclick="doLogin()" class="w-full bg-[#3b82f6] py-3 rounded-full font-black">دخول 🔥</button><button onclick="document.getElementById(\'fe\').value=\'ahmed@admin.com\';document.getElementById(\'fp\').value=\'admin123\';form.email=\'ahmed@admin.com\';form.pass=\'admin123\';render()" class="w-full bg-gradient-to-r from-[#f59e0b] to-[#d97706] py-2.5 rounded-full text-[11px] font-black text-black">👑 دخول الأدمن</button>'; }
  else { html+='<button onclick="doReg()" class="w-full bg-[#10b981] py-3 rounded-full font-black">إنشاء حساب - سيظهر عند الكل ✅</button>'; }
  html+='</div></div>';
  app.innerHTML=html;
  setTimeout(()=>{
    let fn=document.getElementById('fn'); if(fn) fn.oninput=function(){form.name=this.value;};
    let fe=document.getElementById('fe'); if(fe) fe.oninput=function(){form.email=this.value;};
    let fp=document.getElementById('fp'); if(fp) fp.oninput=function(){form.pass=this.value;};
  },50);
  return;
 }
 // داخل الشات
 var curGroup=groups.find(g=>String(g.id)===String(selGroup));
 var curChat=users.find(g=>String(g.id)===String(selChat) || String(g.email)===String(selChat)) || grads.find(g=>String(g.id)===String(selChat));
 if(selChat||selGroup){
  var title=curGroup?curGroup.name:curChat?curChat.name:'محادثة'; var img=curGroup?curGroup.img:curChat?(curChat.img||curChat.name[0]):'💬';
  var sub=curGroup?curGroup.members+' عضو':(curChat?getPresenceText(curChat.id||curChat.email):'');
  var html='<div class="flex flex-col h-screen"><div class="p-3 bg-[#1c2128] border-b border-[#2a3441] flex items-center gap-3"><button onclick="selChat=null;selGroup=null;render()" class="text-xl">←</button><div class="w-9 h-9 bg-[#8b5cf6] rounded-full flex items-center justify-center font-bold">'+img+'</div><div class="flex-1"><p class="font-bold text-[13px]">'+title+'</p><p class="text-[10px] '+(sub.includes('متصل الآن')?'text-green-400':'text-[#9aa4b2]')+'">'+sub+'</p></div></div>';
  var fMsgs=msgs.filter(m=> curGroup ? String(m.gid)===String(selGroup) : (String(m.cid)===String(selChat) || String(m.sid)===String(selChat)) );
  html+='<div class="flex-1 overflow-auto p-3 space-y-2 scroll">';
  if(fMsgs.length===0) html+='<p class="text-center text-[#6b7280] text-[11px] mt-10">ابدأ المحادثة 💬<br>🔥 رسائلك تظهر لحظياً</p>';
  for(var mm of fMsgs){ var me=cur && String(mm.sid)===String(cur.id); var canDelete=me||isAdmin();
   if(mm.type==='img'){ html+='<div class="flex '+(me?'justify-end':'justify-start')+'"><div class="max-w-[70%]"><img src="'+mm.img+'" class="rounded-2xl max-w-full"><div class="flex justify-between mt-1"><p class="text-[9px] text-[#9aa4b2]">'+(mm.time||'')+'</p>'+(canDelete?'<button onclick="deleteMsg(\''+mm.id+'\')" class="text-[9px] bg-red-500 px-2 py-0.5 rounded-full">🗑️</button>':'')+'</div></div></div>'; }
   else if(mm.type==='voice'){ html+='<div class="flex '+(me?'justify-end':'justify-start')+'"><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-2 flex items-center gap-2"><span>🎤</span><audio controls src="'+mm.aud+'" class="w-[100px] h-[30px]"></audio>'+(canDelete?'<button onclick="deleteMsg(\''+mm.id+'\')" class="text-red-400">🗑️</button>':'')+'</div></div>'; }
   else { html+='<div class="flex '+(me?'justify-end':'justify-start')+'"><div class="max-w-[75%]"><div class="'+(me?'bg-[#3b82f6]':'bg-[#1c2128] border border-[#2a3441]')+' rounded-2xl px-3 py-2"><p class="text-[12px]">'+(mm.txt||'')+'</p><p class="text-[8px] text-white/60 mt-1">'+(mm.time||'')+'</p></div>'+(canDelete?'<button onclick="deleteMsg(\''+mm.id+'\')" class="mt-1 text-[10px] bg-red-500 px-3 py-1 rounded-full font-bold">🗑️ مسح</button>':'')+'</div></div>'; }
  }
  html+='</div><div class="p-2 bg-[#161b22] border-t border-[#2a3441] flex gap-2 items-center"><button onclick="pickImg()" class="w-9 h-9 bg-[#252f3d] rounded-full">📸</button><button onclick="isRec?stopR():startR()" class="w-9 h-9 '+(isRec?'bg-red-500':'bg-[#252f3d]')+' rounded-full">'+(isRec?'⏹️':'🎤')+'</button><input id="cin" placeholder="اكتب..." class="flex-1 bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-2.5 text-[12px] outline-none" onkeydown="if(event.key===\'Enter\')send()"><button onclick="send()" class="bg-[#3b82f6] w-9 h-9 rounded-full">➤</button></div></div>';
  app.innerHTML=html; return;
 }

 var html='<div class="p-3 space-y-3">';

 // الرئيسية
 if(tab==='الرئيسية'){
  html+='<div class="bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-3xl p-4"><p class="font-black">👋 أهلاً '+cur.name+'</p><p class="text-[11px] mt-1">🔥 V6.1 Firebase - كل الحسابات تظهر عند بعض - متصل حقيقي</p><div class="flex gap-2 mt-3"><span class="bg-black/30 px-3 py-1 rounded-full text-[10px]">🔥 '+users.length+' مستخدم</span><span class="bg-black/30 px-3 py-1 rounded-full text-[10px]">'+msgs.length+' رسالة لحظية</span></div></div>';
  if(isAdmin()){html+='<div class="bg-[#f59e0b]/10 border border-[#f59e0b]/30 rounded-2xl p-3"><p class="font-bold text-[12px] text-[#fbbf24]">👑 لوحة تحكم الأدمن</p><p class="text-[10px] text-[#9aa4b2]">'+users.length+' مستخدم حقيقي • '+msgs.length+' رسالة</p></div>';}
  html+='<div class="grid grid-cols-2 gap-2"><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3"><p class="text-[11px] text-[#9aa4b2]">الخريجين</p><p class="font-black text-[18px]">'+(users.length+grads.length)+'</p></div><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3"><p class="text-[11px] text-[#9aa4b2]">المنشورات</p><p class="font-black text-[18px]">'+posts.length+'</p></div></div>';
 }
 // الخريجين
 else if(tab==='الخريجين'){
  html+='<h2 class="font-black text-[16px]">👥 الخريجين - '+users.length+' حقيقي</h2><p class="text-[10px] text-[#9aa4b2]">كل اللي سجل يظهر هنا لحظياً</p>';
  let allUsers=[...users];
  for(let u of allUsers){
   html+='<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex items-center gap-3 mt-2"><div class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">'+(u.name?u.name[0]:'U')+'</div><div class="flex-1"><p class="font-bold text-[13px]">'+u.name+'</p><p class="text-[10px] text-[#9aa4b2]">'+(u.job||'خريج')+' • '+getPresenceText(u.id||u.email)+'</p></div><button onclick="selChat=\''+(u.id||u.email)+'\';render()" class="bg-[#3b82f6] px-3 py-1.5 rounded-full text-[11px]">شات</button></div>';
  }
  for(let g of grads){
   html+='<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex items-center gap-3 mt-2 opacity-70"><div class="w-10 h-10 bg-[#252f3d] rounded-full flex items-center justify-center">'+g.img+'</div><div class="flex-1"><p class="font-bold text-[13px]">'+g.name+'</p><p class="text-[10px] text-[#9aa4b2]">'+g.job+'</p></div></div>';
  }
 }
 // المتصدرين
 else if(tab==='المتصدرين'){
  html+='<h2 class="font-black">🏆 المتصدرين</h2>';
  let sorted=[...users].sort((a,b)=>(b.points||0)-(a.points||0));
  sorted.forEach((u,i)=>{ html+='<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3 mt-2"><span class="font-black">'+(i+1)+'</span><div class="flex-1"><p class="font-bold text-[13px]">'+u.name+'</p><p class="text-[10px] text-[#9aa4b2]">'+(u.points||0)+' نقطة</p></div></div>'; });
 }
 // المختبر
 else if(tab==='المختبر'){
  html+='<h2 class="font-black">🧪 المختبر</h2><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-4 mt-2"><p class="text-[13px]">أهلاً بيك في مختبر تكنو خريج! قريباً اختبارات وتحديات 💻</p><button onclick="toast(\'قريباً 🚀\')" class="mt-3 bg-[#8b5cf6] w-full py-2 rounded-full font-bold">ابدأ الاختبار</button></div>';
 }
 // الشات
 else if(tab==='الشات'){
  html+='<div class="flex justify-between items-center"><h2 class="font-black">💬 الشات</h2><button onclick="showCG=true;render()" class="bg-[#3b82f6] px-3 py-1 rounded-full text-[11px]">+ مجموعة</button></div>';
  if(showCG){
   html+='<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 space-y-2 mt-2"><input id="gn" value="'+gName+'" placeholder="اسم المجموعة" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-2 text-[12px]"><div class="max-h-[120px] overflow-auto space-y-1">';
   for(let u of users){ html+='<label class="flex items-center gap-2 text-[12px]"><input type="checkbox" '+(selM.includes(u.id||u.email)?'checked':'')+' onclick="toggleM(\''+(u.id||u.email)+'\')"> '+u.name+'</label>'; }
   html+='</div><div class="flex gap-2"><button onclick="createG()" class="flex-1 bg-[#10b981] py-2 rounded-full text-[12px] font-bold">إنشاء</button><button onclick="showCG=false;render()" class="flex-1 bg-[#252f3d] py-2 rounded-full text-[12px]">إلغاء</button></div></div>';
  }
  for(let g of groups){
   html+='<div onclick="selGroup=\''+g.id+'\';render()" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3 mt-2 cursor-pointer"><div class="w-10 h-10 bg-[#10b981] rounded-full flex items-center justify-center">'+(g.img||'👥')+'</div><div class="flex-1"><p class="font-bold text-[13px]">'+g.name+'</p><p class="text-[10px] text-[#9aa4b2]">'+(g.members||0)+' عضو</p></div></div>';
  }
  for(let u of users){ if(cur && String(u.id||u.email)===String(cur.id)) continue;
   html+='<div onclick="selChat=\''+(u.id||u.email)+'\';render()" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3 mt-2 cursor-pointer"><div class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center">'+(u.name?u.name[0]:'U')+'</div><div class="flex-1"><p class="font-bold text-[13px]">'+u.name+'</p><p class="text-[10px] '+(getPresenceText(u.id||u.email).includes('متصل الآن')?'text-green-400':'text-[#9aa4b2]')+'">'+getPresenceText(u.id||u.email)+'</p></div><span class="text-[#6b7280]">💬</span></div>';
  }
 }
 // المنشورات
 else if(tab==='المنشورات'){
  html+='<h2 class="font-black">📝 المنشورات</h2><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 mt-2"><textarea id="np" placeholder="شارك حاجة مع الخريجين..." class="w-full bg-[#0f1419] border border-[#2a3441] rounded-2xl p-3 text-[12px] min-h-[70px] outline-none">'+newPost+'</textarea><button onclick="doPost()" class="mt-2 bg-[#3b82f6] w-full py-2 rounded-full font-bold text-[12px]">نشر للكل 🔥</button></div>';
  for(let p of posts){
   html+='<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 mt-2"><div class="flex gap-2 items-center"><div class="w-8 h-8 bg-[#8b5cf6] rounded-full flex items-center justify-center text-[12px]">'+(p.img||p.author[0])+'</div><div class="flex-1"><p class="font-bold text-[12px]">'+p.author+'</p><p class="text-[9px] text-[#9aa4b2]">'+(p.time||'')+'</p></div>'+((cur && (p.authorId===cur.id || isAdmin()))?'<button onclick="deletePost(\''+p.id+'\')" class="text-red-400 text-[11px]">🗑️</button>':'')+'</div><p class="mt-2 text-[13px]">'+(p.text||'')+'</p><div class="flex gap-2 mt-2"><button onclick="likeP(\''+p.id+'\')" class="text-[11px] text-[#9aa4b2]">❤️ '+(p.likes||0)+'</button></div></div>';
  }
  if(posts.length===0) html+='<p class="text-center text-[#6b7280] text-[11px] mt-10">لا يوجد منشورات بعد - كن أول من ينشر! 🔥</p>';
 }
 // حسابي
 else if(tab==='حسابي'){
  html+='<h2 class="font-black">👤 حسابي</h2><div class="bg-[#1c2128] border border-[#2a3441] rounded-3xl p-5 text-center mt-2"><div onclick="pickProfilePic()" class="w-20 h-20 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-full mx-auto flex items-center justify-center text-2xl cursor-pointer">'+(cur.pic?'<img src="'+cur.pic+'" class="w-full h-full rounded-full object-cover">':cur.name[0])+'</div><p class="font-black mt-2">'+cur.name+'</p><p class="text-[11px] text-[#9aa4b2]">'+cur.email+'</p><p class="text-[10px] text-green-400 mt-1">'+(cur.role==='admin'?'👑 الأدمن':'خريج')+'</p><button onclick="logout()" class="mt-4 bg-red-500/20 border border-red-500/30 text-red-400 w-full py-2.5 rounded-full font-bold text-[12px]">تسجيل خروج</button></div><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 mt-3"><p class="font-bold text-[12px]">🔥 حالة الاتصال</p><p class="text-[11px] text-[#9aa4b2] mt-1">Firebase: '+(useLocalFallback?'❌ محلي':'✅ متصل')+'</p><p class="text-[11px] text-[#9aa4b2]">المستخدمين: '+users.length+' حقيقي</p><p class="text-[11px] text-[#9aa4b2]">الرسائل: '+msgs.length+'</p></div>';
 }

 html+='</div><nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-1.5 z-20">';
 var tabs=[{k:'الرئيسية',i:'🏠'},{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'},{k:'المنشورات',i:'📝'},{k:'حسابي',i:'👤'}];
 for(var t of tabs){ html+='<button onclick="tab=\''+t.k+'\';render()" class="flex flex-col items-center text-[9px] '+(tab===t.k?'text-[#fbbf24]':'text-[#6b7280]')+'"><span class="text-[16px]">'+t.i+'</span>'+t.k+'</button>';}
 html+='</nav>';
 app.innerHTML=html;
 setTimeout(()=>{
  let gn=document.getElementById('gn'); if(gn) gn.oninput=function(){gName=this.value;};
  let np=document.getElementById('np'); if(np) np.oninput=function(){newPost=this.value;};
 },50);
}

window.doLogin = async function(){
 var e=document.getElementById('fe'); var p=document.getElementById('fp'); if(e) form.email=e.value; if(p) form.pass=p.value;
 if(!form.email||!form.pass){toast('اكتب البيانات',true); return;}
 if(useLocalFallback){
  var u=users.find(x=>String(x.email).toLowerCase()===form.email.toLowerCase()); if(!u||u.pass!==form.pass){toast('بيانات غلط',true); return;}
  logged=true; cur={id:u.email.toLowerCase(),name:u.name,email:u.email,role:u.role,pic:u.pic||'',lastActive:Date.now()}; localStorage.setItem('tk_log','1'); localStorage.setItem('tk_cur',JSON.stringify(cur)); render(); return;
 }
 try{
  let q=query(collection(db,"users"), where("email","==",form.email.toLowerCase()), where("pass","==",form.pass));
  let snap=await getDocs(q);
  if(snap.empty){ toast('بيانات غلط - اعمل حساب جديد',true); return; }
  let data=snap.docs[0].data(); cur={...data, lastActive:Date.now()}; logged=true;
  localStorage.setItem('tk_cur',JSON.stringify(cur)); localStorage.setItem('tk_log','1');
  await updateDoc(doc(db,"users",snap.docs[0].id), {lastActive:Date.now(), online:true});
  render(); toast('أهلاً '+cur.name+' 🔥');
 }catch(err){ toast('خطأ: '+err.message,true); }
}

 }

window.logout = function(){ logged=false; cur=null; localStorage.removeItem('tk_log'); localStorage.removeItem('tk_cur'); selChat=null; selGroup=null; render(); }
window.toggleM = function(id){ let i=selM.indexOf(id); if(i>=0) selM.splice(i,1); else selM.push(id); render(); }
window.createG = async function(){
 if(!gName.trim()){toast('اكتب اسم المجموعة',true); return;}
 if(useLocalFallback){ let ng={id:Date.now(),name:gName,img:'👥',members:selM.length+1,desc:'أنشأها '+cur.name}; groups.push(ng); saveG(); showCG=false; gName=''; selM=[]; render(); selGroup=ng.id; render(); return; }
 try{ let ng={id:Date.now(),name:gName,img:'👥',members:selM.length+1,desc:'أنشأها '+cur.name,createdBy:cur.id,createdAt:Date.now()}; await addDoc(collection(db,"groups"), ng); showCG=false; gName=''; selM=[]; toast('✅ تم إنشاء المجموعة'); }catch(e){ toast('خطأ',true); }
}
window.doPost = async function(){
 let inp=document.getElementById('np'); if(inp) newPost=inp.value; if(!newPost.trim()){toast('اكتب حاجة',true); return;}
 if(useLocalFallback){ let np={id:Date.now(),author:cur.name,authorId:cur.id,text:newPost,time:'الآن',likes:0,img:cur.name[0]}; posts.unshift(np); newPost=''; saveP(); render(); return; }
 try{ let np={id:Date.now(),author:cur.name,authorId:cur.id,text:newPost,time:new Date().toLocaleTimeString('ar-EG'),likes:0,img:cur.name[0],createdAt:Date.now()}; await addDoc(collection(db,"posts"), np); newPost=''; let inp2=document.getElementById('np'); if(inp2) inp2.value=''; toast('✅ تم النشر للكل'); }catch(e){ toast('خطأ',true); }
}
window.likeP = async function(id){
 if(useLocalFallback){ let p=posts.find(x=>String(x.id)===String(id)); if(p){p.likes++; saveP(); render();} return; }
 try{ let q=query(collection(db,"posts"), where("id","==",Number(id))); let snap=await getDocs(q); if(!snap.empty){ await updateDoc(doc(db,"posts",snap.docs[0].id), {likes:(snap.docs[0].data().likes||0)+1}); } }catch(e){}
}
window.send = async function(){
 let inp=document.getElementById('cin'); let t=inp?inp.value.trim():''; if(!t) return;
 let msg={id:Date.now(),txt:t,type:'text',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,spic:cur.pic||'',createdAt:Date.now()};
 if(useLocalFallback){ msgs.push(msg); saveM(); render(); return; }
 try{ await addDoc(collection(db,"messages"), msg); if(inp) inp.value=''; }catch(e){ toast('خطأ',true); }
}
window.pickImg = function(){ document.getElementById('imgInput').click(); }
window.pickProfilePic = function(){ document.getElementById('profilePicInput').click(); }
document.getElementById('profilePicInput')?.addEventListener('change', e=>{
 let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=ev=>{
  if(cur){ cur.pic=ev.target.result; localStorage.setItem('tk_cur',JSON.stringify(cur)); if(!useLocalFallback){ getDocs(query(collection(db,"users"), where("email","==",cur.email))).then(snap=>{ if(!snap.empty) updateDoc(doc(db,"users",snap.docs[0].id), {pic:ev.target.result}); }); } render(); toast('✅ تم تغيير الصورة'); }
 }; r.readAsDataURL(file);
});
document.getElementById('imgInput')?.addEventListener('change', e=>{
 let file=e.target.files[0]; if(!file) return; let r=new FileReader();
 r.onload=ev=>{ let b={id:Date.now(),type:'img',img:ev.target.result,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; if(useLocalFallback){ msgs.push(b); saveM(); render(); } else { addDoc(collection(db,"messages"), b); } };
 r.readAsDataURL(file);
});
window.startR = async function(){
 if(isRec) return; try{ let stream=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(stream); chunks=[]; isRec=true; recTime=0; rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ let blob=new Blob(chunks,{type:'audio/webm'}); let r=new FileReader(); r.onload=ev=>{ let b={id:Date.now(),type:'voice',aud:ev.target.result,dur:recTime+'s',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; if(useLocalFallback){ msgs.push(b); saveM(); render(); } else { addDoc(collection(db,"messages"), b); } }; r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop()); }; rec.start(); recInt=setInterval(()=>{recTime++; let inp=document.getElementById('cin'); if(inp) inp.placeholder='🔴 '+recTime+'s';},1000); render(); }catch(err){toast('الميك مش شغال',true);}
}
window.stopR = function(){ if(!isRec||!rec) return; rec.stop(); isRec=false; clearInterval(recInt); render(); }

async function initFirebase(){
 window._fbConnected=false;
 try{
  let adminQ=query(collection(db,"users"), where("email","==","ahmed@admin.com"));
  let adminSnap=await getDocs(adminQ);
  if(adminSnap.empty){ await addDoc(collection(db,"users"), {id:"ahmed@admin.com",name:"أحمد خالد مصطفى 👑",email:"ahmed@admin.com",pass:"admin123",role:"admin",city:"القاهرة",job:"مؤسس المنصة",lastActive:Date.now(),online:true}); }
  onSnapshot(collection(db,"users"), snap=>{ users=snap.docs.map(d=>({...d.data(), docId:d.id, lastActive:d.data().lastActive||Date.now()})); window._fbConnected=true; render(); });
  onSnapshot(query(collection(db,"messages"), orderBy("createdAt","asc")), snap=>{ msgs=snap.docs.map(d=>({...d.data(), docId:d.id})); window._fbConnected=true; render(); });
  onSnapshot(collection(db,"groups"), snap=>{ groups=snap.docs.map(d=>d.data()); if(groups.length===0) groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:5},{id:102,name:'فرص عمل - TIEC 💼',img:'💼',members:4}]; window._fbConnected=true; render(); });
  onSnapshot(query(collection(db,"posts"), orderBy("createdAt","desc")), snap=>{ posts=snap.docs.map(d=>d.data()); window._fbConnected=true; render(); });
  let curLocal=JSON.parse(localStorage.getItem('tk_cur')||'null'); let logLocal=localStorage.getItem('tk_log')==='1'; if(curLocal&&logLocal){ cur=curLocal; logged=true; }
  window._fbConnected=true; render(); toast('🔥 متصل - كل شيء شغال!');
 }catch(err){ useLocalFallback=true; initLocal(); }
}
function initLocal(){
 users=JSON.parse(localStorage.getItem('tk_u')||'[]');
 if(!users.find(u=>u.email==='ahmed@admin.com')){users.push({id:'ahmed@admin.com',name:'أحمد خالد مصطفى',email:'ahmed@admin.com',pass:'admin123',role:'admin',lastActive:Date.now()}); localStorage.setItem('tk_u',JSON.stringify(users));}
 msgs=JSON.parse(localStorage.getItem('tk_m')||'[]'); groups=JSON.parse(localStorage.getItem('tk_g')||'[]'); posts=JSON.parse(localStorage.getItem('tk_p')||'[]');
 if(groups.length===0){groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:5},{id:102,name:'فرص عمل - TIEC 💼',img:'💼',members:4}]; localStorage.setItem('tk_g',JSON.stringify(groups));}
 if(posts.length===0){posts=[{id:1,author:'سارة',text:'المنصة جامدة! 🔥',time:'منذ ساعة',likes:12,img:'س'}]; localStorage.setItem('tk_p',JSON.stringify(posts));}
 let curLocal=JSON.parse(localStorage.getItem('tk_cur')||'null'); let logLocal=localStorage.getItem('tk_log')==='1'; if(curLocal&&logLocal){ cur=curLocal; logged=true; }
 render();
}
if(!useLocalFallback){ initFirebase(); } else { initLocal(); }
