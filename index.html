v class="flex justify-between items-center mt-1.5 gap-3"><p class="text-[9px] opacity-60">${m.time}</p><p class="text-[9px] opacity-60">${m.sender==='me'?'✓✓ مقروء':'✓ تم التسليم'}</p></div></div></div>`).join('')}<div id="typing" class="hidden flex justify-start"><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl rounded-bl-sm px-4 py-3"><div class="flex gap-1"><span class="w-2 h-2 bg-[#6b7280] rounded-full animate-bounce"></span><span class="w-2 h-2 bg-[#6b7280] rounded-full animate-bounce" style="animation-delay:0.1s"></span><span class="w-2 h-2 bg-[#6b7280] rounded-full animate-bounce" style="animation-delay:0.2s"></span></div></div></div></div><div class="p-3 bg-[#1c2128] border-t border-[#2a3441]"><div class="flex gap-2 mb-2"><button onclick="toggleEmoji()" class="bg-[#0d1117] border border-[#2a3441] w-9 h-9 rounded-full">😊</button><button onclick="alert('تم فتح المعرض - اختار صورة 📷 تفاعلي')" class="bg-[#0d1117] border w-9 h-9 rounded-full">📎</button><button onclick="alert('تسجيل فويس نوت 🎤 - اضغط للتسجيل - تفاعلي')" class="bg-[#0d1117] border w-9 h-9 rounded-full">🎤</button><input id="chatInput" onkeydown="if(event.key==='Enter')sendMsg()" oninput="showTyping()" placeholder="اكتب رسالة... كل حاجة شغالة فعلا - دوس Enter للإرسال" class="flex-1 bg-[#0d1117] border border-[#2a3441] rounded-full px-4 py-2.5 text-[13px] outline-none focus:border-[#3b82f6]"><button onclick="sendMsg()" class="bg-[#3b82f6] w-11 h-11 rounded-full flex items-center justify-center font-black shadow-lg">↑</button></div><div id="emojiBar" class="hidden flex gap-2 overflow-auto no-scrollbar py-1">${['😊','😂','❤️','🔥','👏','🎉','✅','👍','🙏','💪','🚀','💼'].map(e=>`<button onclick="quickSend('${e}')" class="text-xl bg-[#0d1117] w-9 h-9 rounded-full hover:bg-[#252f3d]">${e}</button>`).join('')}</div></div></div>`;
 }

 // حسابي
 if(activeTab==='حسابي' && !selectedChat && !selectedGrad && !labActive){
   h+=`<div class="p-3"><h2 class="font-black text-[18px] mb-3">ملفي الشخصي - تفاعلي 100%</h2><div class="bg-[#1c2128] border border-[#2a3441] rounded-[22px] p-6 text-center"><div class="relative w-24 h-24 mx-auto"><div class="w-24 h-24 bg-gradient-to-br from-[#3b82f6] to-[#1d4ed8] rounded-full flex items-center justify-center text-3xl font-black shadow-lg">أ</div><button onclick="alert('تغيير الصورة 📷 - تفاعلي - اختار صورة')" class="absolute bottom-0 right-0 bg-[#fbbf24] text-black w-8 h-8 rounded-full flex items-center justify-center text-sm border-2 border-[#1c2128]">📷</button></div><h2 class="font-black text-[18px] mt-4">أحمد خالد مصطفى</h2><p class="text-[12px] text-[#9aa4b2] mt-1">تكنولوجيا التعليم - دفعة 2024 - القاهرة</p><div class="grid grid-cols-3 gap-3 mt-6"><div class="bg-[#0d1117] rounded-2xl p-4 border border-[#2a3441]"><p class="font-black text-[20px]">${posts.filter(p=>p.author.includes('أنت')||p.authorId===1).length}</p><p class="text-[10px] text-[#9aa4b2]">منشوراتي</p></div><div class="bg-[#0d1117] rounded-2xl p-4 border border-[#2a3441]"><p class="font-black text-[20px] text-[#fbbf24]">420</p><p class="text-[10px] text-[#9aa4b2]">نقطة</p></div><div class="bg-[#0d1117] rounded-2xl p-4 border border-[#2a3441]"><p class="font-black text-[20px] text-[#22c55e]">12</p><p class="text-[10px] text-[#9aa4b2]">متابع</p></div></div><div class="mt-6 space-y-3 text-right"><div class="bg-[#0d1117] border border-[#2a3441] rounded-xl p-4 flex justify-between items-center"><div><p class="text-[11px] text-[#6b7280]">البريد الإلكتروني</p><p class="font-bold text-[12px] mt-1">ahmed@techno.com</p></div><button onclick="editField('البريد')" class="text-[#3b82f6] text-[11px]">تعديل ✏️</button></div><div class="bg-[#0d1117] border rounded-xl p-4 flex justify-between items-center"><div><p class="text-[11px] text-[#6b7280]">المدينة</p><p class="font-bold text-[12px] mt-1">القاهرة - تفاعلي</p></div><button onclick="editField('المدينة')" class="text-[#3b82f6] text-[11px]">تعديل ✏️</button></div><div class="bg-[#0d1117] border rounded-xl p-4 flex justify-between items-center"><div><p class="text-[11px] text-[#6b7280]">الوظيفة</p><p class="font-bold text-[12px] mt-1">مطور واجهات - إنجاز تك</p></div><button onclick="editField('الوظيفة')" class="text-[#3b82f6] text-[11px]">تعديل ✏️</button></div><div class="bg-[#0d1117] border rounded-xl p-4"><p class="text-[11px] text-[#6b7280]">نبذة تعريفية - تفاعلية</p><textarea class="w-full bg-transparent text-[12px] mt-2 outline-none" rows="2">خريج تكنولوجيا التعليم - مبرمج منصة تكنو خريج - شغوف بالتعليم التكنولوجي</textarea></div></div><div class="grid grid-cols-2 gap-3 mt-6"><button onclick="saveProfile()" class="bg-[#3b82f6] py-3 rounded-full text-[13px] font-black">💾 حفظ التعديلات - تفاعلي</button><button onclick="alert('تم تسجيل الخروج - تفاعلي 👋')" class="bg-[#252f3d] border py-3 rounded-full text-[13px]">تسجيل خروج</button></div><div class="mt-6 grid grid-cols-2 gap-2"><button onclick="alert('الإعدادات ⚙️ - تفاعلي')" class="bg-[#1c2128] border py-2.5 rounded-full text-[11px]">⚙️ الإعدادات</button><button onclick="alert('الخصوصية 🔒 - تفاعلي')" class="bg-[#1c2128] border py-2.5 rounded-full text-[11px]">🔒 الخصوصية</button><button onclick="alert('المساعدة ❓ - تفاعلي')" class="bg-[#1c2128] border py-2.5 rounded-full text-[11px]">❓ مساعدة</button><button onclick="if(confirm('هل تريد مسح كل البيانات المحفوظة؟')){localStorage.clear();location.reload()}" class="bg-red-500/10 border border-red-500/20 py-2.5 rounded-full text-[11px] text-red-400">🗑️ مسح البيانات</button></div></div></div>`;
 }

 h+=`<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22]/95 backdrop-blur border-t border-[#2a3441] flex justify-around py-2 px-1 z-30">${[{k:'الرئيسية',i:'🏠'},{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'},{k:'المنشورات',i:'📝'},{k:'حسابي',i:'👤'}].map(n=>`<button onclick="activeTab='${n.k}';selectedChat=null;selectedGrad=null;labActive=null;showNotifs=false;render()" class="flex flex-col items-center text-[10px] min-w-[50px] ${activeTab===n.k?'text-[#60a5fa]':'text-[#6b7280]'}"><span class="text-[20px] ${activeTab===n.k?'scale-110':''} transition-transform">${n.i}</span><span class="mt-0.5 font-bold">${n.k}</span>${n.k==='الشات'&&messages.filter(m=>m.sender==='other'&&!m.read).length>0?`<span class="bg-red-500 text-white text-[8px] px-1 rounded-full mt-0.5">${messages.filter(m=>m.sender==='other'&&!m.read).length}</span>`:''}${n.k==='الرئيسية'&&unreadCount()>0?`<span class="bg-red-500 text-white text-[8px] w-1.5 h-1.5 rounded-full mt-1"></span>`:''}</button>`).join('')}</nav>`;

 document.getElementById('app').innerHTML=h;
 setTimeout(()=>{const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight},30);
}

function toggleNotifs(){showNotifs=!showNotifs; render()}
function markAllRead(){notifications.forEach(n=>n.read=true); saveAll(); render(); addNotif('تم','تعليم كل الإشعارات كمقروءة ✓')}
function clearNotifs(){if(confirm('مسح كل الإشعارات؟')){notifications=[]; saveAll(); render()}}
function openNotif(id){const n=notifications.find(x=>x.id===id); if(n){n.read=true; activeTab=n.tab; showNotifs=false; saveAll(); render()}}
function addNotif(title,body){notifications.unshift({id:Date.now(),title,body,time:'الآن',read:false,type:'info',tab:activeTab}); saveAll(); if(!showNotifs) render()}

function openGrad(id){selectedGrad=grads.find(g=>g.id===id); render()}
function openChat(id){selectedChat=grads.find(g=>g.id===id); selectedGrad=null; activeTab='الشات'; messages.forEach(m=>{if(m.chatId===id) m.read=true}); saveAll(); render()}
function openGroup(id){selectedChat={id,name:{g1:'دفعة 2024 - الرسمية',g2:'فرص عمل - يومية',g3:'مشاريع التخرج'}[id],img:'👥'}; activeTab='الشات'; render()}
function createGroup(){const name=prompt('اسم المجموعة الجديدة:'); if(name){addNotif('مجموعة جديدة','تم إنشاء مجموعة '+name); alert('تم إنشاء مجموعة '+name+' ✅ تفاعلي')}}

function toggleFollow(id){const g=grads.find(x=>x.id===id); g.followed=!g.followed; if(g.followed){g.points+=10; addNotif('متابعة جديدة','تابعت '+g.name+' - كسبت 10 نقاط ⭐')} saveAll(); render()}
function togglePostMenu(id){document.querySelectorAll('[id^="menu-"]').forEach(el=>el.classList.add('hidden')); const el=document.getElementById('menu-'+id); el.classList.toggle('hidden')}

function sendMsg(){
 const inp=document.getElementById('chatInput'); const t=inp?inp.value.trim():''; if(!t||!selectedChat) return;
 messages.push({id:Date.now(),chatId:selectedChat.id||selectedChat.name,text:t,sender:'me',time:new Date().toLocaleTimeString('ar-EG'),read:true});
 saveAll(); render();
 document.getElementById('typing')?.classList.remove('hidden');
 setTimeout(()=>{
   document.getElementById('typing')?.classList.add('hidden');
   const replies=['تمام يا هندسة 👌 فكرة ممتازة','عاش جدا 🔥 هكلمك خاص','اتفقنا، هبعتلك التفاصيل على الإيميل','شفت الفرصة اللي نزلت في المختبر؟ 💼','تعالى نعمل جروب للمشروع الجديد','مبروك مقدما 🎉','أكيد، هساعدك في الموضوع ده'];
   messages.push({id:Date.now()+1,chatId:selectedChat.id||selectedChat.name,text:replies[Math.floor(Math.random()*replies.length)],sender:'other',time:new Date().toLocaleTimeString('ar-EG'),read:false});
   addNotif('رسالة جديدة','رد من '+selectedChat.name+': '+(messages.slice(-1)[0].text.substring(0,20)+'...'));
   saveAll(); render();
 },1200+Math.random()*800);
}
function quickSend(t){const inp=document.getElementById('chatInput'); if(inp){inp.value=t; sendMsg()}}
function showTyping(){}
function toggleEmoji(){document.getElementById('emojiBar')?.classList.toggle('hidden')}

function addPost(){
 const el=document.getElementById('newPost'); const content=el.value.trim(); if(!content) {alert('اكتب حاجة الأول!'); return}
 posts.unshift({id:Date.now(),author:'أنت (أحمد خالد)',authorId:1,time:'الآن',content,likes:0,liked:false,comments:[],shares:0});
 el.value=''; saveAll(); render(); addNotif('منشور جديد','نشرت منشور جديد - كسبت 20 نقطة ⭐'); grads[0].points+=20; saveAll();
}
function likePost(id){
 const p=posts.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; if(p.liked){addNotif('إعجاب','عملت إعجاب لمنشور '+p.author)} saveAll(); render();
}
function addComment(id){
 const inp=document.getElementById('c-'+id); const text=inp.value.trim(); if(!text) return;
 const p=posts.find(x=>x.id===id); p.comments.push({author:'أنت',text,time:'الآن'}); saveAll(); render(); addNotif('تعليق جديد','علقت على منشور '+p.author+' - كسبت 5 نقاط'); grads[0].points+=5; saveAll();
}
function editPost(id){const p=posts.find(x=>x.id===id); const newContent=prompt('عدل المنشور:',p.content); if(newContent){p.content=newContent; saveAll(); render()}}
function deletePost(id){if(confirm('حذف المنشور؟')){posts=posts.filter(x=>x.id!==id); saveAll(); render(); addNotif('تم الحذف','تم حذف المنشور')}}
function sharePost(id){const p=posts.find(x=>x.id===id); p.shares++; saveAll(); render(); addNotif('مشاركة','شاركت منشور '+p.author+' - كسبت 10 نقاط'); grads[0].points+=10; saveAll(); alert('تم نسخ رابط المنشور 🔗 - تفاعلي 100%')}

function applyJob(id){const j=jobs.find(x=>x.id===id); if(j.applied){alert('انت قدمت على الوظيفة دي قبل كده ✅')}else{j.applied=true; saveAll(); render(); addNotif('تم التقديم','قدمت على وظيفة '+j.title+' - بالتوفيق! 💼'); grads[0].points+=30; saveAll(); alert('تم التقديم بنجاح! ✅ هنبعتلك إشعار لما يتم الرد')}}
function toggleSaveJob(id){const j=jobs.find(x=>x.id===id); j.saved=!j.saved; saveAll(); render(); addNotif(j.saved?'تم الحفظ':'تم إلغاء الحفظ',j.title)}

function startLab(type){
 const map={id:{title:'Instructional Designer',points:50},fe:{title:'مطور واجهات React',points:70},ux:{title:'مصمم تعليمي',points:40}};
 labActive={id:type,...map[type]}; labStep=0; render();
}
function nextLabStep(){
 const ans=document.getElementById('labAns')?.value||''; if(!ans.trim()){alert('اكتب إجابتك الأول!'); return}
 const feedback=document.getElementById('labFeedback');
 if(feedback){feedback.innerHTML=`<div class="bg-[#22c55e]/20 border border-[#22c55e]/30 rounded-xl p-3 mt-2"><p class="text-[12px] font-bold text-[#22c55e]">✅ تقييم AI فوري: ممتاز! 92% - إجابة قوية</p><p class="text-[11px] text-[#9aa4b2] mt-1">ملاحظات: استخدمت مصطلحات صحيحة - كمل كده</p></div>`; setTimeout(()=>{labStep++; render()},1200); return}
 labStep++; render();
}
function finishLab(){
 const ans=document.getElementById('labAns')?.value||''; if(!ans.trim()){alert('اكتب إجابتك!'); return}
 labScore=85+Math.floor(Math.random()*15);
 grads[0].points+=labActive.points;
 addNotif('إنجاز مختبر! 🎉','خلصت محاكاة '+labActive.title+' - كسبت '+labActive.points+' نقطة - تقييم '+labScore+'%');
 saveAll();
 alert(`🎉 مبروك! خلصت المحاكاة\n\nتقييمك: ${labScore}% - ممتاز!\nكسبت: ${labActive.points} نقطة ⭐\nتم إضافتها للمتصدرين`);
 labActive=null; labStep=0; activeTab='المتصدرين'; render();
}
function addPoints(){addPost();}

function editField(field){const val=prompt('عدل '+field+':'); if(val){addNotif('تم التعديل','عدلت '+field+' - تفاعلي ✅'); alert('تم حفظ '+field+': '+val+' ✅')}}
function saveProfile(){addNotif('تم الحفظ','حفظت بيانات ملفك الشخصي ✅'); alert('تم حفظ التعديلات بنجاح! ✅ كل حاجة تفاعلية 100%'); saveAll()}

render();
</script>
