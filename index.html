async function addPoints(pts, reason){
  if(!cur) return;
  try{
    let newPts=(cur.points||0)+pts;
    cur.points=newPts;
    localStorage.setItem('tk_cur', JSON.stringify(cur));
    // حدث في Firebase
    let q=query(collection(db,"users"), where("email","==",cur.email));
    let snap=await getDocs(q);
    if(!snap.empty){
      await updateDoc(doc(db,"users",snap.docs[0].id), {points:newPts, lastActive:Date.now()});
    }
    if(pts>0) toast('+'+pts+' نقطة '+reason+' 🔥');
    render();
  }catch(e){ console.log('points err',e); }
}

window.doReg=async function(){ 
  let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); let fn=document.getElementById('fn'); 
  if(fe) form.email=fe.value; if(fp) form.pass=fp.value; if(fn) form.name=fn.value; 
  // تنظيف البيانات 100%
  form.email=(form.email||'').trim().toLowerCase().replace(/\s+/g,'');
  form.name=(form.name||'').trim().replace(/\s{2,}/g,' ');
  form.pass=(form.pass||'').trim();
  if(!form.name||!form.email||!form.pass){ toast('املأ البيانات',true); return; } 
  if(form.name.length<2){ toast('الاسم قصير',true); return; }
  if(!form.email.includes('@')){ toast('الإيميل غلط',true); return; }
  try{ 
    toast('⏳ جاري التسجيل...');
    let q=query(collection(db,"users"), where("email","==",form.email)); 
    let snap=await getDocs(q); 
    if(!snap.empty){ toast('الإيميل مسجل قبل كده',true); return; } 
    let emailClean=form.email;
    let nu={id:emailClean,name:form.name,email:emailClean,pass:form.pass,role:'user',pic:'',city:'القاهرة',job:'خريج',points:10,lastActive:Date.now(),online:true,createdAt:Date.now(),uid:emailClean}; 
    // V7.4: استخدم setDoc مباشرة بالإيميل كمفتاح - أمان 100%
    let userDocRef=doc(db,"users", emailClean.replace(/[^a-z0-9@._-]/g,'_'));
    await setDoc(userDocRef, {...nu, docId:userDocRef.id});
    cur={...nu, docId:userDocRef.id}; 
    logged=true; 
    localStorage.setItem('tk_cur',JSON.stringify(cur)); 
    localStorage.setItem('tk_log','1'); 
    render(); 
    toast('✅ تم إنشاء حسابك - أهلاً '+form.name+' 🔥'); 
  }catch(e){ 
    console.log('Reg error',e);
    toast('خطأ: '+ (e.message||'حاول تاني'),true); 
  } 
}

window.likeP=async function(id){
  try{
    let q=query(collection(db,"posts"), where("id","==",Number(id)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let d=snap.docs[0];
    let data=d.data();
    let likedBy=data.likedBy||[];
    let isLiked=likedBy.includes(cur.id);
    let newLikedBy=isLiked ? likedBy.filter(x=>x!==cur.id) : [...likedBy, cur.id];
    let newLikes=isLiked ? Math.max(0,(data.likes||1)-1) : (data.likes||0)+1;
    await updateDoc(doc(db,"posts",d.id), {likes:newLikes, likedBy:newLikedBy});
    if(!isLiked){ toast('❤️ تم الإعجاب'); addPoints(2,'❤️ لايك'); }
  }catch(e){ toast('خطأ',true); }
}
window.addComment=async function(postId){
  let inp=document.getElementById('cmt-'+postId);
  let txt=inp?inp.value.trim():'';
  if(!txt){ toast('اكتب تعليق',true); return; }
  var chk=checkContent(txt);
  if(!chk.ok){ toast('🚫 كلمة ممنوعة',true); return; }
  try{
    await addDoc(collection(db,"post_comments"), {id:Date.now(),postId:Number(postId),author:cur.name,authorId:cur.id,authorPic:cur.pic||'',text:txt,time:new Date().toLocaleTimeString('ar-EG'),createdAt:Date.now()});
    let q=query(collection(db,"posts"), where("id","==",Number(postId)));
    let snap=await getDocs(q);
    if(!snap.empty){ await updateDoc(doc(db,"posts",snap.docs[0].id), {commentsCount:(snap.docs[0].data().commentsCount||0)+1}); }
    if(inp) inp.value='';
    toast('💬 تم التعليق');
    addPoints(5,'💬 تعليق');
  }catch(e){ toast('خطأ',true); }
}
window.deleteComment=async function(cid, postId){
  if(!confirm('مسح التعليق؟')) return;
  try{
    let q=query(collection(db,"post_comments"), where("id","==",Number(cid)));
    let snap=await getDocs(q);
    for(let d of snap.docs) await deleteDoc(doc(db,"post_comments",d.id));
    let q2=query(collection(db,"posts"), where("id","==",Number(postId)));
    let s2=await getDocs(q2);
    if(!s2.empty){ await updateDoc(doc(db,"post_comments",s2.docs[0].id), {}); }
    // decrement count
    try{
      let qp=query(collection(db,"posts"), where("id","==",Number(postId)));
      let sp=await getDocs(qp);
      if(!sp.empty){ await updateDoc(doc(db,"posts",sp.docs[0].id), {commentsCount:Math.max(0,(sp.docs[0].data().commentsCount||1)-1)}); }
    }catch(e){}
  }catch(e){}
}

window.makeGroupAdmin=async function(mid){
  if(!selGroup) return;
  try{
    let q=query(collection(db,"groups"), where("id","==",Number(selGroup)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let gd=snap.docs[0].data();
    let admins=gd.admins||[gd.createdBy];
    if(!admins.includes(String(mid))) admins.push(String(mid));
    await updateDoc(doc(db,"groups",snap.docs[0].id), {admins:admins});
    toast('⭐ تم تعيين مسؤول');
  }catch(e){ toast('خطأ',true); }
}
window.removeGroupAdmin=async function(mid){
  if(!selGroup) return;
  try{
    let q=query(collection(db,"groups"), where("id","==",Number(selGroup)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let gd=snap.docs[0].data();
    if(String(mid)===String(gd.createdBy)){ toast('ماينفعش تشيل المنشئ',true); return; }
    let admins=(gd.admins||[]).filter(a=>String(a)!==String(mid));
    await updateDoc(doc(db,"groups",snap.docs[0].id), {admins:admins});
    toast('تم إلغاء المسؤول');
  }catch(e){ toast('خطأ',true); }
}
window.removeFromGroup=async function(mid){
  if(!confirm('حذف العضو من المجموعة؟')) return;
  try{
    let q=query(collection(db,"groups"), where("id","==",Number(selGroup)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let gd=snap.docs[0].data();
    let memberIds=(gd.memberIds||[]).filter(m=>String(m)!==String(mid));
    let admins=(gd.admins||[]).filter(a=>String(a)!==String(mid));
    await updateDoc(doc(db,"groups",snap.docs[0].id), {memberIds:memberIds, members:memberIds.length, admins:admins});

  }catch(e){ toast('خطأ',true); }
}
window.addMembersToGroup=async function(){
  if(selM2.length===0){ toast('اختر أعضاء',true); return; }
  try{
    let q=query(collection(db,"groups"), where("id","==",Number(selGroup)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let gd=snap.docs[0].data();
    let memberIds=gd.memberIds||[];
    for(let id of selM2){ if(!memberIds.includes(String(id))) memberIds.push(String(id)); }
    await updateDoc(doc(db,"groups",snap.docs[0].id), {memberIds:memberIds, members:memberIds.length});
    selM2=[]; toast('✅ تم إضافة '+memberIds.length+' عضو');
  }catch(e){ toast('خطأ',true); }
}
window.leaveGroup=async function(){
  if(!confirm('متأكد تخرج من المجموعة؟')) return;
  try{
    let q=query(collection(db,"groups"), where("id","==",Number(selGroup)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let gd=snap.docs[0].data();

window.deleteGroup=async function(){
  if(!confirm('حذف المجموعة نهائياً؟')) return;
  try{
    let q=query(collection(db,"groups"), where("id","==",Number(selGroup)));
    let snap=await getDocs(q);
    for(let d of snap.docs) await deleteDoc(doc(db,"groups",d.id));
    selGroup=null; showGroupInfo=false; toast('🗑️ تم حذف المجموعة');
  }catch(e){ toast('خطأ',true); }
}

window.startR=async function(){ if(isRec) return; try{ let stream=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(stream); chunks=[]; isRec=true; recTime=0; rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ let blob=new Blob(chunks,{type:'audio/webm'}); let r=new FileReader(); r.onload=ev=>{ let b={id:Date.now(),type:'voice',aud:ev.target.result,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; addDoc(collection(db,"messages"), b); }; r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop()); }; rec.start(); recInt=setInterval(()=>{recTime++; let inp=document.getElementById('cin'); if(inp) inp.placeholder='🔴 '+recTime+'s';},1000); render(); }catch(err){ toast('الميك مش شغال',true); } }
window.stopR=function(){ if(!isRec||!rec) return; rec.stop(); isRec=false; clearInterval(recInt); render(); }

 }catch(e){ console.log(e); }
