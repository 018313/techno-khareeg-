</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تكنو خريج - Techno Khareeg</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Cairo',sans-serif;box-sizing:border-box}
    body{background:#0f172a;color:white;margin:0;padding:15px}
    .header{text-align:center;padding:30px 0}
    .header h1{color:#38bdf8;margin:0;font-size:32px}
    .header p{color:#94a3b8}
    .form{background:#1e293b;padding:20px;border-radius:15px;margin:20px auto;max-width:500px}
    .form input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#0f172a;color:white}
    .form button{width:100%;padding:12px;background:#38bdf8;color:#0f172a;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
    #users{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;max-width:1000px;margin:20px auto}
    .card{background:#1e293b;padding:20px;border-radius:15px;border-right:4px solid #38bdf8}
    .card h3{margin:0 0 10px 0;color:#38bdf8}
    .loading{text-align:center;color:#94a3b8}
  </style>
</head>
<body>

  <div class="header">
    <h1>🎓 تكنو خريج</h1>
    <p>منصة خريجين المعهد - مربوطة بـ Firebase 🔥</p>
  </div>

  <div class="form">
    <h3>إضافة خريج جديد</h3>
    <input id="name" placeholder="الاسم مثلا: أحمد">
    <input id="dept" placeholder="القسم مثلا: نظم">
    <input id="year" placeholder="السنة مثلا: 2025">
    <button onclick="addUser()">إضافة +</button>
  </div>

  <div id="users" class="loading">جاري تحميل البيانات من Firebase...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAX_yrLx7ltNv6HXh4KMwioi-YxsO0WVCM",
    authDomain: "technokhareeg2.firebaseapp.com",
    projectId: "technokhareeg2",
    storageBucket: "technokhareeg2.firebasestorage.app",
    messagingSenderId: "526382735312",
    appId: "1:526382735312:web:8ac2463836cadc37c063d5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.loadUsers = async function() {
    const container = document.getElementById('users');
    try {
      const snap = await getDocs(collection(db, "المستخدمون"));
      if (snap.empty) {
        container.innerHTML = "<p style='text-align:center'>لا يوجد خريجين بعد، ضيف أول واحد فوق</p>";
        return;
      }
      let html = "";
      snap.forEach(doc => {
        const d = doc.data();
        html += `<div class="card"><h3>👤 ${d.name || doc.id}</h3><p>القسم: ${d.department || d.dept || 'غير محدد'}</p><p>السنة: ${d.year || ''}</p></div>`;
      });
      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = "خطأ: " + e.message;
    }
  }

  window.addUser = async function() {
    const name = document.getElementById('name').value;
    const dept = document.getElementById('dept').value;
    const year = document.getElementById('year').value;
    if(!name) { alert("اكتب الاسم"); return; }
    try {
      await addDoc(collection(db, "المستخدمون"), { name, department: dept, year, createdAt: new Date() });
      document.getElementById('name').value = "";
      document.getElementById('dept').value = "";
      document.getElementById('year').value = "";
      alert("تمت الإضافة ✅");
      loadUsers();
    } catch(e) { alert(e.message); }
  }

  loadUsers();
</script>

</html>
