<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكنو خريج - منصة تواصل الخريجين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Tajawal',sans-serif} body{background:#0f1419;color:white} .scrollbar-hide::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div id="app" class="max-w-[480px] mx-auto min-h-screen pb-[70px] bg-[#0f1419] relative"></div>
<script>
const graduates=[
 {id:1,name:'أحمد خالد مصطفى',year:'2024',job:'مطور واجهات أمامية - إنجاز تك',city:'القاهرة',online:true,img:'أ'},
 {id:2,name:'أحمد خالد مصطفى',year:'2023',job:'مهندس برمجة - DXC Egypt',city:'الجيزة',online:true,img:'أ'},
 {id:3,name:'محمود أحمد إبراهيم',year:'2022',job:'Backend - Vezeera',city:'الإسكندرية',online:false,img:'م'},
 {id:4,name:'سارة محمد',year:'2024',job:'Instructional Designer',city:'المنصورة',online:true,img:'س'},
 {id:5,name:'محمد علي',year:'2023',job:'مصمم تعليمي',city:'القاهرة',online:true,img:'م'},
];
const groups=[
 {id:'g1',name:'دفعة 2024',members:27,last:'أحمد: شباب حد عنده فرصة؟',img:'👥'},
 {id:'g2',name:'فرص عمل',members:27,last:'تم نشر وظيفة جديدة 💼',img:'💼'},
 {id:'g3',name:'مشاريع التخرج',members:15,last:'سارة شاركت مشروعها',img:'💡'},
];
let activeTab='الرئيسية';
let chatTab='individual';
let selectedChat=null;
let messages=JSON.parse(localStorage.getItem('tk_msgs')||'[]');
let inputText='';

function save(){localStorage.setItem('tk_msgs',JSON.stringify(messages))}

function render(){
  const app=document.getElementById('app');
  let html='';
  html+=`<header class="sticky top-0 z-20 bg-[#2563eb] p-3 flex justify-between items-center">
    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">🔔</div>
    <h1 class="font-black">تكنو خريج 🎓</h1>
    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">☀️</div>
  </header>`;

  if(activeTab==='الرئيسية' && !selectedChat){
    html+=`<div class="p-3 space-y-4">
      <div class="bg-gradient-to-br from-orange-400 to-amber-600 rounded-2xl p-4 text-black">
        <span class="text-[10px] bg-white/40 px-2 py-1 rounded-full">الأكثر تفاعلاً 🔥</span>
        <h3 class="font-bold mt-2">لقاء الخريجين السنوي</h3>
        <p class="text-xs mt-1 leading-4">يسعدنا دعوتكم لحضور اللقاء السنوي للخريجين يوم الجمعة القادم، سيكون فرصة رائعة للتواصل وتبادل الخبرات.</p>
      </div>
      <div class="bg-[#1c2128] rounded-2xl p-4 border border-[#30363d]">
        <p class="font-bold text-sm">👋 مرحبا بك عزيزي المستخدم!</p>
        <p class="text-[11px] text-gray-400 mt-2 leading-5">انا صديقك أحمد خالد مصطفى، خريج كلية التربية النوعية تخصص تكنولوجيا التعليم. ومبرمج هذا التطبيق، انا هنا عشان اقدر اساعدك في كل حاجة تخص المنصة.</p>
        <button onclick="activeTab='الشات';render()" class="mt-3 bg-[#21262d] border border-[#30363d] px-4 py-2 rounded-full text-xs">💬 تواصل معي</button>
      </div>
      <div class="bg-gradient-to-br from-[#1e90ff] to-[#1a56db] rounded-2xl p-5 text-center">
        <p class="text-xs opacity-80">مرحبا بك في</p>
        <h2 class="text-2xl font-black">تكنو خريج</h2>
        <p class="text-[11px] mt-2 opacity-90">منصتك للتواصل مع زملاء الدراسة وبناء شبكة علاقات مهنية قوية</p>
        <div class="flex justify-center gap-8 mt-4">
          <div><p class="font-black text-xl">27</p><p class="text-[10px]">خريج مسجل</p></div>
          <div><p class="font-black text-xl">10</p><p class="text-[10px]">منشور</p></div>
        </div>
        <button onclick="activeTab='الشات';render()" class="mt-4 bg-amber-400 text-black px-5 py-2 rounded-full text-sm font-bold">✨ تجربة المنصة الآن</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-[#1c2128] rounded-xl p-3 border border-[#30363d] flex justify-between"><div><p class="font-bold">10</p><p class="text-[10px] text-gray-400">منشور</p></div><div class="bg-yellow-500/20 p-2 rounded-lg">📝</div></div>
        <div class="bg-[#1c2128] rounded-xl p-3 border border-[#30363d] flex justify-between"><div><p class="font-bold">27</p><p class="text-[10px] text-gray-400">خريجون</p></div><div class="bg-blue-500/20 p-2 rounded-lg">👥</div></div>
        <div class="bg-[#1c2128] rounded-xl p-3 border border-[#30363d] flex justify-between"><div><p class="font-bold text-purple-400">0</p><p class="text-[10px] text-gray-400">مسابقات</p></div><div class="bg-purple-500/20 p-2 rounded-lg">🏆</div></div>
        <div class="bg-[#1c2128] rounded-xl p-3 border border-[#30363d] flex justify-between"><div><p class="font-bold text-green-400">8</p><p class="text-[10px] text-gray-400">فرص عمل</p></div><div class="bg-green-500/20 p-2 rounded-lg">💼</div></div>
      </div>
      <h3 class="font-bold">الوصول السريع</h3>
      <div class="space-y-2">
        <div onclick="activeTab='الخريجين';render()" class="bg-[#1c2128] border border-[#30363d] rounded-xl p-4 flex justify-between items-center cursor-pointer"><div class="flex gap-3 items-center"><div class="bg-[#2a303c] p-3 rounded-xl">👥</div><div><p class="font-bold text-sm">دليل الخريجين</p><p class="text-[11px] text-gray-400">ابحث عن زملائك</p></div></div>←</div>
        <div onclick="activeTab='الشات';render()" class="bg-[#1c2128] border border-[#30363d] rounded-xl p-4 flex justify-between items-center cursor-pointer"><div class="flex gap-3 items-center"><div class="bg-[#2a303c] p-3 rounded-xl">💬</div><div><p class="font-bold text-sm">الشات الجماعي</p><p class="text-[11px] text-gray-400">فردي ومجموعات شغال فعلا</p></div></div>←</div>
        <div class="bg-[#1c2128] border border-[#30363d] rounded-xl p-4 flex justify-between items-center"><div class="flex gap-3 items-center"><div class="bg-[#2a303c] p-3 rounded-xl">👤</div><div><p class="font-bold text-sm">ملفي الشخصي</p><p class="text-[11px] text-gray-400">اكمل بياناتك</p></div></div>←</div>
        <div class="bg-[#1c2128] border border-[#30363d] rounded-xl p-4 flex justify-between items-center"><div class="flex gap-3 items-center"><div class="bg-[#2a303c] p-3 rounded-xl">💡</div><div><p class="font-bold text-sm">معرض المشاريع</p><p class="text-[11px] text-gray-400">مشاريع تخرج الخريجين</p></div></div>←</div>
      </div>
      <div class="flex justify-between items-center"><h3 class="font-bold">خريجون مميزون</h3><span class="text-xs text-blue-400">عرض الكل</span></div>
      ${graduates.slice(0,3).map(g=>`
        <div class="bg-[#1c2128] border border-[#30363d] rounded-xl p-4">
          <div class="flex gap-3"><div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-bold">${g.img}</div><div><p class="font-bold text-sm">${g.name}</p><p class="text-[10px] text-gray-400">تكنولوجيا التعليم • دفعة ${g.year}</p><span class="text-[9px] bg-[#1a56db]/30 px-2 py-0.5 rounded-full">دفعة ${g.year}</span></div></div>
          <div class="mt-3 text-[11px] text-gray-400"><p>💼 ${g.job}</p><p>📍 ${g.city}</p></div>
        </div>
      `).join('')}
    </div>`;
  }

  if(activeTab==='الشات' && !selectedChat){
    html+=`<div class="p-3">
      <h2 class="font-black text-xl mb-3">الشات - تفاعلي 100%</h2>
      <div class="flex bg-[#1c2128] rounded-full p-1 mb-4">
        <button onclick="chatTab='individual';render()" class="flex-1 py-2 rounded-full text-sm ${chatTab==='individual'?'bg-[#2563eb]':'text-gray-400'}">فردي (${graduates.length})</button>
        <button onclick="chatTab='groups';render()" class="flex-1 py-2 rounded-full text-sm ${chatTab==='groups'?'bg-[#2563eb]':'text-gray-400'}">مجموعات (${groups.length})</button>
      </div>
      ${chatTab==='individual' ? graduates.map(g=>{
        const lastMsg=messages.filter(m=>m.chatId===g.id).slice(-1)[0];
        return `<div onclick="openChat(${g.id})" class="bg-[#1c2128] border border-[#30363d] rounded-xl p-3 flex gap-3 mb-2 cursor-pointer">
          <div class="relative"><div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center font-bold">${g.img}</div>${g.online?'<div class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-[#1c2128]"></div>':''}</div>
          <div class="flex-1 overflow-hidden"><p class="font-bold text-sm">${g.name}</p><p class="text-[11px] text-gray-400 truncate">${lastMsg?lastMsg.text:g.job}</p></div>
          <div class="text-[10px] text-gray-500">${lastMsg?lastMsg.time:g.online?'متصل':'منذ ساعة'}</div>
        </div>`
      }).join('') : groups.map(gr=>`
        <div onclick="openGroup('${gr.id}')" class="bg-[#1c2128] border border-[#30363d] rounded-xl p-4 flex gap-3 mb-2 cursor-pointer">
          <div class="w-12 h-12 bg-gradient-to-br from-purple-600 to-blue-600 rounded-full flex items-center justify-center text-xl">${gr.img}</div>
          <div class="flex-1"><p class="font-bold text-sm">${gr.name}</p><p class="text-[11px] text-gray-400">${gr.members} عضو • ${gr.last}</p></div>
          <div class="w-2 h-2 bg-green-500 rounded-full mt-2"></div>
        </div>
      `).join('')}
    </div>`;
  }

  if(selectedChat){
    const chatMsgs=messages.filter(m=>m.chatId===selectedChat.id || m.chatId===selectedChat.name);
    html+=`<div class="flex flex-col h-[calc(100vh-110px)]">
      <div class="p-3 bg-[#1c2128] border-b border-[#30363d] flex items-center gap-3">
        <button onclick="selectedChat=null;render()" class="text-xl">←</button>
        <div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center font-bold">${selectedChat.img||selectedChat.name[0]}</div>
        <div><p class="font-bold text-sm">${selectedChat.name}</p><p class="text-[10px] text-green-400">متصل الآن • كل الرسائل حقيقية ومحفوظة</p></div>
      </div>
      <div id="msgs" class="flex-1 overflow-auto p-3 space-y-3">
        ${chatMsgs.length===0?'<p class="text-center text-gray-500 text-xs mt-10">ابدأ المحادثة - تفاعلي 100% ومحفوظ في جهازك<br>جرب تبعت رسالة وهتشوف الرد فورا</p>':''}
        ${chatMsgs.map(m=>`
          <div class="flex ${m.sender==='me'?'justify-end':'justify-start'}">
            <div class="${m.sender==='me'?'bg-[#2563eb]':'bg-[#21262d]'} max-w-[75%] rounded-2xl px-4 py-2">
              <p class="text-sm">${m.text}</p><p class="text-[9px] opacity-60 mt-1">${m.time} ${m.sender==='me'?'✓✓':''}</p>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="p-3 bg-[#1c2128] border-t border-[#30363d] flex gap-2">
        <input id="chatInput" value="${inputText}" onkeydown="if(event.key==='Enter')sendMsg()" oninput="inputText=this.value" placeholder="اكتب رسالة... كل حاجة شغالة فعلا" class="flex-1 bg-[#0d1117] border border-[#30363d] rounded-full px-4 py-2.5 text-sm outline-none"/>
        <button onclick="sendMsg()" class="bg-[#2563eb] px-5 py-2.5 rounded-full text-sm font-bold">إرسال</button>
      </div>
    </div>`;
  }

  if(activeTab!=='الرئيسية' && activeTab!=='الشات' && !selectedChat){
    html+=`<div class="p-10 text-center"><p class="text-5xl mb-4">🚧</p><p class="font-bold">${activeTab}</p><p class="text-xs text-gray-400 mt-2">القسم ده هيشتغل بنفس طريقة الشات<br>دوس على الشات عشان تجرب التفاعل الحقيقي</p><button onclick="activeTab='الشات';render()" class="mt-5 bg-[#2563eb] px-6 py-2 rounded-full text-sm">روح للشات التفاعلي</button></div>`;
  }

  html+=`<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#30363d] flex justify-around py-2 px-1 z-20">
    ${[
      {k:'الرئيسية',i:'🏠'},
      {k:'الخريجين',i:'👥'},
      {k:'المتصدرين',i:'🏆'},
      {k:'المختبر',i:'🧪'},
      {k:'الشات',i:'💬'},
      {k:'المنشورات',i:'📝'},
      {k:'حسابي',i:'👤'},
    ].map(n=>`<button onclick="activeTab='${n.k}';selectedChat=null;render()" class="flex flex-col items-center text-[10px] ${activeTab===n.k?'text-[#58a6ff]':'text-gray-500'}"><span class="text-lg">${n.i}</span>${n.k}</button>`).join('')}
  </nav>`;

  app.innerHTML=html;
  setTimeout(()=>{const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight},50);
}

function openChat(id){selectedChat=graduates.find(g=>g.id===id);render()}
function openGroup(id){selectedChat=groups.find(g=>g.id===id);render()}
function sendMsg(){
  const inp=document.getElementById('chatInput');
  const text=inp?inp.value:inputText;
  if(!text.trim()||!selectedChat) return;
  const msg={id:Date.now(),chatId:selectedChat.id||selectedChat.name,text:text,sender:'me',time:new Date().toLocaleTimeString('ar-EG')};
  messages.push(msg); save(); inputText=''; render();
  setTimeout(()=>{
    const replies=['تمام يا هندسة 👌','فكرة ممتازة!','هكلمك خاص','اتفقنا، هبعتلك التفاصيل','عاش جدا 🔥','شفت الفرصة اللي نزلت؟','تعالى نعمل جروب للمشروع'];
    const reply={id:Date.now()+1,chatId:selectedChat.id||selectedChat.name,text:replies[Math.floor(Math.random()*replies.length)],sender:'other',time:new Date().toLocaleTimeString('ar-EG')};
    messages.push(reply); save(); render();
  },1000+Math.random()*1000);
}

render();
</script>
</body>
</html>
