 html+='</div><nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-2 z-20">';
 var tabs=[{k:'الرئيسية',i:'🏠'},{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'},{k:'المنشورات',i:'📝'},{k:'حسابي',i:'👤'}];
 for(let t of tabs){ html+='<button onclick="switchTab(\''+t.k+'\')" class="flex flex-col items-center text-[9px] '+(tab===t.k?'text-[#fbbf24]':'text-[#6b7280]')+'"><span class="text-[16px]">'+t.i+'</span>'+t.k+'</button>'; }
 html+='</nav>'; app.innerHTML=html;
 setTimeout(()=>{ let gn=document.getElementById('gn'); if(gn) gn.oninput=e=>gName=e.target.value; let np=document.getElementById('np'); if(np) np.oninput=e=>newPost=e.target.value; },50);
}
window.render=render;
window.doLogin=async function(){
 let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); if(fe) form.email=fe.value; if(fp) form.pass=fp.value;
 if(!form.email||!form.pass){ toast('اكتب البيانات',true); return; }
 try{ let q=query(collection(db,"users"), where("email","==",form.email.toLowerCase()), where("pass","==",form.pass)); let snap=await getDocs(q); if(snap.empty){ toast('بيانات غلط',true); return; } let data=snap.docs[0].data(); cur={...data, lastActive:Date.now()}; logged=true; localStorage.setItem('tk_cur',JSON.stringify(cur)); localStorage.setItem('tk_log','1'); await updateDoc(doc(db,"users",snap.docs[0].id), {lastActive:Date.now(), online:true}); render(); toast('أهلاً '+cur.name+' 🔥'); }catch(e){ toast('خطأ: '+e.message,true); }
}
window.doReg=async function(){
 let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); let fn=document.getElementById('fn'); if(fe) form.email=fe.value; if(fp) form.pass=fp.value; if(fn) form.name=fn.value;
 if(!form.name||!form.email||!form.pass){ toast('املأ البيانات',true); return; }
 try{ let q=query(collection(db,"users"), where("email","==",form.email.toLowerCase())); let snap=await getDocs(q); if(!snap.empty){ toast('الإيميل مسجل',true); return; } let nu={id:form.email.toLowerCase(),name:form.name,email:form.email.toLowerCase(),pass:form.pass,role:'user',pic:'',city:'القاهرة',job:'خريج',lastActive:Date.now(),online:true,createdAt:Date.now()}; let ref=await addDoc(collection(db,"users"), nu); await setDoc(doc(db,"users",ref.id), {...nu, docId:ref.id}); cur={...nu, docId:ref.id}; logged=true; localStorage.setItem('tk_cur',JSON.stringify(cur)); localStorage.setItem('tk_log','1'); render(); toast('🔥 تم إنشاء حسابك'); }catch(e){ toast('خطأ: '+e.message,true); }
}
window.logout=function(){ logged=false; cur=null; localStorage.removeItem('tk_log'); localStorage.removeItem('tk_cur'); selChat=null; selGroup=null; render(); }
window.createG=async function(){ if(!gName.trim()){ toast('اكتب اسم المجموعة',true); return; } try{ let ng={id:Date.now(),name:gName,img:'👥',members:selM.length+1,desc:'أنشأها '+cur.name,createdBy:cur.id,createdAt:Date.now()}; await addDoc(collection(db,"groups"), ng); showCG=false; gName=''; selM=[]; toast('✅ تم إنشاء المجموعة'); }catch(e){ toast('خطأ',true); } }
window.doPost=async function(){ let inp=document.getElementById('np'); if(inp) newPost=inp.value; if(!newPost.trim()){ toast('اكتب حاجة',true); return; } try{ let np={id:Date.now(),author:cur.name,authorId:cur.id,text:newPost,time:new Date().toLocaleTimeString('ar-EG'),likes:0,img:cur.name[0],createdAt:Date.now()}; await addDoc(collection(db,"posts"), np); newPost=''; let inp2=document.getElementById('np'); if(inp2) inp2.value=''; toast('✅ تم النشر'); }catch(e){ toast('خطأ',true); } }
window.likeP=async function(id){ try{ let q=query(collection(db,"posts"), where("id","==",Number(id))); let snap=await getDocs(q); if(!snap.empty){ await updateDoc(doc(db,"posts",snap.docs[0].id), {likes:(snap.docs[0].data().likes||0)+1}); } }catch(e){} }
window.send=async function(){ let inp=document.getElementById('cin'); let t=inp?inp.value.trim():''; if(!t) return; try{ let m={id:Date.now(),txt:t,type:'text',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,spic:cur.pic||'',createdAt:Date.now()}; await addDoc(collection(db,"messages"), m); if(inp) inp.value=''; }catch(e){ toast('خطأ',true); } }
document.getElementById('profilePicInput').addEventListener('change', e=>{
 let file=e.target.files[0]; if(!file) return; if(file.size>2*1024*1024){ toast('الصورة كبيرة - أقل من 2 ميجا',true); return; }
 let r=new FileReader(); r.onload=ev=>{
  if(cur){ cur.pic=ev.target.result; localStorage.setItem('tk_cur',JSON.stringify(cur)); getDocs(query(collection(db,"users"), where("email","==",cur.email))).then(snap=>{ if(!snap.empty) updateDoc(doc(db,"users",snap.docs[0].id), {pic:ev.target.result}); }); render(); toast('✅ تم تغيير الصورة - ظهرت عند الكل'); }
 }; r.readAsDataURL(file);
});
document.getElementById('imgInput').addEventListener('change', e=>{
 let file=e.target.files[0]; if(!file) return; let r=new FileReader();
 r.onload=ev=>{ let b={id:Date.now(),type:'img',img:ev.target.result,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; addDoc(collection(db,"messages"), b); };
 r.readAsDataURL(file);
});
window.startR=async function(){
 if(isRec) return; try{ let stream=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(stream); chunks=[]; isRec=true; recTime=0; rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ let blob=new Blob(chunks,{type:'audio/webm'}); let r=new FileReader(); r.onload=ev=>{ let b={id:Date.now(),type:'voice',aud:ev.target.result,dur:recTime+'s',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; addDoc(collection(db,"messages"), b); }; r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop()); }; rec.start(); recInt=setInterval(()=>{recTime++; let inp=document.getElementById('cin'); if(inp) inp.placeholder='🔴 '+recTime+'s';},1000); render(); toast('🎤 جاري التسجيل...'); }catch(err){ toast('الميك مش شغال',true); }
}
window.stopR=function(){ if(!isRec||!rec) return; rec.stop(); isRec=false; clearInterval(recInt); render(); }
async function initFirebase(){
 try{
  let q=query(collection(db,"users"), where("email","==","ahmed@admin.com")); let s=await getDocs(q); if(s.empty){ await addDoc(collection(db,"users"), {id:"ahmed@admin.com",name:"أحمد خالد مصطفى 👑",email:"ahmed@admin.com",pass:"admin123",role:"admin",city:"القاهرة",job:"مؤسس المنصة",lastActive:Date.now(),online:true}); }
  onSnapshot(collection(db,"users"), snap=>{ users=snap.docs.map(d=>d.data()); render(); });
  onSnapshot(query(collection(db,"messages"), orderBy("createdAt","asc")), snap=>{ msgs=snap.docs.map(d=>d.data()); render(); });
  onSnapshot(collection(db,"groups"), snap=>{ groups=snap.docs.map(d=>d.data()); if(groups.length===0) groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:5,desc:'جروب الدفعة'},{id:102,name:'فرص عمل - TIEC 💼',img:'💼',members:4}]; render(); });
  onSnapshot(query(collection(db,"posts"), orderBy("createdAt","desc")), snap=>{ posts=snap.docs.map(d=>d.data()); render(); });
  let cl=JSON.parse(localStorage.getItem('tk_cur')||'null'); let ll=localStorage.getItem('tk_log')==='1'; if(cl&&ll){ cur=cl; logged=true; }
  render(); toast('🔥 V6.4 كاملة - كل المميزات رجعت!');
 }catch(e){ console.log(e); }
}
initFirebase();
