<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكنو خريج - دفعة 2023 - لوحة تحكم أحمد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Tajawal',sans-serif} body{background:#0f1419;color:white} @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}} .toast{animation:slideUp 0.3s}</style>
</head>
<body>
<div id="root" class="max-w-[480px] mx-auto min-h-screen bg-[#0f1419] relative"></div>
<div id="toastBox" class="fixed bottom-[20px] left-1/2 -translate-x-1/2 z-[200] space-y-2 w-[90%] max-w-[380px]"></div>
<script>
function toast(msg,type='ok'){
 const c=document.getElementById('toastBox'); const d=document.createElement('div');
 d.className=`toast px-4 py-3 rounded-2xl text-[12px] font-bold shadow-2xl border ${type==='ok'?'bg-[#1c2128]/95 border-[#2a3441]':'bg-red-500/90 border-red-400'} text-white text-center`;
 d.innerText=msg; c.appendChild(d);
 setTimeout(()=>{d.style.opacity='0'; setTimeout(()=>d.remove(),300)},3500);
}
const gradsData=[
 {id:1,name:'أحمد خالد مصطفى 👑',year:'2023',job:'مطور واجهات - مؤسس المنصة',city:'القاهرة',bio:'مبرمج منصة تكنو خريج - دفعة 2023 - الأدمن الرئيسي',online:true,img:'أ',points:999,followed:true,isAdmin:true},
 {id:2,name:'سارة محمد أحمد',year:'2023',job:'Instructional Designer - Edraak',city:'المنصورة',bio:'تصميم تعليمي',online:true,img:'س',points:510,followed:false},
 {id:3,name:'محمود أحمد علي',year:'2023',job:'Backend - Vezeeta',city:'الإسكندرية',bio:'Node.js Developer',online:true,img:'م',points:480,followed:false},
 {id:4,name:'نورهان عصام',year:'2023',job:'UI/UX - SWVL',city:'القاهرة',bio:'مصممة واجهات',online:true,img:'ن',points:460,followed:false},
 {id:5,name:'محمد علي حسن',year:'2023',job:'مصمم تعليمي - نفهم',city:'القاهرة',bio:'تطوير محتوى',online:false,img:'م',points:445,followed:false},
 {id:6,name:'ريم طارق',year:'2022',job:'E-Learning Specialist - TIEC',city:'الجيزة',bio:'خبير تعلم إلكتروني',online:true,img:'ر',points:430,followed:false},
 {id:7,name:'عبدالرحمن جمال',year:'2023',job:'Fullstack - Instabug',city:'القاهرة',bio:'MERN Stack',online:true,img:'ع',points:420,followed:false},
 {id:8,name:'أماني سمير',year:'2023',job:'Content Creator - Almentor',city:'طنطا',bio:'صناعة محتوى',online:false,img:'أ',points:410,followed:false},
 {id:9,name:'يوسف إبراهيم',year:'2022',job:'Mobile Dev - Vezeeta',city:'الإسكندرية',bio:'Flutter',online:true,img:'ي',points:400,followed:false},
 {id:10,name:'منة الله خالد',year:'2023',job:'Graphic Designer',city:'المنصورة',bio:'تصميم تعليمي',online:true,img:'م',points:395,followed:false},
];

let users = JSON.parse(localStorage.getItem('tk_real_users')||'[]');
if(!users.find(u=>u.email==='jury@edu-tech.com')){
 users.push({name:'لجنة التحكيم', email:'jury@edu-tech.com', pass:'123456', year:'2023', role:'jury'});
}
if(!users.find(u=>u.email==='ahmed@admin.com')){
 users.push({name:'أحمد خالد مصطفى - الأدمن الرئيسي 👑', email:'ahmed@admin.com', pass:'admin123', year:'2023', role:'super_admin', isFounder:true});
}
localStorage.setItem('tk_real_users', JSON.stringify(users));

let logged = localStorage.getItem('tk_real_logged')==='1';
let currentUser = JSON.parse(localStorage.getItem('tk_current_user')||'null');
let activeTab='الخريجين';
let searchQ='';
let showPass=false;
let selectedGrad=null;
let selectedChat=null;
let messages=JSON.parse(localStorage.getItem('tk_msgs_real')||'[]');
let authMode='login';
let form={name:'', email:'', pass:'', year:'2023'};

function saveMsgs(){localStorage.setItem('tk_msgs_real',JSON.stringify(messages))}
function saveUsers(){localStorage.setItem('tk_real_users',JSON.stringify(users))}
function isAdmin(){return currentUser && (currentUser.role==='super_admin' || currentUser.email==='ahmed@admin.com' || currentUser.name.includes('أحمد خالد') || currentUser.email.includes('ahmed'));}

function render(){
 const root=document.getElementById('root');
 if(!logged){
  root.innerHTML=`
  <div class="min-h-screen flex flex-col p-5 justify-center">
    <div class="text-center mb-6">
      <div class="w-20 h-20 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-3xl mx-auto flex items-center justify-center text-3xl shadow-2xl">👑</div>
      <h1 class="font-black text-[22px] mt-4">تكنو خريج</h1>
      <p class="text-[13px] text-[#9aa4b2] mt-1">دفعة 2023 - ${isAdmin()?'لوحة تحكم أحمد':'تسجيل حقيقي'} 🔒</p>
      <div class="mt-3 bg-[#1c2128] border border-[#f59e0b]/30 rounded-2xl p-3 text-[11px] text-right">
        <p class="font-bold text-[#fbbf24]">👑 حساب الأدمن:</p>
        <p class="text-[#9aa4b2] mt-1">ahmed@admin.com / admin123</p>
        <p class="text-[#9aa4b2]">أو حسابك الشخصي - أنت المتحكم الرئيسي</p>
      </div>
    </div>
    <div class="bg-[#1c2128] border border-[#2a3441] rounded-3xl p-5 space-y-4">
      <div class="flex gap-2">
        <button onclick="authMode='login'; render()" class="flex-1 py-2.5 rounded-full text-[12px] font-bold ${authMode==='login'?'bg-[#3b82f6] text-white':'bg-[#252f3d] text-[#9aa4b2]'}">تسجيل دخول</button>
        <button onclick="authMode='register'; render()" class="flex-1 py-2.5 rounded-full text-[12px] font-bold ${authMode==='register'?'bg-[#3b82f6] text-white':'bg-[#252f3d] text-[#9aa4b2]'}">إنشاء حساب</button>
      </div>
      ${authMode==='register'?`<input value="${form.name}" oninput="form.name=this.value" placeholder="الاسم الكامل" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">`:''}
      <input value="${form.email}" oninput="form.email=this.value" placeholder="الإيميل" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">
      <div class="relative">
        <input value="${form.pass}" oninput="form.pass=this.value" type="${showPass?'text':'password'}" placeholder="الباسورد" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">
        <button onclick="togglePass()" class="absolute left-3 top-1/2 -translate-y-1/2 text-[12px]">${showPass?'🙈':'👁️'}</button>
      </div>
      ${authMode==='register'?`<select onchange="form.year=this.value" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px]"><option value="2023">دفعة 2023</option><option value="2022">دفعة 2022</option><option value="2024">دفعة 2024</option></select>`:''}
      ${authMode==='login'?`<button onclick="doLoginReal()" class="w-full bg-[#3b82f6] py-3 rounded-full font-black text-[14px]">دخول 🔒</button>
      <button onclick="fillJuryReal()" class="w-full bg-[#1c2128] border border-[#2a3441] py-2.5 rounded-full text-[11px]">🎓 دخول اللجنة: jury@edu-tech.com / 123456</button>
      <button onclick="fillAdmin()" class="w-full bg-gradient-to-r from-[#f59e0b] to-[#d97706] py-2.5 rounded-full text-[11px] font-black text-black">👑 دخول الأدمن: ahmed@admin.com / admin123</button>`
      :`<button onclick="doRegister()" class="w-full bg-[#10b981] py-3 rounded-full font-black text-[14px]">إنشاء حساب ✅</button>`}
    </div>
  </div>`;
  return;
 }

 // Logged in view
 let filtered = gradsData.filter(g=> !searchQ || g.name.includes(searchQ) || g.job.includes(searchQ));

 root.innerHTML=`
  <div class="p-3 flex justify-between items-center bg-[#1c2128] border-b border-[#2a3441] sticky top-0 z-10">
    <div class="flex items-center gap-2"><div class="w-8 h-8 bg-gradient-to-br ${isAdmin()?'from-[#f59e0b] to-[#d97706]':'from-[#3b82f6] to-[#1d4ed8]'} rounded-full flex items-center justify-center text-sm">${isAdmin()?'👑':'🎓'}</div>
    <div><p class="font-bold text-[12px]">${currentUser.name} ${isAdmin()?'👑':''}</p><p class="text-[10px] text-green-400">${isAdmin()?'المتحكم الرئيسي - كل الصلاحيات':'متصل'}</p></div></div>
    <button onclick="doLogoutReal()" class="bg-[#252f3d] px-3 py-1.5 rounded-full text-[10px]">خروج</button>
  </div>

  ${activeTab==='الخريجين' ? `
  <div class="p-3 space-y-3 pb-[90px] pt-4">
    ${isAdmin()?`
    <div class="bg-gradient-to-br from-[#f59e0b]/20 to-[#d97706]/20 border border-[#f59e0b]/40 rounded-2xl p-4">
      <p class="font-black text-[13px] text-[#fbbf24]">👑 مرحباً يا أحمد - أنت المتحكم الكامل</p>
      <div class="grid grid-cols-3 gap-2 mt-3">
        <div class="bg-[#0f1419] rounded-xl p-2 text-center"><p class="text-[18px] font-black text-[#3b82f6]">${users.length}</p><p class="text-[9px] text-[#9aa4b2]">مستخدم</p></div>
        <div class="bg-[#0f1419] rounded-xl p-2 text-center"><p class="text-[18px] font-black text-[#10b981]">${gradsData.length}</p><p class="text-[9px] text-[#9aa4b2]">خريج</p></div>
        <div class="bg-[#0f1419] rounded-xl p-2 text-center"><p class="text-[18px] font-black text-[#8b5cf6]">${messages.length}</p><p class="text-[9px] text-[#9aa4b2]">رسالة</p></div>
      </div>
      <div class="flex gap-2 mt-3">
        <button onclick="activeTab='الإدارة'; render()" class="flex-1 bg-[#f59e0b] text-black py-2 rounded-full text-[11px] font-black">⚙️ إدارة كاملة</button>
        <button onclick="activeTab='المستخدمين'; render()" class="flex-1 bg-[#1c2128] border border-[#2a3441] py-2 rounded-full text-[11px]">👥 كل المستخدمين</button>
      </div>
      <p class="text-[10px] text-[#fcd34d]/70 mt-2">✅ تقدر تمسح أي حساب - تعدل أي خريج - تمسح رسائل - كل حاجة</p>
    </div>
    `:`
    <div class="bg-[#1c2128] border border-green-500/30 rounded-2xl p-3 flex justify-between items-center">
      <p class="text-[11px]"><span class="text-green-400 font-bold">✅ مسجل</span> - ${currentUser.email}</p>
      <p class="text-[10px] bg-green-500/20 px-2 py-1 rounded-full">${gradsData.length} خريج</p>
    </div>`}
    <div class="flex gap-2">
      <input oninput="searchQ=this.value; render()" value="${searchQ}" placeholder="🔍 ابحث..." class="flex-1 bg-[#1c2128] border border-[#2a3441] rounded-full px-4 py-2.5 text-[12px] outline-none">
      <button onclick="searchQ=''; render()" class="bg-[#252f3d] px-4 rounded-full text-[11px]">مسح</button>
    </div>
    ${filtered.map(g=>`
      <div class="bg-[#1c2128] border ${g.isAdmin?'border-[#f59e0b]/40 bg-gradient-to-br from-[#1c2128] to-[#f59e0b]/10':''} border-[#2a3441] rounded-2xl p-4 flex gap-3">
        <div class="relative"><div class="w-14 h-14 ${g.isAdmin?'bg-gradient-to-br from-[#f59e0b] to-[#d97706]':'bg-[#3b82f6]'} rounded-full flex items-center justify-center font-black text-lg">${g.img}</div>${g.online?'<div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-[#1c2128]"></div>':''}</div>
        <div class="flex-1">
          <p class="font-black text-[13px]">${g.name} ${g.isAdmin?'👑':''}</p>
          <p class="text-[11px] text-[#9aa4b2] mt-1">${g.job} • ${g.city}</p>
          <p class="text-[10px] text-[#6b7280] mt-1">${g.points} نقطة • دفعة ${g.year}</p>
          <div class="flex gap-2 mt-3">
            <button onclick="toggleFollow(${g.id})" class="px-3 py-1.5 rounded-full text-[11px] ${g.followed?'bg-green-500/20 text-green-400':'bg-[#252f3d]'}">${g.followed?'✅ متابع':'➕ تابع'}</button>
            <button onclick="openChat(${g.id})" class="bg-[#3b82f6] px-4 py-1.5 rounded-full text-[11px] font-bold">راسل</button>
            ${isAdmin()?`<button onclick="deleteGrad(${g.id})" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-full text-[11px]">🗑️</button>`:''}
          </div>
        </div>
      </div>
    `).join('')}
  </div>
  `:''}

  ${activeTab==='المستخدمين' && isAdmin() ? `
  <div class="p-3 space-y-3 pb-[90px]">
    <button onclick="activeTab='الخريجين'; render()" class="text-sm">← رجوع</button>
    <h2 class="font-black text-[16px]">👥 كل المستخدمين المسجلين (${users.length})</h2>
    <p class="text-[11px] text-[#9aa4b2]">أنت المتحكم - تقدر تمسح أي حساب</p>
    ${users.map((u,i)=>`
      <div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex justify-between items-center">
        <div><p class="font-bold text-[12px]">${u.name} ${u.role==='super_admin'?'👑':''}</p><p class="text-[10px] text-[#9aa4b2]">${u.email} - ${u.role}</p><p class="text-[9px] text-[#6b7280]">${u.year}</p></div>
        <div class="flex gap-1">
          ${u.email!=='ahmed@admin.com' && u.email!=='jury@edu-tech.com' ? `<button onclick="deleteUser(${i})" class="bg-red-500 px-3 py-1.5 rounded-full text-[10px]">مسح</button>`: `<span class="text-[9px] text-green-400">محمي</span>`}
        </div>
      </div>
    `).join('')}
    <button onclick="if(confirm('متأكد تمسح كل المستخدمين ما عدا الأدمن؟')){users=users.filter(u=>u.email==='ahmed@admin.com'||u.email==='jury@edu-tech.com'); saveUsers(); render(); toast('✅ تم المسح');}" class="w-full bg-red-500/20 border border-red-500/30 text-red-400 py-3 rounded-full text-[12px] mt-4">🗑️ مسح كل المستخدمين (ما عدا الأدمن)</button>
  </div>
  `:''}

  ${activeTab==='الإدارة' && isAdmin() ? `
  <div class="p-3 space-y-4 pb-[90px]">
    <button onclick="activeTab='الخريجين'; render()" class="text-sm">← رجوع</button>
    <h2 class="font-black text-[16px]">⚙️ لوحة التحكم الكاملة - أحمد 👑</h2>
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-4 text-center"><p class="text-[24px] font-black">${users.length}</p><p class="text-[11px] text-[#9aa4b2]">إجمالي المستخدمين</p><button onclick="activeTab='المستخدمين'; render()" class="mt-2 bg-[#252f3d] px-3 py-1 rounded-full text-[10px]">عرض</button></div>
      <div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-4 text-center"><p class="text-[24px] font-black">${gradsData.length}</p><p class="text-[11px] text-[#9aa4b2]">إجمالي الخريجين</p><button onclick="activeTab='الخريجين'; render()" class="mt-2 bg-[#252f3d] px-3 py-1 rounded-full text-[10px]">عرض</button></div>
      <div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-4 text-center"><p class="text-[24px] font-black">${messages.length}</p><p class="text-[11px] text-[#9aa4b2]">الرسائل</p><button onclick="clearAllMsgs()" class="mt-2 bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-[10px]">مسح الكل</button></div>
      <div class="bg-[#1c2128] border border-[#f59e0b]/30 rounded-2xl p-4 text-center"><p class="text-[12px] font-black text-[#fbbf24]">أنت الأدمن</p><p class="text-[10px] text-[#9aa4b2] mt-1">صلاحيات كاملة</p><p class="text-[9px] text-green-400 mt-1">✅ متحكم 100%</p></div>
    </div>
    <div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-4 space-y-3">
      <p class="font-bold text-[13px]">🔧 أدوات الأدمن:</p>
      <button onclick="addRandomGrad()" class="w-full bg-[#3b82f6] py-2.5 rounded-full text-[12px] font-bold">➕ إضافة خريج جديد</button>
      <button onclick="exportData()" class="w-full bg-[#252f3d] py-2.5 rounded-full text-[12px]">📤 تصدير كل البيانات</button>
      <button onclick="if(confirm('مسح كل الرسائل؟')){messages=[]; saveMsgs(); render(); toast('تم مسح الرسائل');}" class="w-full bg-red-500/10 border border-red-500/20 text-red-400 py-2.5 rounded-full text-[12px]">🗑️ مسح كل الشاتات</button>
    </div>
    <div class="bg-[#0f1419] border border-[#2a3441] rounded-2xl p-3 text-[11px] text-[#9aa4b2]">
      <p class="font-bold text-white">صلاحياتك كأحمد:</p>
      <p>✅ تشوف كل المستخدمين</p>
      <p>✅ تمسح أي حساب</p>
      <p>✅ تمسح أي خريج</p>
      <p>✅ تمسح كل الرسائل</p>
      <p>✅ تضيف خريجين</p>
      <p>✅ تصدر البيانات</p>
      <p>✅ تتحكم في كل المنصة 100%</p>
    </div>
  </div>
  `:''}

  ${activeTab==='المتصدرين' ? `<div class="p-4 pb-[90px] space-y-3"><p class="font-black">🏆 المتصدرين</p>${gradsData.sort((a,b)=>b.points-a.points).slice(0,10).map((g,i)=>`<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3"><span class="font-black text-[#fbbf24]">#${i+1}</span><div class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">${g.img}</div><div><p class="font-bold text-[12px]">${g.name} ${g.isAdmin?'👑':''}</p><p class="text-[10px] text-[#9aa4b2]">${g.points} نقطة</p></div></div>`).join('')}</div>`:''}

  ${activeTab==='المختبر' ? `<div class="p-4 pb-[90px] text-center space-y-4"><p class="font-black text-[16px]">🧪 المختبر</p><p class="text-[12px] text-[#9aa4b2]">قريباً - مشاريع تكنولوجيا التعليم</p>${isAdmin()?'<p class="text-[11px] text-[#fbbf24]">👑 أنت كأدمن تقدر تضيف مشاريع هنا</p>':''}</div>`:''}

  ${activeTab==='الشات' ? `<div class="p-4 pb-[90px] space-y-3"><p class="font-black">💬 الشاتات - ${messages.length} رسالة</p>${gradsData.slice(0,5).map(g=>`<div onclick="openChat(${g.id})" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3"><div class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center">${g.img}</div><div><p class="font-bold text-[12px]">${g.name}</p><p class="text-[10px] text-[#9aa4b2]">${messages.filter(m=>m.chatId===g.id).length} رسالة</p></div></div>`).join('')}${isAdmin()?'<button onclick="clearAllMsgs()" class="w-full mt-4 bg-red-500/20 text-red-400 py-2 rounded-full text-[11px]">🗑️ مسح كل الشاتات (أدمن)</button>':''}</div>`:''}

  ${selectedChat ? `<div class="flex flex-col h-[calc(100vh-0px)]"><div class="p-3 bg-[#1c2128] border-b border-[#2a3441] flex items-center gap-3"><button onclick="selectedChat=null; render()" class="text-xl">←</button><div class="w-9 h-9 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">${selectedChat.img}</div><div><p class="font-bold text-sm">${selectedChat.name}</p><p class="text-[10px] text-green-400">متصل الآن</p></div></div><div id="msgs" class="flex-1 overflow-auto p-3 space-y-3 pb-[80px]">${messages.filter(m=>m.chatId===selectedChat.id).map(m=>`<div class="flex ${m.sender==='me'?'justify-end':'justify-start'}"><div class="${m.sender==='me'?'bg-[#3b82f6]':'bg-[#21262d]'} max-w-[75%] rounded-2xl px-4 py-2"><p class="text-sm">${m.text}</p></div></div>`).join('')}</div><div class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full p-3 bg-[#1c2128] border-t border-[#2a3441] flex gap-2"><input id="chatIn" onkeydown="if(event.key==='Enter')sendMsg()" placeholder="اكتب رسالة..." class="flex-1 bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-2.5 text-sm outline-none"><button onclick="sendMsg()" class="bg-[#3b82f6] px-5 py-2.5 rounded-full text-sm font-bold">إرسال</button></div></div>`:''}

  ${!selectedChat ? `<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-2 px-1 z-20">
    ${[{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'}, ...(isAdmin()?[{k:'الإدارة',i:'👑'},{k:'المستخدمين',i:'⚙️'}]:[])].map(n=>`<button onclick="activeTab='${n.k}'; render()" class="flex flex-col items-center text-[10px] ${activeTab===n.k?'text-[#fbbf24]':'text-[#6b7280]'}"><span class="text-[18px]">${n.i}</span>${n.k}</button>`).join('')}
  </nav>`:''}
 `;
 setTimeout(()=>{const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight},50);
}

function togglePass(){showPass=!showPass; render()}
function fillJuryReal(){form.email='jury@edu-tech.com'; form.pass='123456'; render(); toast('✅ حساب اللجنة')}
function fillAdmin(){form.email='ahmed@admin.com'; form.pass='admin123'; render(); toast('👑 حساب الأدمن أحمد - المتحكم الكامل')}
function doLoginReal(){
 if(!form.email || !form.pass){toast('❌ اكتب الإيميل والباسورد','err'); return;}
 let u = users.find(x=>x.email.toLowerCase()===form.email.toLowerCase());
 if(!u){toast('❌ الحساب مش موجود','err'); return;}
 if(u.pass!==form.pass){toast('❌ الباسورد غلط','err'); return;}
 logged=true; currentUser=u;
 localStorage.setItem('tk_real_logged','1');
 localStorage.setItem('tk_current_user', JSON.stringify(u));
 render(); toast('🎉 أهلاً '+(isAdmin()?'يا أدمن 👑 ':'')+u.name);
}
function doRegister(){
 if(!form.name || !form.email || !form.pass){toast('❌ املأ كل البيانات','err'); return;}
 if(users.find(x=>x.email.toLowerCase()===form.email.toLowerCase())){toast('❌ الإيميل مسجل قبل كده','err'); return;}
 let newUser={name:form.name, email:form.email, pass:form.pass, year:form.year, role:'user', id:Date.now()};
 users.push(newUser); saveUsers();
 logged=true; currentUser=newUser;
 localStorage.setItem('tk_real_logged','1');
 localStorage.setItem('tk_current_user', JSON.stringify(newUser));
 render(); toast('✅ مرحباً '+form.name);
}
function doLogoutReal(){logged=false; currentUser=null; localStorage.removeItem('tk_real_logged'); localStorage.removeItem('tk_current_user'); selectedChat=null; render(); toast('تم تسجيل الخروج 🔒')}
function openChat(id){selectedChat=gradsData.find(g=>g.id===id); render()}
function sendMsg(){
 const inp=document.getElementById('chatIn'); const t=inp?inp.value.trim():''; if(!t||!selectedChat) return;
 messages.push({id:Date.now(),chatId:selectedChat.id,text:t,sender:'me',time:new Date().toLocaleTimeString('ar-EG')}); saveMsgs(); render();
 setTimeout(()=>{messages.push({id:Date.now()+1,chatId:selectedChat.id,text:'تمام يا دكتور 👌','sender':'other'}); saveMsgs(); render()},600);
}
function toggleFollow(id){let g=gradsData.find(x=>x.id===id); g.followed=!g.followed; render(); toast(g.followed?'✅ تابعت '+g.name:'❌ ألغيت متابعة');}
function deleteUser(i){if(!isAdmin()) return; if(confirm('تمسح المستخدم ده؟')){users.splice(i,1); saveUsers(); render(); toast('✅ تم مسح المستخدم');}}
function deleteGrad(id){if(!isAdmin()) return; if(confirm('تمسح الخريج ده؟')){let idx=gradsData.findIndex(g=>g.id===id); if(idx>-1){gradsData.splice(idx,1); render(); toast('✅ تم مسح الخريج');}}}
function clearAllMsgs(){if(!isAdmin()) return; if(confirm('تمسح كل الرسائل؟')){messages=[]; saveMsgs(); render(); toast('✅ تم مسح كل الرسائل');}}
function addRandomGrad(){if(!isAdmin()) return; let names=['ليلى أحمد','خالد سمير','مريم عادل']; let n=names[Math.floor(Math.random()*names.length)]; gradsData.push({id:Date.now(),name:n,year:'2023',job:'مطور - جديد',city:'القاهرة',bio:'مضاف بواسطة الأدمن أحمد',online:true,img:n[0],points:200,followed:false}); render(); toast('✅ أضفت خريج: '+n);}
function exportData(){if(!isAdmin()) return; let data={users, gradsData, messages, exportBy: currentUser.name, date: new Date().toISOString()}; let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='techno-khareeg-data.json'; a.click(); toast('📤 تم تصدير البيانات');}

render();
</script>
</body>
</html>
