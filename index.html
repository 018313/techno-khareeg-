function requestNotifPermission(){

function pushBrowserNotif(title, body, icon){
  try{
    if('Notification' in window && Notification.permission==='granted' && document.hidden){
      let n=new Notification(title,{body:body, icon:icon||'', badge:'', vibrate:[200,100,200]});
      n.onclick=function(){ window.focus(); n.close(); };
      setTimeout(()=>n.close(),5000);
    }
  }catch(e){}
}
function addNotification(type, fromName, text, extra){
  if(!cur) return;
  // لا تعمل إشعار لنفسك
  if(fromName===cur.name) return;
  let notif={id:Date.now()+Math.random(), type:type, from:fromName, text:text, time:new Date().toLocaleTimeString('ar-EG'), read:false, createdAt:Date.now(), extra:extra||{}};
  notifications.unshift(notif);
  if(notifications.length>50) notifications=notifications.slice(0,50);
  // حفظ محلي
  try{ localStorage.setItem('tk_notifs_'+cur.id, JSON.stringify(notifications.slice(0,30))); }catch(e){}
  playNotifSound();
  // إشعار متصفح لو بره المنصة
  if(document.hidden){
    let titles={message:'💬 رسالة جديدة', post:'📝 منشور جديد', like:'❤️ إعجاب جديد', comment:'💬 تعليق جديد', comment_like:'❤️ إعجاب على تعليقك', reply:'↩️ رد على تعليقك'};
    pushBrowserNotif(titles[type]||'🔔 إشعار جديد', fromName+': '+text);
  }
  render();
}

function formatCallTime(sec){
  let m=Math.floor(sec/60).toString().padStart(2,'0');
  let s=(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}
function playCallSound(){
  try{ if(callSound){ callSound.currentTime=0; callSound.play().catch(()=>{}); } }catch(e){}
}
function stopCallSound(){ try{ if(callSound){ callSound.pause(); callSound.currentTime=0; } }catch(e){} }
window.startCall=async function(targetId, type, isGroup){
  if(currentCall){ toast('في مكالمة حالياً',true); return; }
  let targetName='مجهول';
  if(isGroup){
    let g=groups.find(x=>String(x.id)===String(targetId));
    targetName=g?g.name:'مجموعة';
  } else {
    let u=users.find(x=>String(x.id)===String(targetId)||String(x.email)===String(targetId));
    targetName=u?u.name:targetId;
  }
  if(!confirm((type==='video'?'📹 مكالمة فيديو':'📞 مكالمة صوتية')+' مع '+targetName+'؟')) return;
  try{
    let stream=await navigator.mediaDevices.getUserMedia({video:type==='video', audio:true});
    localStream=stream;
    let callId=Date.now().toString();
    currentCall={id:callId, targetId:targetId, targetName:targetName, type:type, isGroup:!!isGroup, status:'calling', from:cur.id, fromName:cur.name, startTime:Date.now()};
    // حفظ في Firebase
    await addDoc(collection(db,"calls"), {id:callId, from:cur.id, fromName:cur.name, fromPic:cur.pic||'', targetId:String(targetId), targetName:targetName, type:type, isGroup:!!isGroup, status:'ringing', createdAt:Date.now(), participants:isGroup?(groups.find(g=>String(g.id)===String(targetId))?.memberIds||[]):[String(targetId)]});
    // إنشاء Peer
    await createPeerConnection(callId, type, isGroup, targetId, true);
    playCallSound();
    render();
    toast((type==='video'?'📹 جاري الاتصال فيديو':'📞 جاري الاتصال')+' بـ '+targetName);
    // إشعار للطرف التاني
    addNotification('message', '📞 مكالمة', 'مكالمة '+type+' من '+cur.name, {chatId:isGroup?null:targetId, groupId:isGroup?targetId:null});
  }catch(e){
    console.log('call err',e);
    toast('❌ فشل: تأكد من السماح للكاميرا/المايك',true);
    endCallCleanup();
  }
}
async function createPeerConnection(callId, type, isGroup, targetId, isCaller){
  let config={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
  peerConnection=new RTCPeerConnection(config);
  // أضف التراك المحلي
  if(localStream){
    localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));
  }
  remoteStream=new MediaStream();
  peerConnection.ontrack=(e)=>{ e.streams[0].getTracks().forEach(t=>remoteStream.addTrack(t)); render(); };
  peerConnection.onicecandidate=async (e)=>{
    if(e.candidate){
      try{
        let q=query(collection(db,"calls"), where("id","==",String(callId)));
        let snap=await getDocs(q);
        if(!snap.empty){
          let data=snap.docs[0].data();
          let candidates=data.candidates||[];
          candidates.push({candidate:e.candidate.toJSON(), from:cur.id});
          await updateDoc(doc(db,"calls",snap.docs[0].id), {candidates:candidates});
        }
      }catch(err){}
    }
  };
  peerConnection.onconnectionstatechange=()=>{
    if(peerConnection.connectionState==='connected'){
      stopCallSound();
      if(currentCall) currentCall.status='connected';
      if(!callTimer){
        callSeconds=0;
        callTimer=setInterval(()=>{ callSeconds++; let el=document.getElementById('callTimer'); if(el) el.innerText=formatCallTime(callSeconds); },1000);
      }
      toast('✅ تم الاتصال');
      render();
    } else if(peerConnection.connectionState==='disconnected' || peerConnection.connectionState==='failed'){
      toast('📴 انقطع الاتصال',true);
      setTimeout(()=>endCall(),1000);
    }
  };
  if(isCaller){
    let offer=await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    try{
      let q=query(collection(db,"calls"), where("id","==",String(callId)));
      let snap=await getDocs(q);
      if(!snap.empty) await updateDoc(doc(db,"calls",snap.docs[0].id), {offer:offer});
    }catch(e){}
  }
}
window.acceptCall=async function(callId){
  try{
    let q=query(collection(db,"calls"), where("id","==",String(callId)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let data=snap.docs[0].data();
    let stream=await navigator.mediaDevices.getUserMedia({video:data.type==='video', audio:true});
    localStream=stream;
    currentCall={id:callId, targetId:data.from, targetName:data.fromName, type:data.type, isGroup:data.isGroup, status:'connected', from:data.from, fromName:data.fromName};
    await createPeerConnection(callId, data.type, data.isGroup, data.from, false);
    if(data.offer){
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      let answer=await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await updateDoc(doc(db,"calls",snap.docs[0].id), {answer:answer, status:'connected'});
    }
    // ICE candidates السابقة
    if(data.candidates){
      for(let c of data.candidates){
        if(c.from!==cur.id){
          try{ await peerConnection.addIceCandidate(new RTCIceCandidate(c.candidate)); }catch(e){}
        }
      }
    }
    incomingCall=null;
    stopCallSound();
    render();
    toast('✅ تم الرد على المكالمة');
  }catch(e){ console.log(e); toast('فشل الرد',true); }
}
window.rejectCall=async function(callId){
  try{
    let q=query(collection(db,"calls"), where("id","==",String(callId)));
    let snap=await getDocs(q);
    if(!snap.empty) await updateDoc(doc(db,"calls",snap.docs[0].id), {status:'rejected'});
  }catch(e){}
  incomingCall=null;
  stopCallSound();
  render();
  toast('📴 تم رفض المكالمة');
}
window.endCall=async function(){
  let cid=currentCall?.id;
  try{
    if(cid){
      let q=query(collection(db,"calls"), where("id","==",String(cid)));
      let snap=await getDocs(q);
      if(!snap.empty) await updateDoc(doc(db,"calls",snap.docs[0].id), {status:'ended', endedAt:Date.now(), duration:callSeconds});
    }
  }catch(e){}
  endCallCleanup();
  toast('📴 انتهت المكالمة - '+formatCallTime(callSeconds));
}
function endCallCleanup(){
  stopCallSound();
  if(callTimer){ clearInterval(callTimer); callTimer=null; }
  callSeconds=0;
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(peerConnection){ try{ peerConnection.close(); }catch(e){} peerConnection=null; }
  remoteStream=null;
  currentCall=null;
  isMuted=false;
  isVideoOff=false;
  render();
}
window.toggleMute=function(){
  isMuted=!isMuted;
  if(localStream){ localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); }
  render();
  toast(isMuted?'🔇 كتم الصوت':'🔊 تم إلغاء الكتم');
}
window.toggleVideo=function(){
  isVideoOff=!isVideoOff;
  if(localStream){ localStream.getVideoTracks().forEach(t=>t.enabled=!isVideoOff); }
  render();
  toast(isVideoOff?'📹 تم إيقاف الكاميرا':'📹 تم تشغيل الكاميرا');
}
window.switchCamera=async function(){
  if(!localStream) return;
  try{
    let newStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:isVideoOff?'user':'environment'}, audio:true});
    let videoTrack=newStream.getVideoTracks()[0];
    let sender=peerConnection?.getSenders().find(s=>s.track && s.track.kind==='video');
    if(sender) await sender.replaceTrack(videoTrack);
    localStream.getVideoTracks().forEach(t=>t.stop());
    localStream=newStream;
    render();
  }catch(e){ toast('فشل تبديل الكاميرا',true); }
}

      out+='<div class="absolute top-4 right-4 w-28 h-36 rounded-[16px] overflow-hidden border-2 border-white/20 shadow-2xl bg-[#1c2128]"><video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video></div>';
    } else {
      out+='<div class="absolute inset-0 bg-gradient-to-b from-[#0a0f14] via-[#1c2128] to-black flex flex-col items-center justify-center"><div class="w-32 h-32 rounded-full gradient-gold flex items-center justify-center text-5xl shadow-2xl animate-pulse">'+currentCall.targetName[0]+'</div><p class="font-black text-[20px] mt-6">'+currentCall.targetName+'</p><p class="text-[14px] text-[#9aa4b2] mt-2">'+statusText+'</p><div class="mt-8 flex gap-2"><div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div><div class="w-2 h-2 bg-green-400 rounded-full animate-pulse" style="animation-delay:0.2s"></div><div class="w-2 h-2 bg-green-400 rounded-full animate-pulse" style="animation-delay:0.4s"></div></div><p class="text-[11px] text-[#6b7280] mt-3">🎙️ مكالمة صوتية مشفرة</p></div>';

function attachCallVideos(){
  setTimeout(()=>{

function getAppState(){
  return {tab:tab, selChat:selChat, selGroup:selGroup, labTool:labTool, showGroupInfo:showGroupInfo, showCG:showCG};
}
function applyAppState(s){
  if(!s) return false;
  tab=s.tab||'الرئيسية';
  selChat=s.selChat||null;
  selGroup=s.selGroup||null;
  labTool=s.labTool||null;
  showGroupInfo=s.showGroupInfo||false;
  showCG=s.showCG||false;
  return true;
}
function pushAppState(replace){
  try{
    let st=getAppState();
    let url='#'+encodeURIComponent(tab)+(selChat?'?chat='+selChat:'')+(selGroup?'?group='+selGroup:'')+(labTool?'?lab='+labTool:'');
    if(replace) history.replaceState(st,'',url);
    else history.pushState(st,'',url);
  }catch(e){}
}
let _isPop=false;
window.addEventListener('popstate', function(e){
  _isPop=true;
  if(e.state){
    applyAppState(e.state);
    render();
  } else {
    // لو مفيش state (رجوع لأول صفحة) - لو كنا جوه شات أو مختبر، ارجع للرئيسية بدل ما تخرج
    if(selChat||selGroup||labTool||showGroupInfo||showCG){
      selChat=null; selGroup=null; labTool=null; showGroupInfo=false; showCG=false;
      tab='الرئيسية';
      render();
      pushAppState(true);
      // منع الخروج - push تاني
      history.pushState(getAppState(),'','');
    }
  }
  setTimeout(()=>_isPop=false,100);
});
// أول تحميل - ثبت الحالة
setTimeout(()=>{ try{ if(!history.state){ pushAppState(true); history.pushState(getAppState(),'',''); } }catch(e){} },500);

window.openChat=function(id){ 
  if(_isPop){ selChat=id; selGroup=null; render(); return; }

  pushAppState(false);
}

function getLevel(points){
  let p=points||0;
  if(p>=500) return {lvl:5, title:'أسطورة 🔥', next:9999};
  if(p>=200) return {lvl:4, title:'خبير 💎', next:500};
  if(p>=100) return {lvl:3, title:'نشط جداً ⚡', next:200};
  if(p>=50) return {lvl:2, title:'متفاعل 💬', next:100};
  if(p>=20) return {lvl:1, title:'مبتدئ 🌱', next:50};

}
async function addPoints(pts, reason){
  if(!cur) return;
  try{
    let newPts=(cur.points||0)+pts;
    cur.points=newPts;
    localStorage.setItem('tk_cur', JSON.stringify(cur));
    // حدث في Firebase
    let q=query(collection(db,"users"), where("email","==",cur.email));
    let snap=await getDocs(q);
    if(!snap.empty){
      await updateDoc(doc(db,"users",snap.docs[0].id), {points:newPts, lastActive:Date.now()});
    }
    if(pts>0) toast('+'+pts+' نقطة '+reason+' 🔥');
    render();
  }catch(e){ console.log('points err',e); }
}

  let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); let fn=document.getElementById('fn'); 
  if(fe) form.email=fe.value; if(fp) form.pass=fp.value; if(fn) form.name=fn.value;

  form.email=(form.email||'').trim().toLowerCase().replace(/\s+/g,'');
  form.name=(form.name||'').trim().replace(/\s{2,}/g,' ');
  form.pass=(form.pass||'').trim();
  if(!form.name||!form.email||!form.pass){ toast('املأ البيانات',true); return; } 
  if(form.name.length<2){ toast('الاسم قصير',true); return; }
  if(!form.email.includes('@')){ toast('الإيميل غلط',true); return; }
  try{ 
    toast('⏳ جاري التسجيل...');
    let q=query(collection(db,"users"), where("email","==",form.email)); 
    let snap=await getDocs(q); 
    if(!snap.empty){ toast('الإيميل مسجل قبل كده',true); return; } 
    let emailClean=form.email;
    let nu={id:emailClean,name:form.name,email:emailClean,pass:form.pass,role:'user',pic:'',city:'القاهرة',job:'خريج',points:10,lastActive:Date.now(),online:true,createdAt:Date.now(),uid:emailClean}; 
    // V7.4: استخدم setDoc مباشرة بالإيميل كمفتاح - أمان 100%
    let userDocRef=doc(db,"users", emailClean.replace(/[^a-z0-9@._-]/g,'_'));
    await setDoc(userDocRef, {...nu, docId:userDocRef.id});
    cur={...nu, docId:userDocRef.id}; 
    logged=true; 
    localStorage.setItem('tk_cur',JSON.stringify(cur)); 
    localStorage.setItem('tk_log','1'); 
    render(); 
    toast('✅ تم إنشاء حسابك - أهلاً '+form.name+' 🔥'); 
  }catch(e){

    toast('خطأ: '+ (e.message||'حاول تاني'),true);

window.likeP=async function(id){
  try{
    let q=query(collection(db,"posts"), where("id","==",Number(id)));
    let snap=await getDocs(q);
    if(snap.empty) return;
    let d=snap.docs[0];
    let data=d.data();
    let likedBy=data.likedBy||[];
    let isLiked=likedBy.includes(cur.id);
    let newLikedBy=isLiked ? likedBy.filter(x=>x!==cur.id) : [...likedBy, cur.id];
    let newLikes=isLiked ? Math.max(0,(data.likes||1)-1) : (data.likes||0)+1;
    await updateDoc(doc(db,"posts",d.id), {likes:newLikes, likedBy:newLikedBy});
    if(!isLiked){ toast('❤️ تم الإعجاب'); addPoints(2,'❤️ لايك'); }
  }catch(e){ toast('خطأ',true); }
}

window.addComment=async function(postId){

  if(!txt){ toast('اكتب تعليق',true); return; }
  var chk=checkContent(txt);

  try{

      commentData.replyTo={id:replyToCmt.id, author:replyToCmt.author};
    }
    await addDoc(collection(db,"post_comments"), commentData);
    let q=query(collection(db,"posts"), where("id","==",Number(postId)));
    let snap=await getDocs(q);
    if(!snap.empty){ await updateDoc(doc(db,"posts",snap.docs[0].id), {commentsCount:(snap.docs[0].data().commentsCount||0)+1}); }

window.deleteComment=async function(cid, postId){
  if(!confirm('مسح التعليق؟')) return;
  try{
    let q=query(collection(db,"post_comments"), where("id","==",Number(cid)));
    let snap=await getDocs(q);
    for(let d of snap.docs) await deleteDoc(doc(db,"post_comments",d.id));
    // decrement count
    try{
      let qp=query(collection(db,"posts"), where("id","==",Number(postId)));
      let sp=await getDocs(qp);
      if(!sp.empty){ await updateDoc(doc(db,"posts",sp.docs[0].id), {commentsCount:Math.max(0,(sp.docs[0].data().commentsCount||1)-1)}); }
    }catch(e){}
  }catch(e){}
}

async function initFirebase(){

 try{
  
  let q=query(collection(db,"users"), where("email","==","ahmed@admin.com")); 
  let s=await getDocs(q); 
  if(s.empty){ 
    await addDoc(collection(db,"users"), {id:"ahmed@admin.com",name:"أحمد خالد مصطفى 👑",email:"ahmed@admin.com",pass:"admin123",role:"admin",points:999,lastActive:Date.now(),online:true}); 
  } else {
    // صحح نقاط الأدمن لو صفر
    let ad=s.docs[0].data();
    if(!ad.points || ad.points<100){ await updateDoc(doc(db,"users",s.docs[0].id), {points:999}); }
  }
  // صحح نقاط كل المستخدمين القدامى
  try{
    let allU=await getDocs(collection(db,"users"));
    for(let d of allU.docs){
      let u=d.data();
      if(u.points===undefined || u.points===null){
        let pts = (u.email==='ahmed@admin.com'?999: (u.role==='admin'?999:10));
        await updateDoc(doc(db,"users",d.id), {points:pts});
      }
    }
  }catch(e){}

  onSnapshot(collection(db,"users"), snap=>{ 
    users=snap.docs.map(d=>d.data()); 
    console.log('Users loaded:', users.length, users.map(u=>u.email));
    render(); 
  });
  onSnapshot(query(collection(db,"messages"), orderBy("createdAt","asc")), snap=>{ 
    let newMsgs=snap.docs.map(d=>d.data());
    // V8.9: نظام الإشعارات + عداد غير مقروء
    if(cur && newMsgs.length>lastMsgCount && lastMsgCount>0){
      for(let i=lastMsgCount;i<newMsgs.length;i++){
        let m=newMsgs[i];
        let isForMe = (String(m.cid)===String(cur.id) || (m.gid && groups.find(g=>String(g.id)===String(m.gid) && (g.memberIds||[]).includes(String(cur.id)))));
        let isNotMine = String(m.sid)!==String(cur.id);
        if(isForMe && isNotMine){
          // عداد غير مقروء
          if(m.gid){
            let key='g_'+m.gid;
            unreadCounts[key]=(unreadCounts[key]||0)+1;
            if(String(m.gid)!==String(selGroup) && String(selChat)!==String(m.gid)){
              addNotification('message', m.sname||'مجهول', (m.txt||'رسالة جديدة').substring(0,40), {chatId:m.sid, groupId:m.gid});
            }
          } else {
            let key=m.sid;
            // لو مش فاتح الشات ده
            if(String(selChat)!==String(m.sid) && String(selChat)!==String(m.cid)){
              unreadCounts[key]=(unreadCounts[key]||0)+1;
              addNotification('message', m.sname||'مجهول', (m.txt||'رسالة جديدة').substring(0,40), {chatId:m.sid});
            } else if(selChat){
              // لو فاتح الشات - اعمل رنة بس بدون عداد
              playNotifSound();
            }
          }
          saveUnread();
        }
      }
    }
    msgs=newMsgs;
    lastMsgCount=msgs.length;
    console.log('Msgs loaded:', msgs.length);
    render(); 
  });
  onSnapshot(collection(db,"groups"), snap=>{ groups=snap.docs.map(d=>d.data()); if(groups.length===0) groups=[{id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:5},{id:102,name:'فرص عمل 💼',img:'💼',members:4}]; render(); });
  onSnapshot(query(collection(db,"posts"), orderBy("createdAt","desc")), snap=>{ 
    let newPosts=snap.docs.map(d=>d.data());
    if(cur){
      // منشورات جديدة
      if(newPosts.length>lastPostCount && lastPostCount>0){
        for(let i=0;i<newPosts.length-lastPostCount;i++){
          let p=newPosts[i];
          if(p.authorId!==cur.id && String(p.authorId)!==String(cur.id)){
            addNotification('post', p.author, (p.text||'منشور جديد').substring(0,50), {postId:p.id});
          }
        }
      }
      // إعجابات جديدة على منشوراتي
      for(let p of newPosts){
        if(String(p.authorId)===String(cur.id) || String(p.authorId)===String(cur.email)){
          let prevLikes=lastPostLikes[p.id]||0;
          if((p.likes||0) > prevLikes && prevLikes>0){
            // مين اللي عمل لايك؟ آخر واحد في likedBy
            let lastLiker = (p.likedBy||[]).slice(-1)[0];
            if(lastLiker && String(lastLiker)!==String(cur.id)){
              let likerUser=users.find(u=>String(u.id)===String(lastLiker) || String(u.email)===String(lastLiker));
              addNotification('like', likerUser?likerUser.name:'حد', 'عمل إعجاب على منشورك ❤️', {postId:p.id});
            }
          }
          lastPostLikes[p.id]=p.likes||0;
        }
      }
    }
    posts=newPosts;
    lastPostCount=posts.length;
    render(); 
  });
  onSnapshot(query(collection(db,"post_comments"), orderBy("createdAt","asc")), snap=>{ 
    let newComments=snap.docs.map(d=>d.data());
    if(cur){
      if(newComments.length>lastCommentCount && lastCommentCount>0){
        for(let i=lastCommentCount;i<newComments.length;i++){
          let c=newComments[i];
          if(String(c.authorId)!==String(cur.id)){
            let myPost=posts.find(p=>String(p.id)===String(c.postId) && (String(p.authorId)===String(cur.id) || String(p.authorId)===String(cur.email)));
            if(myPost || (c.text && c.text.includes('@'+cur.name))){
              let type=c.replyTo?'reply':'comment';
              addNotification(type, c.author, (c.text||'تعليق').substring(0,50), {postId:c.postId});
            }
          }
        }
      }
      // إعجابات تعليقاتي
      for(let c of newComments){
        if(String(c.authorId)===String(cur.id) || String(c.authorId)===String(cur.email)){
          let prev=lastCommentLikes[c.id]||0;
          if((c.likes||0) > prev && prev>=0 && lastCommentCount>0){
            let lastLiker = (c.likedBy||[]).slice(-1)[0];

// PWA Install Prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('[PWA] Install prompt ready');
  // نعرض زرار التثبيت في الرئيسية لاحقاً
  setTimeout(()=>{ 
    if(deferredPrompt && cur){
      toast('📲 ثبت تكنو خريج كتطبيق عشان المكالمات ترن حتى لو قافل!');
    }
  },5000);
});

window.installPWA = async function(){
  if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
    toast('✅ التطبيق مثبت بالفعل! افتحه من الشاشة الرئيسية - المكالمات هترن حتى لو قافل 📞');
    return;
  }
  if(!deferredPrompt) {
    // جرب الطريقة اليدوية
    toast('📲 دوس 3 نقط فوق في Chrome ← تثبيت التطبيق');
    return;
  }
  deferredPrompt.prompt();
  let choice = await deferredPrompt.userChoice;
  if(choice.outcome === 'accepted') toast('✅ تم تثبيت تكنو خريج كتطبيق! افتحه من الشاشة الرئيسية');
  deferredPrompt = null;
}

// دالة لإرسال إشعار للـ SW حتى لو الصفحة في الخلفية
function notifySW(type, data){
  try{
    if(swRegistration && swRegistration.active){
      swRegistration.active.postMessage({type: type, ...data});
    }
    // كمان لو الـ SW مش شغال، نستخدم الـ registration مباشرة
    if(navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({type: type, ...data});
    }
  }catch(e){}
}

// نحدث دالة الإشعارات القديمة عشان تبعت للـ SW كمان
let oldAddNotification = addNotification;
addNotification = function(type, fromName, text, extra){
  oldAddNotification(type, fromName, text, extra);
  // لو الصفحة مخفية، خلي الـ SW يعرض الإشعار
  if(document.hidden){
    if(type === 'message' && text.includes('مكالمة')){
      // مكالمة - إشعار مهم
      notifySW('SHOW_CALL_NOTIFICATION', {fromName: fromName, callType: 'voice', callId: extra?.chatId || Date.now(), ...extra});
    } else {
      notifySW('SHOW_MSG_NOTIFICATION', {fromName: fromName, text: text});
    }
  }
}

// V8.9: لو المستخدم خرج بره التبويب - اطلب إذن الإشعارات + رنة
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    requestNotifPermission();
  }
});
window.addEventListener('focus', function(){
  if(cur) loadNotifs();
});
setTimeout(()=>{ requestNotifPermission(); },2000);

// كشف لو التطبيق مثبت كـ PWA
window.addEventListener('appinstalled', () => {
  console.log('[PWA] Installed');
  toast('🎉 تكنو خريج اتثبت! دلوقتي المكالمات هترن حتى لو قافل التبويب');
});
