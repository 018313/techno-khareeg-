function doLogin(){

  logged=true; localStorage.setItem('tk_jury_logged','1'); render(); toast('🎉 مرحباً باللجنة - تم الدخول بنجاح - المنصة حصرية بدون ضيف');
 } else if(emailVal && passVal.length>=4){
  logged=true; localStorage.setItem('tk_jury_logged','1'); render(); toast('✅ تم تسجيل الدخول - 27 خريج في انتظارك');
 } else { toast('❌ اكتب الإيميل والباسورد - جرّب: jury@edu-tech.com / 123456','err') }
}
function doLogout(){logged=false; localStorage.removeItem('tk_jury_logged'); selectedChat=null; selectedGrad=null; render(); toast('تم تسجيل الخروج - المنصة حصرية 🔒')}
function openGrad(id){selectedGrad=gradsData.find(g=>g.id===id); render()}
function openChat(id){selectedChat=gradsData.find(g=>g.id===id); selectedGrad=null; render()}
function sendMsg(){
 const inp=document.getElementById('chatIn'); const t=inp?inp.value.trim():''; if(!t||!selectedChat) return;
 const msg={id:Date.now(),chatId:selectedChat.id,text:t,sender:'me',time:new Date().toLocaleTimeString('ar-EG')};
 messages.push(msg); saveMsgs(); render();
