<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تنظيف - كل المستخدمين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>*{font-family:'Tajawal',sans-serif}body{background:#0a0f14;color:white}</style>
</head>
<body class="p-4 max-w-[480px] mx-auto">
<h1 class="text-xl font-black">🧹 تنظيف المكرر</h1>
<p class="text-xs text-gray-400 mt-1">بيظهر كل المستخدمين - بيمسح المكرر بس</p>

<div id="s" class="mt-4 p-3 bg-[#1c2128] rounded-xl text-sm">⏳ جاري التحميل...</div>
<div id="l" class="mt-4 space-y-2"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyAX_yrLx7ltNv6HXh4KMwioi-YxsO0WVCM",
  authDomain: "technokhareeg2.firebaseapp.com",
  projectId: "technokhareeg2",
  storageBucket: "technokhareeg2.firebasestorage.app",
  messagingSenderId: "526382735312",
  appId: "1:526382735312:web:cebbef6f52ac20f1c063d5"
}));

try{
  let snap = await getDocs(collection(db,"users"));
  document.getElementById('s').innerHTML = `✅ لقينا <b>${snap.size}</b> مستخدم`;

  let dupes = [];
  let html = "";

  snap.forEach(d=>{
    let data = d.data();
    let email = (data.email||"").toLowerCase();
    let name = data.name || email;
    if(email === "ahmed@admin.com") dupes.push(d);

    html += `
    <div class="p-3 rounded-xl flex justify-between items-center ${email==='ahmed@admin.com'? 'bg-orange-500/20 border border-orange-500' : 'bg-[#1c2128]'}">
      <div>
        <b class="text-sm">${name}</b><br>
        <span class="text-[11px] text-gray-400">${email}<br>ID: ${d.id.substring(0,20)}...</span>
        ${email==='ahmed@admin.com'? '<div class="text-[10px] bg-orange-500 text-white px-2 py-0.5 rounded-full inline-block mt-1">مكرر</div>' : ''}
      </div>
      <button onclick="delUser('${d.id}','${email}')" class="bg-red-600 text-white px-3 py-2 rounded-xl text-xs font-bold">مسح</button>
    </div>`;
  });

  document.getElementById('l').innerHTML = html;

  if(dupes.length > 1){
    document.getElementById('s').innerHTML += `<br><br>⚠️ فيه <b style="color:orange">${dupes.length} نسخة</b> من ahmed@admin.com - امسح واحدة عشان يرجع 6`;
  }

  window.delUser = async (id, email) => {
    if(!confirm(`متأكد تمسح ${email}؟`)) return;
    try{
      await deleteDoc(doc(db,"users",id));
      alert("✅ اتمسح!");
      location.reload();
    }catch(e){ alert("❌ "+e.message); }
  };

}catch(e){
  document.getElementById('s').innerHTML = "❌ خطأ: "+e.message+"<br>افتح Firestore Rules وخليها allow read, write: if true;";
}
</script>
</body>
</html>
