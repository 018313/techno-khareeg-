 if(activeTab==='الشات' && !selectedChat){
   let chats=grads.map(g=>{let last=messages.filter(m=>m.chatId===g.id).slice(-1)[0]; return {...g,lastMsg:last?last.text:'ابدأ المحادثة',time:last?last.time:''}}).filter(g=> chatTab==='individual' || true);
   h+=`<div class="p-3"><div class="flex bg-[#1c2128] rounded-full p-1 mb-3"><button onclick="chatTab='individual';render()" class="flex-1 py-2 rounded-full text-[11px] ${chatTab==='individual'?'bg-[#3b82f6] font-bold':'text-[#9aa4b2]'}">فردي</button><button onclick="chatTab='group';render()" class="flex-1 py-2 rounded-full text-[11px] ${chatTab==='group'?'bg-[#3b82f6] font-bold':'text-[#9aa4b2]'}">جماعي</button></div><div class="space-y-2">${chatTab==='group'?`<div onclick="openGroup(999)" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3 cursor-pointer"><div class="w-12 h-12 bg-gradient-to-br from-[#fb923c] to-[#d97706] rounded-full flex items-center justify-center">👥</div><div><p class="font-bold text-[13px]">دفعة 2024 - جروب عام</p><p class="text-[11px] text-[#9aa4b2]">23 عضو • نشط الآن</p></div></div>`:chats.map(c=>`<div onclick="openChat(${c.id})" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3 cursor-pointer hover:bg-[#252f3d]"><div class="w-12 h-12 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold relative">${c.img}${c.online?'<span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-[#1c2128]"></span>':''}</div><div class="flex-1"><p class="font-bold text-[12px]">${c.name}</p><p class="text-[11px] text-[#9aa4b2] truncate w-[180px]">${c.lastMsg}</p></div><p class="text-[9px] text-[#6b7280]">${c.time}</p></div>`).join('')}</div></div>`;
 }
 if(selectedChat){
   let chatMsgs=messages.filter(m=>m.chatId===selectedChat.id);
   h+=`<div class="flex flex-col h-[calc(100vh-125px)]"><div class="bg-[#1c2128] border-b border-[#2a3441] p-3 flex items-center gap-3"><button onclick="selectedChat=null;render()" class="bg-[#252f3d] w-8 h-8 rounded-full">←</button><div class="w-9 h-9 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">${selectedChat.img||'👥'}</div><div class="flex-1"><p class="font-bold text-[13px]">${selectedChat.name}</p><p class="text-[10px] text-green-400">● متصل الآن • يكتب... • تفاعلي 100%</p></div><button onclick="toast('📞 مكالمة صوتية - ${selectedChat.name}')" class="w-8 h-8 bg-[#252f3d] rounded-full">📞</button></div>
     <div id="msgs" class="flex-1 p-3 space-y-3 overflow-auto pb-[10px]">${chatMsgs.length===0?`<div class="text-center py-16"><p class="text-5xl mb-3">💬</p><p class="font-bold text-[14px]">ابدأ المحادثة</p><p class="text-[11px] text-[#9aa4b2] mt-2">الشات تفاعلي 100% - جرب تبعت رسالة</p><div class="flex justify-center gap-2 mt-4"><button onclick="quickSend('مرحبا 👋')" class="bg-[#1c2128] border px-3 py-1.5 rounded-full text-[11px]">مرحبا 👋</button><button onclick="quickSend('عامل ايه؟')" class="bg-[#1c2128] border px-3 py-1.5 rounded-full text-[11px]">عامل ايه؟</button></div></div>`:chatMsgs.map(m=>`<div class="flex ${m.sender==='me'?'justify-end':'justify-start'}"><div class="${m.sender==='me'?'bg-[#3b82f6] rounded-br-sm':'bg-[#1c2128] border border-[#2a3441] rounded-bl-sm'} max-w-[78%] rounded-2xl px-4 py-2.5 shadow"><p class="text-[13px] leading-5">${m.text}</p><div class="flex justify-between gap-3 mt-1"><p class="text-[9px] opacity-60">${m.time}</p><p class="text-[9px] opacity-60">${m.sender==='me'?'✓✓ مقروء':'✓'}</p></div></div></div>`).join('')}</div>
     <div class="p-3 bg-[#1c2128]/95 backdrop-blur border-t border-[#2a3441] flex gap-2 items-center">
       <button onclick="toggleEmoji()" class="bg-[#0d1117] border border-[#2a3441] w-10 h-10 rounded-full flex items-center justify-center">😊</button>
       <input id="chatInput" onkeydown="if(event.key==='Enter')sendMsg()" placeholder="اكتب رسالة هنا... 👇 تفاعلي 100%" class="flex-1 bg-[#0d1117] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none focus:border-[#3b82f6] focus:ring-1 focus:ring-[#3b82f6]">
       <button onclick="sendMsg()" class="bg-[#3b82f6] w-12 h-12 rounded-full flex items-center justify-center font-black shadow-lg text-[18px]">↑</button>
     </div>
     <div id="emojiBar" class="hidden bg-[#1c2128] border-t border-[#2a3441] p-2 flex gap-2 overflow-auto no-scrollbar">${['😊','😂','❤️','🔥','👏','🎉','✅','👍','🙏','💪','🚀','💼','👋','😍'].map(e=>`<button onclick="quickSend('${e}')" class="text-xl bg-[#0d1117] min-w-[40px] h-10 rounded-full">${e}</button>`).join('')}</div>
   </div>`;
 }
 if(activeTab==='المنشورات' && !selectedChat && !selectedGrad){
   h+=`<div class="p-3 space-y-4"><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3"><textarea id="newPost" placeholder="شارك خبر، فرصة، أو إنجاز..." class="w-full bg-[#0d1117] border border-[#2a3441] rounded-xl p-3 text-[12px] h-20 outline-none resize-none"></textarea><button onclick="addPost()" class="mt-2 w-full bg-[#3b82f6] py-2.5 rounded-full text-[12px] font-bold">نشر 🚀</button></div>${posts.map(p=>`<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-4"><div class="flex gap-2"><div class="w-9 h-9 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold text-[12px]">${p.author[0]}</div><div><p class="font-bold text-[12px]">${p.author}</p><p class="text-[10px] text-[#6b7280]">${p.time}</p></div></div><p class="text-[13px] mt-3 leading-6">${p.content}</p><div class="flex gap-4 mt-3 text-[11px] text-[#9aa4b2]"><button onclick="likePost(${p.id})" class="${p.liked?'text-red-400':''}">${p.liked?'❤️':'🤍'} ${p.likes}</button><button onclick="toast('💬 تعليق - قريباً')">💬 ${p.comments.length}</button><button onclick="toast('🔗 تم نسخ المنشور')">🔗 ${p.shares}</button></div></div>`).join('')}</div>`;
 }
 if(activeTab==='حسابي' && !selectedChat && !selectedGrad){
   h+=`<div class="p-3 space-y-4"><div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-5 text-center"><div onclick="document.getElementById('imgPicker').click()" class="relative w-24 h-24 mx-auto cursor-pointer group"><img id="profilePreview" src="${profileImg||''}" class="${profileImg?'':'hidden'} w-24 h-24 rounded-full object-cover border-4 border-[#3b82f6]"><div class="${profileImg?'hidden':''} w-24 h-24 bg-[#3b82f6] rounded-full flex items-center justify-center text-2xl font-black">أ</div><div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100">📷</div></div><p class="text-[10px] text-[#9aa4b2] mt-2">دوس على الصورة لتغييرها</p><h3 class="font-black text-[15px] mt-3">أحمد خالد مصطفى</h3><p class="text-[12px] text-[#9aa4b2]">مبرمج المنصة - 2024</p></div>
   <div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 space-y-2"><button onclick="editField('الاسم')" class="w-full flex justify-between p-3 bg-[#0d1117] rounded-xl text-[12px]"><span>الاسم</span><span class="text-[#9aa4b2]">أحمد خالد ✏️</span></button><button onclick="editField('الوظيفة')" class="w-full flex justify-between p-3 bg-[#0d1117] rounded-xl text-[12px]"><span>الوظيفة</span><span class="text-[#9aa4b2]">مطور واجهات ✏️</span></button><button onclick="editField('المدينة')" class="w-full flex justify-between p-3 bg-[#0d1117] rounded-xl text-[12px]"><span>المدينة</span><span class="text-[#9aa4b2]">القاهرة ✏️</span></button><button onclick="saveProfile()" class="w-full bg-[#3b82f6] py-3 rounded-full text-[12px] font-bold mt-2">حفظ التعديلات ✅</button></div></div>`;
 }

 h+=`<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-2 px-1 z-20">${[{k:'الرئيسية',i:'🏠'},{k:'الخريجين',i:'👥'},{k:'المتصدرين',i:'🏆'},{k:'المختبر',i:'🧪'},{k:'الشات',i:'💬'},{k:'المنشورات',i:'📝'},{k:'حسابي',i:'👤'}].map(n=>`<button onclick="activeTab='${n.k}';selectedChat=null;selectedGrad=null;labActive=null;showNotifs=false;render()" class="flex flex-col items-center text-[10px] ${activeTab===n.k?'text-[#60a5fa]':'text-[#6b7280]'}"><span class="text-[18px]">${n.i}</span><span class="mt-0.5">${n.k}</span></button>`).join('')}</nav>`;

 document.getElementById('app').innerHTML=h;
 setTimeout(()=>{const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight},30);
 // keep search focus
 if(activeTab==='الخريجين'){
   const inp=document.getElementById('searchGrad');
   if(inp){ const v=inp.value; inp.focus(); inp.setSelectionRange(v.length,v.length); }
 }
}

function renderSearch(){render()}

function toggleNotifs(){showNotifs=!showNotifs; render()}
function markAllRead(){notifications.forEach(n=>n.read=true); saveAll(); render(); toast('✅ تم تعليم الكل كمقروء')}
function clearNotifs(){notifications=[]; saveAll(); render(); toast('🗑️ تم مسح الإشعارات')}
function openNotif(id){const n=notifications.find(x=>x.id===id); if(n){n.read=true; activeTab=n.tab; showNotifs=false; saveAll(); render()}}

function openGrad(id){selectedGrad=grads.find(g=>g.id===id); render()}
function openChat(id){selectedChat=grads.find(g=>g.id===id); selectedGrad=null; activeTab='الشات'; render()}
function openGroup(id){selectedChat={id:999,name:'دفعة 2024 - جروب عام',img:'👥'}; activeTab='الشات'; render()}

function quickSend(t){const inp=document.getElementById("chatInput"); if(inp){inp.value=t; sendMsg()} else { // if no input yet, set as search?
 const ci=document.getElementById('chatInput'); if(ci) {ci.value=t; sendMsg()} else { toast(t) }
}}
function toggleEmoji(){document.getElementById("emojiBar")?.classList.toggle("hidden")}
function sendMsg(){const inp=document.getElementById('chatInput');const t=inp?inp.value.trim():''; if(!t||!selectedChat) return; messages.push({id:Date.now(),chatId:selectedChat.id,text:t,sender:'me',time:new Date().toLocaleTimeString('ar-EG')}); saveAll(); render(); setTimeout(()=>{messages.push({id:Date.now()+1,chatId:selectedChat.id,text:['تمام 👌','عاش 🔥','اتفقنا','أكيد هبعتلك التفاصيل','زي الفل 👌'][Math.floor(Math.random()*5)],sender:'other',time:new Date().toLocaleTimeString('ar-EG')}); addNotif('رسالة جديدة','رد من '+selectedChat.name); saveAll(); render()},900)}

function addPost(){const el=document.getElementById('newPost'); if(!el.value.trim()){toast('اكتب حاجة الأول!','error'); return} posts.unshift({id:Date.now(),author:'أنت',time:'الآن',content:el.value,likes:0,liked:false,comments:[],shares:0}); el.value=''; saveAll(); render(); toast('✅ تم نشر المنشور - وصل لـ 27 خريج 🔥 🔔')}
function likePost(id){const p=posts.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; saveAll(); render(); if(p.liked) toast('❤️ عملت إعجاب')}

function toggleFollow(id){let g=grads.find(x=>x.id===id); g.followed=!g.followed; if(selectedGrad && selectedGrad.id===id) selectedGrad.followed=g.followed; saveAll(); render(); toast(g.followed?'✅ تابعت '+g.name:'❌ ألغيت متابعة '+g.name)}
function applyJob(id){let j=savedJobs.find(x=>x.id===id); if(j.applied){toast('انت قدمت عليها قبل كده ✅'); return} j.applied=true; saveAll(); render(); toast('✅ تم التقديم على '+j.title+' - هنتواصل معاك'); addNotif('تم التقديم','قدمت على '+j.title)}
function toggleSaveJob(id){let j=savedJobs.find(x=>x.id===id); j.saved=!j.saved; saveAll(); render(); toast(j.saved?'⭐ تم حفظ الوظيفة':'☆ تم إلغاء الحفظ')}
function toggleTheme(){isLight=!isLight; localStorage.setItem('tk_theme',isLight?'light':'dark'); render(); toast(isLight?'☀️ وضع فاتح':'🌙 وضع داكن')}

function editField(field){
 const overlay=document.createElement('div');
 overlay.className='fixed inset-0 bg-black/70 z-[200] flex items-center justify-center p-4';
 overlay.innerHTML=`<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-5 w-full max-w-[340px]"><h3 class="font-black text-[14px] mb-3">تعديل ${field}</h3><input id="editInput" class="w-full bg-[#0d1117] border border-[#2a3441] rounded-xl px-4 py-3 text-[13px] outline-none" placeholder="اكتب ${field} الجديد"><div class="flex gap-2 mt-4"><button onclick="this.closest('.fixed').remove()" class="flex-1 bg-[#252f3d] py-2.5 rounded-full text-[12px]">إلغاء</button><button onclick="const v=document.getElementById('editInput').value; if(v.trim()){toast('✅ تم حفظ ${field}: '+v); this.closest('.fixed').remove()}else{toast('اكتب حاجة','error')}" class="flex-1 bg-[#3b82f6] py-2.5 rounded-full text-[12px] font-bold">حفظ</button></div></div>`;
 document.body.appendChild(overlay);
 setTimeout(()=>document.getElementById('editInput')?.focus(),100);
}
function saveProfile(){toast('✅ تم حفظ التعديلات - تفاعلي 100% بدون Alert')}

// تغيير الصورة الحقيقي
document.getElementById('imgPicker').addEventListener('change', function(e){
 const file=e.target.files[0];
 if(!file) return;
 const reader=new FileReader();
 reader.onload=function(ev){
   profileImg=ev.target.result;
   localStorage.setItem('tk_profile_img',profileImg);
   render();
   toast('📷 تم تغيير الصورة بنجاح - تفاعلي حقيقي 100%');
 }
 reader.readAsDataURL(file);
});

render();
</script>
</body>
</html>
