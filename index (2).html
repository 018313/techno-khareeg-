<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تكنو خريج - شات مجموعات + صور + فويس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Tajawal',sans-serif} body{background:#0f1419;color:white} .toast{animation:slideUp 0.3s} @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}</style>
</head>
<body>
<div id="root" class="max-w-[480px] mx-auto min-h-screen bg-[#0f1419] relative"></div>
<div id="toastBox" class="fixed bottom-[20px] left-1/2 -translate-x-1/2 z-[200] space-y-2 w-[90%] max-w-[380px]"></div>
<input type="file" id="imgInput" accept="image/*" class="hidden">
<script>
function toast(msg,type='ok'){
 const c=document.getElementById('toastBox'); const d=document.createElement('div');
 d.className=`toast px-4 py-3 rounded-2xl text-[12px] font-bold shadow-2xl border ${type==='ok'?'bg-[#1c2128]/95 border-[#2a3441]':'bg-red-500/90 border-red-400'} text-white text-center`;
 d.innerText=msg; c.appendChild(d);
 setTimeout(()=>{d.style.opacity='0'; setTimeout(()=>d.remove(),300)},3500);
}
const gradsData=[
 {id:1,name:'أحمد خالد مصطفى 👑',year:'2023',job:'مؤسس المنصة',city:'القاهرة',img:'أ',points:999,isAdmin:true,online:true},
 {id:2,name:'سارة محمد أحمد',year:'2023',job:'Instructional Designer',city:'المنصورة',img:'س',points:510,online:true},
 {id:3,name:'محمود أحمد علي',year:'2023',job:'Backend - Vezeeta',city:'الإسكندرية',img:'م',points:480,online:true},
 {id:4,name:'نورهان عصام',year:'2023',job:'UI/UX - SWVL',city:'القاهرة',img:'ن',points:460,online:true},
 {id:5,name:'محمد علي حسن',year:'2023',job:'مصمم تعليمي',city:'القاهرة',img:'م',points:445,online:false},
 {id:6,name:'ريم طارق',year:'2022',job:'E-Learning - TIEC',city:'الجيزة',img:'ر',points:430,online:true},
 {id:7,name:'عبدالرحمن جمال',year:'2023',job:'Fullstack - Instabug',city:'القاهرة',img:'ع',points:420,online:true},
];
let users = JSON.parse(localStorage.getItem('tk_real_users')||'[]');
if(!users.find(u=>u.email==='jury@edu-tech.com')) users.push({name:'لجنة التحكيم', email:'jury@edu-tech.com', pass:'123456', year:'2023', role:'jury'});
if(!users.find(u=>u.email==='ahmed@admin.com')) users.push({name:'أحمد خالد مصطفى - الأدمن 👑', email:'ahmed@admin.com', pass:'admin123', year:'2023', role:'super_admin'});
localStorage.setItem('tk_real_users', JSON.stringify(users));
let logged = localStorage.getItem('tk_real_logged')==='1';
let currentUser = JSON.parse(localStorage.getItem('tk_current_user')||'null');
let activeTab='الشات';
let showPass=false, selectedChat=null, selectedGroup=null, authMode='login', form={name:'',email:'',pass:'',year:'2023'};
let messages = JSON.parse(localStorage.getItem('tk_msgs_v2')||'[]');
let groups = JSON.parse(localStorage.getItem('tk_groups')||'[]');
if(groups.length===0){
 groups=[
  {id:101,name:'دفعة تكنولوجيا 2023 🎓',img:'🎓',members:[1,2,3,4,5],createdBy:1,desc:'جروب الدفعة الرسمي'},
  {id:102,name:'فرص عمل - TIEC 💼',img:'💼',members:[1,2,6,7],createdBy:1,desc:'وظائف تكنولوجيا التعليم'},
  {id:103,name:'مشاريع التخرج 🚀',img:'🚀',members:[1,3,4,5],createdBy:1,desc:'مناقشة مشاريع'},
 ];
 localStorage.setItem('tk_groups', JSON.stringify(groups));
}
let isRecording=false, mediaRecorder=null, audioChunks=[], recordingTime=0, recordingInterval=null;
let showCreateGroup=false, newGroupName='', selectedMembers=[];

function saveMsgs(){localStorage.setItem('tk_msgs_v2',JSON.stringify(messages))}
function saveGroups(){localStorage.setItem('tk_groups',JSON.stringify(groups))}
function saveUsers(){localStorage.setItem('tk_real_users',JSON.stringify(users))}
function isAdmin(){return currentUser && (currentUser.role==='super_admin' || currentUser.email==='ahmed@admin.com');}

function render(){
 const root=document.getElementById('root');
 if(!logged){
  root.innerHTML=`<div class="min-h-screen flex flex-col p-5 justify-center">
    <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-3xl mx-auto flex items-center justify-center text-3xl">👑</div>
    <h1 class="font-black text-[22px] mt-4">تكنو خريج</h1><p class="text-[12px] text-[#9aa4b2]">شات مجموعات + صور + فويس 🎤📸</p>
    <div class="mt-3 bg-[#1c2128] border border-[#8b5cf6]/30 rounded-2xl p-3 text-[11px] text-right"><p class="font-bold text-[#a78bfa]">✨ الجديد:</p><p class="text-[#9aa4b2]">• مجموعات • صور • فويس • فردي وجماعي</p></div></div>
    <div class="bg-[#1c2128] border border-[#2a3441] rounded-3xl p-5 space-y-4">
      <div class="flex gap-2"><button onclick="authMode='login';render()" class="flex-1 py-2.5 rounded-full text-[12px] font-bold ${authMode==='login'?'bg-[#3b82f6]':'bg-[#252f3d]'}">دخول</button><button onclick="authMode='register';render()" class="flex-1 py-2.5 rounded-full text-[12px] font-bold ${authMode==='register'?'bg-[#3b82f6]':'bg-[#252f3d]'}">حساب جديد</button></div>
      ${authMode==='register'?`<input value="${form.name}" oninput="form.name=this.value" placeholder="الاسم" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">`:''}
      <input value="${form.email}" oninput="form.email=this.value" placeholder="الإيميل" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none">
      <div class="relative"><input value="${form.pass}" oninput="form.pass=this.value" type="${showPass?'text':'password'}" placeholder="الباسورد" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-3 text-[13px] outline-none"><button onclick="showPass=!showPass;render()" class="absolute left-3 top-1/2 -translate-y-1/2 text-[12px]">${showPass?'🙈':'👁️'}</button></div>
      ${authMode==='login'?`<button onclick="doLogin()" class="w-full bg-[#3b82f6] py-3 rounded-full font-black">دخول 🔒</button><button onclick="form.email='ahmed@admin.com';form.pass='admin123';render()" class="w-full bg-gradient-to-r from-[#f59e0b] to-[#d97706] py-2.5 rounded-full text-[11px] font-black text-black">👑 دخول الأدمن - متحكم كامل</button><button onclick="form.email='jury@edu-tech.com';form.pass='123456';render()" class="w-full bg-[#1c2128] border border-[#2a3441] py-2 rounded-full text-[11px]">🎓 دخول اللجنة</button>`:`<button onclick="doRegister()" class="w-full bg-[#10b981] py-3 rounded-full font-black">إنشاء حساب ✅</button>`}
    </div></div>`; return;
 }
 root.innerHTML=`
  <div class="p-3 flex justify-between items-center bg-[#1c2128] border-b border-[#2a3441] sticky top-0 z-10">
    <div class="flex items-center gap-2"><div class="w-8 h-8 bg-gradient-to-br from-[#f59e0b] to-[#d97706] rounded-full flex items-center justify-center text-sm">👑</div><div><p class="font-bold text-[11px]">${currentUser.name} ${isAdmin()?'👑':''}</p><p class="text-[9px] text-green-400">${groups.length} جروب - ${messages.length} رسالة</p></div></div>
    <button onclick="doLogout()" class="bg-[#252f3d] px-3 py-1.5 rounded-full text-[10px]">خروج</button>
  </div>

  ${selectedChat || selectedGroup ? `
    <div class="flex flex-col h-[calc(100vh-50px)]">
      <div class="p-3 bg-[#1c2128] border-b border-[#2a3441] flex items-center gap-3">
        <button onclick="selectedChat=null;selectedGroup=null;render()" class="text-xl">←</button>
        <div class="w-9 h-9 ${selectedGroup?'bg-[#8b5cf6]':'bg-[#3b82f6]'} rounded-full flex items-center justify-center font-bold">${selectedGroup?selectedGroup.img: selectedChat.img}</div>
        <div class="flex-1"><p class="font-bold text-[13px]">${selectedGroup?selectedGroup.name:selectedChat.name} ${selectedGroup?'👥':''}</p><p class="text-[10px] text-[#9aa4b2]">${selectedGroup?selectedGroup.members.length+' عضو':'متصل الآن'}</p></div>
      </div>
      <div id="msgsBox" class="flex-1 overflow-auto p-3 space-y-3 bg-[#0f1419]">
        ${(selectedGroup ? messages.filter(m=>m.groupId===selectedGroup.id) : messages.filter(m=>m.chatId===selectedChat.id && !m.groupId)).map(m=>`
          <div class="flex ${m.senderId===currentUser.id?'justify-end':'justify-start'}">
            <div class="max-w-[78%] rounded-2xl px-3 py-2 ${m.senderId===currentUser.id?'bg-[#3b82f6] rounded-br-sm':'bg-[#21262d] rounded-bl-sm'}">
              ${selectedGroup && m.senderId!==currentUser.id ? `<p class="text-[9px] font-bold text-[#fbbf24] mb-1">${m.senderName}</p>`:''}
              ${m.type==='text'?`<p class="text-[13px]">${m.text}</p>`:''}
              ${m.type==='image'?`<img src="${m.image}" class="rounded-xl max-w-[200px]"><p class="text-[11px] mt-1">${m.text||''}</p>`:''}
              ${m.type==='voice'?`<div class="flex items-center gap-2 min-w-[160px]"><audio controls src="${m.audio}" class="w-[160px] h-8"></audio><span class="text-[9px]">🎤 ${m.duration}</span></div>`:''}
              <p class="text-[8px] opacity-60 mt-1">${m.time||''}</p>
            </div>
          </div>
        `).join('') || '<p class="text-center text-[12px] text-[#6b7280] mt-10">ابدأ المحادثة - نص، صورة 📸، فويس 🎤</p>'}
      </div>
      <div class="p-2 bg-[#1c2128] border-t border-[#2a3441] flex items-end gap-2">
        <button onclick="openImagePicker()" class="w-10 h-10 bg-[#252f3d] rounded-full flex items-center justify-center">📸</button>
        <button id="recBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" class="w-10 h-10 ${isRecording?'bg-red-500 animate-pulse':'bg-[#252f3d]'} rounded-full flex items-center justify-center">${isRecording?'🔴':'🎤'}</button>
        <div class="flex-1 bg-[#0f1419] border border-[#2a3441] rounded-full flex items-center px-3"><input id="chatIn" onkeydown="if(event.key==='Enter')sendMsg()" placeholder="${isRecording?'🔴 جاري التسجيل '+recordingTime+'s':'اكتب رسالة...'}" class="flex-1 bg-transparent py-2.5 text-[13px] outline-none" ${isRecording?'disabled':''}></div>
        <button onclick="sendMsg()" class="w-10 h-10 bg-[#3b82f6] rounded-full flex items-center justify-center">➤</button>
      </div>
    </div>
  `:`
    ${activeTab==='الشات'?`
      <div class="p-3 pb-[90px] space-y-4">
        <button onclick="showCreateGroup=true;selectedMembers=[];newGroupName='';render()" class="w-full bg-gradient-to-r from-[#8b5cf6] to-[#7c3aed] py-3 rounded-full text-[12px] font-black">➕ إنشاء مجموعة جديدة - أي حد يقدر يعمل جروب</button>
        ${showCreateGroup?`
        <div class="bg-[#1c2128] border border-[#8b5cf6]/40 rounded-2xl p-4 space-y-3">
          <p class="font-black text-[13px]">👥 إنشاء مجموعة جديدة</p>
          <input value="${newGroupName}" oninput="newGroupName=this.value" placeholder="اسم المجموعة" class="w-full bg-[#0f1419] border border-[#2a3441] rounded-full px-4 py-2.5 text-[12px] outline-none">
          <p class="text-[11px] text-[#9aa4b2]">اختار الأعضاء (${selectedMembers.length}):</p>
          <div class="max-h-[120px] overflow-auto space-y-1">${gradsData.map(g=>`<label class="flex items-center gap-2 bg-[#0f1419] rounded-full px-3 py-1.5"><input type="checkbox" ${selectedMembers.includes(g.id)?'checked':''} onchange="toggleMember(${g.id})"><span class="text-[11px]">${g.name}</span></label>`).join('')}</div>
          <div class="flex gap-2"><button onclick="createGroup()" class="flex-1 bg-[#8b5cf6] py-2 rounded-full text-[12px] font-bold">إنشاء ✅</button><button onclick="showCreateGroup=false;render()" class="flex-1 bg-[#252f3d] py-2 rounded-full text-[12px]">إلغاء</button></div>
        </div>`:''}
        <div class="space-y-2"><p class="font-black text-[13px]">👥 المجموعات (${groups.length}) - صور + فويس + نص</p>
          ${groups.map(g=>`<div onclick="openGroup(${g.id})" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3"><div class="w-12 h-12 bg-[#8b5cf6] rounded-full flex items-center justify-center text-xl">${g.img}</div><div class="flex-1"><p class="font-bold text-[12px]">${g.name}</p><p class="text-[10px] text-[#9aa4b2]">${g.members.length} عضو - ${g.desc}</p><p class="text-[9px] text-[#6b7280]">${messages.filter(m=>m.groupId===g.id).length} رسالة</p></div><span class="text-[10px] text-[#6b7280]">${messages.filter(m=>m.groupId===g.id).slice(-1)[0]? (messages.filter(m=>m.groupId===g.id).slice(-1)[0].type==='image'?'📸': messages.filter(m=>m.groupId===g.id).slice(-1)[0].type==='voice'?'🎤': '💬'):''}</span></div>`).join('')}
        </div>
        <div class="space-y-2 mt-4"><p class="font-black text-[13px]">💬 شات فردي - صور + فويس</p>
          ${gradsData.map(g=>`<div onclick="openChat(${g.id})" class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3"><div class="w-12 h-12 ${g.isAdmin?'bg-gradient-to-br from-[#f59e0b] to-[#d97706]':'bg-[#3b82f6]'} rounded-full flex items-center justify-center font-bold">${g.img}</div><div class="flex-1"><p class="font-bold text-[12px]">${g.name} ${g.isAdmin?'👑':''}</p><p class="text-[10px] text-[#9aa4b2]">${g.job}</p></div><span class="text-[10px]">💬</span></div>`).join('')}
        </div>
      </div>
    `:''}
    ${activeTab==='الخريجين'?`<div class="p-3 pb-[90px] space-y-3">${gradsData.map(g=>`<div class="bg-[#1c2128] border border-[#2a3441] rounded-2xl p-3 flex gap-3"><div class="w-12 h-12 bg-[#3b82f6] rounded-full flex items-center justify-center font-bold">${g.img}</div><div class="flex-1"><p class="font-bold text-[12px]">${g.name}</p><p class="text-[10px] text-[#9aa4b2]">${g.job}</p><div class="flex gap-2 mt-2"><button onclick="openChat(${g.id})" class="bg-[#3b82f6] px-3 py-1 rounded-full text-[11px]">راسل خاص 💬📸🎤</button><button onclick="selectedMembers=[g.id];showCreateGroup=true;activeTab='الشات';render()" class="bg-[#8b5cf6]/20 text-[#a78bfa] px-3 py-1 rounded-full text-[11px]">➕ جروب</button></div></div></div>`).join('')}</div>`:''}
    ${activeTab==='الإدارة' && isAdmin()?`<div class="p-3 pb-[90px] space-y-3"><p class="font-black">👑 إدارة أحمد</p><div class="grid grid-cols-3 gap-2"><div class="bg-[#1c2128] rounded-xl p-3 text-center"><p class="text-xl font-black">${users.length}</p><p class="text-[9px]">مستخدم</p></div><div class="bg-[#1c2128] rounded-xl p-3 text-center"><p class="text-xl font-black text-[#8b5cf6]">${groups.length}</p><p class="text-[9px]">جروب</p></div><div class="bg-[#1c2128] rounded-xl p-3 text-center"><p class="text-xl font-black text-green-400">${messages.length}</p><p class="text-[9px]">رسالة</p></div></div><button onclick="if(confirm('مسح كل الرسائل؟')){messages=[];saveMsgs();render()}" class="w-full bg-red-500/20 text-red-400 py-3 rounded-full text-[12px]">🗑️ مسح كل الشاتات</button></div>`:''}
  `}
  ${!selectedChat && !selectedGroup ? `<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-[480px] w-full bg-[#161b22] border-t border-[#2a3441] flex justify-around py-2 z-20">${[{k:'الخريجين',i:'👥'},{k:'الشات',i:'💬'},{k:'الإدارة',i:'👑'}].map(n=>`<button onclick="activeTab='${n.k}';render()" class="flex flex-col items-center text-[10px] ${activeTab===n.k?'text-[#fbbf24]':'text-[#6b7280]'}"><span class="text-[18px]">${n.i}</span>${n.k}</button>`).join('')}</nav>`:''}
 `;
 setTimeout(()=>{let el=document.getElementById('msgsBox'); if(el) el.scrollTop=el.scrollHeight;},80);
}
function doLogin(){if(!form.email||!form.pass){toast('اكتب البيانات','err');return;} let u=users.find(x=>x.email.toLowerCase()===form.email.toLowerCase()); if(!u||u.pass!==form.pass){toast('بيانات غلط','err');return;} logged=true; currentUser={...u,id:u.id||Date.now()}; localStorage.setItem('tk_real_logged','1'); localStorage.setItem('tk_current_user',JSON.stringify(currentUser)); render(); toast('أهلاً '+currentUser.name);}
function doRegister(){if(!form.name||!form.email||!form.pass){toast('املأ البيانات','err');return;} if(users.find(x=>x.email.toLowerCase()===form.email.toLowerCase())){toast('الإيميل مسجل','err');return;} let nu={name:form.name,email:form.email,pass:form.pass,year:form.year,role:'user',id:Date.now()}; users.push(nu); saveUsers(); logged=true; currentUser=nu; localStorage.setItem('tk_real_logged','1'); localStorage.setItem('tk_current_user',JSON.stringify(nu)); render(); toast('تم إنشاء حسابك');}
function doLogout(){logged=false; currentUser=null; localStorage.removeItem('tk_real_logged'); localStorage.removeItem('tk_current_user'); selectedChat=null; selectedGroup=null; render();}
function openChat(id){selectedChat=gradsData.find(g=>g.id===id); selectedGroup=null; render();}
function openGroup(id){selectedGroup=groups.find(g=>g.id===id); selectedChat=null; render();}
function toggleMember(id){if(selectedMembers.includes(id)) selectedMembers=selectedMembers.filter(x=>x!==id); else selectedMembers.push(id); render();}
function createGroup(){if(!newGroupName.trim()){toast('اكتب اسم المجموعة','err');return;} if(selectedMembers.length===0){toast('اختار عضو','err');return;} let ng={id:Date.now(),name:newGroupName,img:'👥',members:[1,...selectedMembers],createdBy:currentUser.id,desc:'مجموعة أنشأها '+currentUser.name}; groups.push(ng); saveGroups(); showCreateGroup=false; newGroupName=''; selectedMembers=[]; render(); toast('✅ تم إنشاء المجموعة'); openGroup(ng.id);}
function sendMsg(){let inp=document.getElementById('chatIn'); let t=inp?inp.value.trim():''; if(!t) return; let base={id:Date.now(),text:t,type:'text',senderId:currentUser.id,senderName:currentUser.name,time:new Date().toLocaleTimeString('ar-EG')}; if(selectedGroup) base.groupId=selectedGroup.id; else base.chatId=selectedChat.id; messages.push(base); saveMsgs(); render();}
function openImagePicker(){document.getElementById('imgInput').click();}
document.getElementById('imgInput').addEventListener('change', function(e){let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(ev){let base={id:Date.now(),text:'📸 صورة',type:'image',image:ev.target.result,senderId:currentUser.id,senderName:currentUser.name,time:new Date().toLocaleTimeString('ar-EG')}; if(selectedGroup) base.groupId=selectedGroup.id; else base.chatId=selectedChat.id; messages.push(base); saveMsgs(); render(); toast('✅ تم إرسال الصورة');}; reader.readAsDataURL(file);});
async function startRecording(){if(isRecording) return; try{let stream=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(stream); audioChunks=[]; isRecording=true; recordingTime=0; mediaRecorder.ondataavailable=e=>audioChunks.push(e.data); mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'}); let reader=new FileReader(); reader.onload=function(ev){let base={id:Date.now(),type:'voice',audio:ev.target.result,duration:recordingTime+'s',senderId:currentUser.id,senderName:currentUser.name,time:new Date().toLocaleTimeString('ar-EG')}; if(selectedGroup) base.groupId=selectedGroup.id; else base.chatId=selectedChat.id; messages.push(base); saveMsgs(); render(); toast('🎤 تم إرسال الفويس');}; reader.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop());}; mediaRecorder.start(); recordingInterval=setInterval(()=>{recordingTime++; let inp=document.getElementById('chatIn'); if(inp) inp.placeholder='🔴 '+recordingTime+'s';},1000); render(); toast('🎤 جاري التسجيل... شيل ايدك للإيقاف');}catch(err){toast('المتصفح مش بيدعم الميك','err');}}
function stopRecording(){if(!isRecording||!mediaRecorder) return; mediaRecorder.stop(); isRecording=false; clearInterval(recordingInterval); render();}
render();
</script>
</body>
</html>
