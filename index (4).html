function getPresenceText(identifier){

function containsBadWord(text){
 if(!text) return false;
 var lower = text.toLowerCase();
 // تنظيف النص من التشكيل والرموز للتحايل
 var clean = lower.replace(/[^\u0600-\u06FF\w\s]/g,' ');
 for(var i=0;i<badWords.length;i++){
  var w = badWords[i].toLowerCase();
  // تحقق مباشر
  if(lower.indexOf(w)>=0 || clean.indexOf(w)>=0) return badWords[i];
  // تحقق بالكلمة كاملة
  var regex = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
  if(regex.test(lower)) return badWords[i];
 }
 return false;
}

function checkContent(text){
 var bad = containsBadWord(text);

  return false;
 }
 return true;
}

function doLogin(){
 var e=document.getElementById('fe'); var p=document.getElementById('fp');
 if(e) form.email=e.value; if(p) form.pass=p.value;
 if(!form.email || !form.pass){toast('اكتب البيانات',true); return;}
 var u=users.find(function(x){return x.email.toLowerCase()===form.email.toLowerCase();});
 if(!u || u.pass!==form.pass){toast('بيانات غلط',true); return;}
 logged=true; cur={id:u.email.toLowerCase(),name:u.name,email:u.email,role:u.role,pic:u.pic||'',lastActive:Date.now()}; localStorage.setItem('tk_log','1'); localStorage.setItem('tk_cur',JSON.stringify(cur)); for(var i=0;i<users.length;i++){if(users[i].email.toLowerCase()===u.email.toLowerCase()){users[i].lastActive=Date.now(); break;}} localStorage.setItem('tk_u',JSON.stringify(users)); updatePresence(); render(); toast('أهلاً '+cur.name);
}
function doReg(){
 var e=document.getElementById('fe'); var p=document.getElementById('fp'); var n=document.getElementById('fn');
 if(e) form.email=e.value; if(p) form.pass=p.value; if(n) form.name=n.value;
 if(!form.name||!form.email||!form.pass){toast('املأ البيانات',true); return;}
 if(users.find(function(x){return x.email.toLowerCase()===form.email.toLowerCase()})){toast('الإيميل مسجل',true); return;}
 var nu={name:form.name,email:form.email,pass:form.pass,role:'user',pic:''}; users.push(nu); localStorage.setItem('tk_u',JSON.stringify(users));
 logged=true; cur={id:nu.email.toLowerCase(),name:nu.name,email:nu.email,role:'user',pic:'',lastActive:Date.now()}; localStorage.setItem('tk_log','1'); localStorage.setItem('tk_cur',JSON.stringify(cur)); updatePresence(); render(); toast('تم إنشاء حسابك');
}
function logout(){logged=false; cur=null; localStorage.removeItem('tk_log'); localStorage.removeItem('tk_cur'); selChat=null; selGroup=null; render();}
function toggleM(id){var idx=selM.indexOf(id); if(idx>=0) selM.splice(idx,1); else selM.push(id); render();}
function createG(){if(!gName.trim()){toast('اكتب اسم المجموعة',true); return;} if(!checkContent(gName)) return; if(selM.length===0){toast('اختار عضو',true); return;} var ng={id:Date.now(),name:gName,img:'👥',members:selM.length+1,desc:'أنشأها '+cur.name}; groups.push(ng); saveG(); showCG=false; gName=''; selM=[]; updatePresence(); render(); toast('✅ تم إنشاء المجموعة'); selGroup=ng.id; render();}
function doPost(){var inp=document.getElementById('np'); if(inp) newPost=inp.value; if(!newPost.trim()){toast('اكتب حاجة',true); return;} if(!checkContent(newPost)) return; var np={id:Date.now(),author:cur.name,text:newPost,time:'الآن',likes:0,img:cur.name[0]}; posts.unshift(np); newPost=''; saveP(); updatePresence(); render(); toast('✅ تم النشر');}
function likeP(id){var p=posts.find(function(x){return x.id===id;}); if(p){p.likes++; saveP(); render();}}
function send(){var inp=document.getElementById('cin'); var t=inp?inp.value.trim():''; if(!t) return; if(!checkContent(t)) return; var b={id:Date.now(),txt:t,type:'text',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG')}; if(selGroup) b.gid=selGroup; else b.cid=selChat; b.spic=cur.pic||''; msgs.push(b); saveM(); updatePresence(); render();}
function pickImg(){document.getElementById('imgInput').click();}
function pickProfilePic(){document.getElementById('profilePicInput').click();}
document.getElementById('profilePicInput').addEventListener('change',function(e){
 var file=e.target.files[0]; if(!file){return;}
 if(file.size>2*1024*1024){toast('الصورة كبيرة - اختار صورة أقل من 2 ميجا',true); return;}
 var r=new FileReader();
 r.onload=function(ev){
  var dataUrl=ev.target.result;
  cur.pic=dataUrl;
  localStorage.setItem('tk_cur',JSON.stringify(cur));
  // حدث في users كمان
  for(var i=0;i<users.length;i++){if(users[i].email.toLowerCase()===cur.email.toLowerCase()){users[i].pic=dataUrl; break;}}
  localStorage.setItem('tk_u',JSON.stringify(users));
  render();
  toast('✅ تم تغيير صورة البروفايل - محفوظة ليك انت بس');
 };
 r.readAsDataURL(file);
});

document.getElementById('imgInput').addEventListener('change',function(e){
 var file=e.target.files[0]; if(!file) return; var r=new FileReader();
 r.onload=function(ev){var b={id:Date.now(),type:'img',img:ev.target.result,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG')}; if(selGroup) b.gid=selGroup; else b.cid=selChat; msgs.push(b); saveM(); updatePresence(); render(); toast('✅ تم إرسال الصورة');};
 r.readAsDataURL(file);
});
async function startR(){
 if(isRec) return;
 try{
  var stream=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(stream); chunks=[]; isRec=true; recTime=0;
  rec.ondataavailable=function(e){chunks.push(e.data);};
  rec.onstop=function(){
   var blob=new Blob(chunks,{type:'audio/webm'}); var r=new FileReader();
   r.onload=function(ev){var b={id:Date.now(),type:'voice',aud:ev.target.result,dur:recTime+'s',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG')}; if(selGroup) b.gid=selGroup; else b.cid=selChat; msgs.push(b); saveM(); updatePresence(); render(); toast('🎤 تم إرسال الفويس');};
   r.readAsDataURL(blob); stream.getTracks().forEach(function(t){t.stop();});
  };
  rec.start(); recInt=setInterval(function(){recTime++; var inp=document.getElementById('cin'); if(inp) inp.placeholder='🔴 '+recTime+'s';},1000); render(); toast('🎤 جاري التسجيل...');
 }catch(err){toast('الميك مش شغال',true);}
}
function stopR(){if(!isRec||!rec) return; rec.stop(); isRec=false; clearInterval(recInt); render();}
