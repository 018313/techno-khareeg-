window.doLogin=async function(){ let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); if(fe) form.email=fe.value; if(fp) form.pass=fp.value; if(!form.email||!form.pass){ toast('اكتب البيانات',true); return; } try{ let q=query(collection(db,"users"), where("email","==",form.email.toLowerCase()), where("pass","==",form.pass)); let snap=await getDocs(q); if(snap.empty){ toast('بيانات غلط',true); return; } let data=snap.docs[0].data(); cur={...data, lastActive:Date.now()}; logged=true; localStorage.setItem('tk_cur',JSON.stringify(cur)); localStorage.setItem('tk_log','1'); await updateDoc(doc(db,"users",snap.docs[0].id), {lastActive:Date.now(), online:true}); render(); }catch(e){ toast('خطأ',true); } }
window.doReg=async function(){ 
  let fe=document.getElementById('fe'); let fp=document.getElementById('fp'); let fn=document.getElementById('fn'); 
  if(fe) form.email=fe.value; if(fp) form.pass=fp.value; if(fn) form.name=fn.value; 
  // تنظيف البيانات 100%
  form.email=(form.email||'').trim().toLowerCase().replace(/\s+/g,'');
  form.name=(form.name||'').trim().replace(/\s{2,}/g,' ');
  form.pass=(form.pass||'').trim();
  if(!form.name||!form.email||!form.pass){ toast('املأ البيانات',true); return; } 
  if(form.name.length<2){ toast('الاسم قصير',true); return; }
  if(!form.email.includes('@')){ toast('الإيميل غلط',true); return; }
  try{ 
    toast('⏳ جاري التسجيل...');
    let q=query(collection(db,"users"), where("email","==",form.email)); 
    let snap=await getDocs(q); 
    if(!snap.empty){ toast('الإيميل مسجل قبل كده',true); return; } 
    let emailClean=form.email;
    let nu={id:emailClean,name:form.name,email:emailClean,pass:form.pass,role:'user',pic:'',city:'القاهرة',job:'خريج',points:10,lastActive:Date.now(),online:true,createdAt:Date.now(),uid:emailClean}; 
    // V7.4: استخدم setDoc مباشرة بالإيميل كمفتاح - أمان 100%
    let userDocRef=doc(db,"users", emailClean.replace(/[^a-z0-9@._-]/g,'_'));
    await setDoc(userDocRef, {...nu, docId:userDocRef.id});
    cur={...nu, docId:userDocRef.id}; 
    logged=true; 
    localStorage.setItem('tk_cur',JSON.stringify(cur)); 
    localStorage.setItem('tk_log','1'); 
    render(); 
    toast('✅ تم إنشاء حسابك - أهلاً '+form.name+' 🔥'); 
  }catch(e){ 
    console.log('Reg error',e);
    toast('خطأ: '+ (e.message||'حاول تاني'),true); 
  } 
}
window.logout=function(){ logged=false; cur=null; localStorage.removeItem('tk_log'); localStorage.removeItem('tk_cur'); selChat=null; selGroup=null; render(); }
window.createG=async function(){ if(!gName.trim()){ toast('اكتب اسم المجموعة',true); return; } try{ let ng={id:Date.now(),name:gName,img:'👥',members:selM.length+1,desc:'أنشأها '+cur.name,createdBy:cur.id,createdAt:Date.now()}; await addDoc(collection(db,"groups"), ng); showCG=false; gName=''; selM=[]; toast('تم إنشاء المجموعة'); }catch(e){ toast('خطأ',true); } }
window.doPost=async function(){ let inp=document.getElementById('np'); if(inp) newPost=inp.value; if(!newPost.trim()){ toast('اكتب حاجة',true); return; } var chk=checkContent(newPost); if(!chk.ok){ toast('🚫 كلمة ممنوعة',true); return; } try{ let np={id:Date.now(),author:cur.name,authorId:cur.id,text:newPost,time:new Date().toLocaleTimeString('ar-EG'),likes:0,createdAt:Date.now()}; await addDoc(collection(db,"posts"), np); newPost=''; toast('تم النشر'); }catch(e){ toast('خطأ',true); } }

window.send=async function(){ let inp=document.getElementById('cin'); let t=inp?inp.value.trim():''; if(!t) return; var chk=checkContent(t); if(!chk.ok){ toast('🚫 كلمة ممنوعة',true); if(inp) inp.value=''; return; } try{ let m={id:Date.now(),txt:t,type:'text',sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; await addDoc(collection(db,"messages"), m); if(inp) inp.value=''; }catch(e){ toast('خطأ',true); } }
document.getElementById('profilePicInput').addEventListener('change', e=>{ let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=ev=>{ if(cur){ cur.pic=ev.target.result; localStorage.setItem('tk_cur',JSON.stringify(cur)); getDocs(query(collection(db,"users"), where("email","==",cur.email))).then(snap=>{ if(!snap.empty) updateDoc(doc(db,"users",snap.docs[0].id), {pic:ev.target.result}); }); render(); toast('✅ تم تغيير الصورة'); } }; r.readAsDataURL(file); });
document.getElementById('imgInput').addEventListener('change', e=>{ let file=e.target.files[0]; if(!file) return; let r=new FileReader(); r.onload=ev=>{ let b={id:Date.now(),type:'img',img:ev.target.result,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; addDoc(collection(db,"messages"), b); }; r.readAsDataURL(file); });
window.startR=async function(){ if(isRec) return; try{ let stream=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(stream); chunks=[]; isRec=true; recTime=0; rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ let blob=new Blob(chunks,{type:'audio/webm'}); let r=new FileReader(); r.onload=ev=>{ let b={id:Date.now(),type:'voice',aud:ev.target.result,sid:cur.id,sname:cur.name,time:new Date().toLocaleTimeString('ar-EG'),cid:selChat?String(selChat):null,gid:selGroup?String(selGroup):null,createdAt:Date.now()}; addDoc(collection(db,"messages"), b); }; r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop()); }; rec.start(); recInt=setInterval(()=>{recTime++; let inp=document.getElementById('cin'); if(inp) inp.placeholder='🔴 '+recTime+'s';},1000); render(); }catch(err){ toast('الميك مش شغال',true); } }
window.stopR=function(){ if(!isRec||!rec) return; rec.stop(); isRec=false; clearInterval(recInt); render(); }
