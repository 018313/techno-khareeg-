      <div class="glass rounded-[18px] p-3 text-center"><p class="text-[18px] font-black" id="stPosts">2</p><p class="text-[9px] text-[#9aa4b2]">مشروع</p></div>
      <div class="glass rounded-[18px] p-3 text-center"><p class="text-[18px] font-black" id="stMsgs">22</p><p class="text-[9px] text-[#9aa4b2]">رسالة</p></div>

        <div class="flex gap-2"><span>\uD83D\uDC51</span><span><b>أدمن</b> ahmed@admin.com - كل الصلاحيات</span></div>
        <div class="flex gap-2"><span>\uD83D\uDC68‍⚖️</span><span><b>لجنة التحكيم</b> jury@technokhareeg.com - تقييم فقط - الفيوم</span></div>
        <div class="flex gap-2"><span>\uD83D\uDC64</span><span><b>مستخدم</b> - نشر وتفاعل</span></div>

<div class="fixed bottom-0 left-0 right-0 z-30 bg-[#0f1720]/95 backdrop-blur-xl border-t border-white/10">

    <button onclick="setTab('الرئيسية')" data-tab="الرئيسية" class="tabBtn py-2.5 rounded-full text-[11px] font-bold">\uD83C\uDFE0<br>الرئيسية</button>
    <button onclick="setTab('المشاريع')" data-tab="المشاريع" class="tabBtn py-2.5 rounded-full text-[11px] font-bold">\uD83D\uDCA1<br>المشاريع</button>
    <button onclick="setTab('الشات')" data-tab="الشات" class="tabBtn py-2.5 rounded-full text-[11px] font-bold">\uD83D\uDCAC<br>الشات</button>
    <button onclick="setTab('المتصدرين')" data-tab="المتصدرين" class="tabBtn py-2.5 rounded-full text-[11px] font-bold">\uD83C\uDFC6<br>المتصدرين</button>
    <button onclick="setTab('حسابي')" data-tab="حسابي" class="tabBtn py-2.5 rounded-full text-[11px] font-bold">\uD83D\uDC64<br>حسابي</button>
  </div>
</div>

<script>
let tab = 'الرئيسية';
let cur = JSON.parse(localStorage.getItem('tk_cur')||'null') || {email:'jury@technokhareeg.com', role:'jury', name:'لجنة التحكيم - الفيوم', department:'الفيوم'};
let users = [
  {id:'u1', name:'أحمد أدمن', email:'ahmed@admin.com', role:'admin'},
  {id:'u2', name:'لجنة التحكيم - الفيوم', email:'jury@technokhareeg.com', role:'jury', department:'الفيوم'},
  {id:'u3', name:'محمد مطور', email:'mohamed@dev.com', role:'user'},
  {id:'u4', name:'سارة مصممة', email:'sara@design.com', role:'user'},
  {id:'u5', name:'عمر مهندس', email:'omar@eng.com', role:'user'},
  {id:'u6', name:'نور باحثة', email:'noor@research.com', role:'user'},
];
let posts = [
  {id:'p1', title:'منصة ذكية لإدارة المزارع بتقنية IoT', author:'محمد مطور', dept:'الفيوم - زراعة ذكية', likes:24, rating:4.6, ratings:[5,4,5,4,5], desc:'نظام متكامل لمراقبة التربة والري الذكي باستخدام حساسات ESP32 وتحليل بيانات بالذكاء الاصطناعي. يوفر 40% من المياه.', img:'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600'},
  {id:'p2', title:'تطبيق تعليم تفاعلي للأطفال ذوي الهمم', author:'سارة مصممة', dept:'الفيوم - تعليم', likes:18, rating:4.8, ratings:[5,5,4,5,5], desc:'تطبيق AR يدمج الواقع المعزز لتعليم الحروف والأرقام بطريقة تفاعلية مع دعم كامل للغة الإشارة والصوتيات.', img:'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=600'},
];
let msgs = Array.from({length:22},(_,i)=>({id:'m'+i, from: users[i%6].name, text: 'رسالة تجريبية '+(i+1)+' - نقاش حول المشروع', time: (i+1)+'h ago'}));

function isAdmin(){
  return cur && (cur.email==='ahmed@admin.com' || cur.role==='admin');
}
function isJury(){
  return cur && (cur.email==='jury@technokhareeg.com' || cur.role==='jury' || (cur.email||'').includes('jury') || cur.role==='لجنة التحكيم');
}
function getRoleBadge(){
  if(isAdmin()) return '<span class="px-2.5 py-1 rounded-full bg-gradient-to-r from-amber-400 to-orange-500 text-black font-black text-[9px]">\uD83D\uDC51 أدمن</span>';
  if(isJury()) return '<span class="px-2.5 py-1 rounded-full bg-gradient-to-r from-amber-500 to-orange-500 text-black font-black text-[9px]">\uD83D\uDC68‍⚖️ لجنة التحكيم - الفيوم - تقييم فقط</span>';
  return '<span class="px-2.5 py-1 rounded-full glass text-[9px]">\uD83D\uDC64 عضو</span>';
}

function setTab(t){ tab=t; render(); }
function render(){
  document.getElementById('roleBadge').innerHTML = getRoleBadge();
  document.getElementById('curEmail').textContent = cur.email||'';
  document.querySelectorAll('.tabBtn').forEach(b=>{ b.classList.toggle('tab-active', b.dataset.tab===tab); });
  let html='';
  if(tab==='الرئيسية'){
    html = '<div class="glass rounded-[24px] p-5"><h2 class="font-black text-[14px]">مرحباً '+ (cur.name||cur.email) +'</h2><p class="text-[11px] text-[#9aa4b2] mt-2">منصة تكنو خريج - نظام تقييم المشاريع - الفيوم</p><div class="mt-4 grid grid-cols-1 gap-3">'+ posts.map(p=>postCard(p)).join('') +'</div></div>';
  }else if(tab==='المشاريع'){
    html = '<div class="space-y-3">'+ posts.map(p=>postCard(p,true)).join('') +'</div>';
  }else if(tab==='الشات'){
    if(isJury()){
      html = '<div class="glass rounded-[24px] p-8 text-center"><p class="text-[20px]">\uD83D\uDD12</p><p class="font-black text-[13px] mt-2">الشات الخاص غير متاح للجنة التحكيم</p><p class="text-[10px] text-[#9aa4b2] mt-1">صلاحياتك: عرض وتقييم المشاريع فقط حسب سياسة V15.3</p></div>';
    }else{
      html = '<div class="glass rounded-[24px] p-3"><h3 class="font-black text-[12px] p-2">\uD83D\uDCAC الشات العام (22)</h3><div class="space-y-2 max-h-[60vh] overflow-auto">'+ msgs.map(m=>'<div class="glass rounded-xl p-2.5 flex gap-2"><div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[10px]">'+ m.from[0] +'</div><div><p class="text-[11px] font-bold">'+ m.from +'</p><p class="text-[10px] text-[#9aa4b2]">'+ m.text +'</p></div><span class="mr-auto text-[8px] text-[#5a6a7d]">'+ m.time +'</span></div>').join('') +'</div></div>';
    }
  }else if(tab==='المتصدرين'){
    let sorted=[...posts].sort((a,b)=>b.rating-a.rating);
    html = '<div class="glass rounded-[24px] p-4"><h3 class="font-black text-[13px]">\uD83C\uDFC6 ترتيب المشاريع - تقييم لجنة الفيوم</h3><div class="mt-3 space-y-2">'+ sorted.map((p,i)=>'<div class="glass rounded-xl p-3 flex items-center gap-3"><span class="text-[12px] font-black">'+ (i+1) +'</span><img src="'+p.img+'" class="w-12 h-12 rounded-lg object-cover"/><div><p class="font-bold text-[11px]">'+p.title+'</p><p class="text-[9px] text-[#9aa4b2]">'+p.dept+' • ⭐ '+p.rating+'</p></div></div>').join('') +'</div></div>';
  }else if(tab==='حسابي'){
    html = '<div class="glass rounded-[24px] p-5 text-center"><div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-cyan-400 to-violet-600 flex items-center justify-center font-black text-[20px]">'+ (cur.name?cur.name[0]:'U') +'</div><h3 class="font-black text-[13px] mt-3">'+ (cur.name||cur.email) +'</h3><p class="text-[10px] text-[#9aa4b2]">'+ cur.email +'</p><div class="mt-2">'+ getRoleBadge() +'</div><div class="mt-4 grid grid-cols-2 gap-2 text-[10px]"><div class="glass rounded-xl p-2">المنشورات<br><b>'+ posts.filter(p=>p.author===cur.name).length +'</b></div><div class="glass rounded-xl p-2">التقييمات<br><b>'+ (cur.ratings||3) +'</b></div></div></div>';
  }
  document.getElementById('tabContent').innerHTML = html;
  renderAccountPanel();
}

function postCard(p, detailed){
  return '<div class="glass rounded-[20px] overflow-hidden">'
    + '<img src="'+p.img+'" class="w-full h-[160px] object-cover"/>'
    + '<div class="p-4">'
    + '<div class="flex items-center justify-between"><span class="text-[9px] px-2 py-1 rounded-full bg-white/10">'+ p.dept +'</span><span class="text-[10px]">⭐ '+ p.rating.toFixed(1) +' ('+ p.ratings.length +')</span></div>'
    + '<h3 class="font-black text-[12px] mt-2 leading-5">'+ p.title +'</h3>'
    + (detailed? '<p class="text-[10px] text-[#9aa4b2] mt-2 leading-5">'+ p.desc +'</p>' : '')
    + '<div class="flex items-center gap-2 mt-3">'
    + '<button onclick="likePost(\\''+p.id+'\\')" class="flex-1 glass py-2 rounded-full text-[11px] font-bold">❤️ '+p.likes+'</button>'
    + '<button onclick="ratePost(\\''+p.id+'\\',5)" class="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 py-2 rounded-full text-[11px] font-black text-black">⭐ تقييم 5</button>'
    + (isAdmin()? '<button onclick="adminDeletePost(\\''+p.id+'\\')" class="px-3 py-2 rounded-full bg-red-500/20 text-red-300 text-[10px]">حذف</button>' : '')
    + '</div>'
    + '<p class="text-[9px] text-[#5a6a7d] mt-2">بواسطة '+ p.author +'</p>'
    + '</div></div>';
}

function renderAccountPanel(){
  let el=document.getElementById('accountPanel');
  if(!el) return;
  if(isAdmin()){
    el.innerHTML = '<div class="glass rounded-[24px] p-5 mt-3">'
      + '<h3 class="font-black text-[14px]">\uD83D\uDC51 لوحة الأدمن</h3>'
      + '<p class="text-[11px] text-[#9aa4b2] mt-1">صلاحيات كاملة - أحمد</p>'
      + '<button onclick="adminShowUsers()" class="w-full mt-3 bg-gradient-to-r from-cyan-500 to-blue-500 py-3 rounded-full text-[12px] font-black">\uD83D\uDC65 إدارة المستخدمين (6)</button>'
      + '<button onclick="adminShowPosts()" class="w-full mt-2 bg-gradient-to-r from-violet-500 to-purple-500 py-3 rounded-full text-[12px] font-black">\uD83D\uDCC4 إدارة المنشورات (2)</button>'
      + '<button onclick="adminShowChats()" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-500 py-3 rounded-full text-[12px] font-black">\uD83D\uDCAC إدارة الشاتات (22)</button>'
      + '<button onclick="adminCleanDuplicates()" class="w-full mt-2 glass py-2 rounded-full text-[10px]">\uD83E\uDDF9 تنظيف المكررات</button>'
      + '</div>';
  }else if(isJury()){
    el.innerHTML = '<div class="glass rounded-[24px] p-5 mt-3">'
      + '<h3 class="font-black text-[14px]">\uD83D\uDC68‍⚖️ لوحة لجنة التحكيم - الفيوم</h3>'
      + '<p class="text-[11px] text-[#9aa4b2] mt-1">صلاحيات: عرض وتقييم المشاريع فقط</p>'
      + '<button onclick="adminShowPosts()" class="w-full mt-3 bg-gradient-to-r from-amber-500 to-orange-500 py-3 rounded-full text-[12px] font-black">⭐ تقييم المشاريع (2)</button>'
      + '<button onclick="tab=\\'المتصدرين\\'; render()" class="w-full mt-2 glass py-3 rounded-full text-[11px] font-bold">\uD83C\uDFC6 المتصدرين</button>'
      + '<div class="mt-3 p-3 rounded-xl bg-amber-500/10 border border-amber-500/20">'
      + '<p class="text-[10px] font-bold text-amber-300">⚠️ ملاحظة:</p>'
      + '<p class="text-[9px] text-[#9aa4b2] mt-1">لا يمكنك حذف المستخدمين أو المنشورات أو رؤية الشاتات الخاصة - التقييم فقط</p>'
      + '</div></div>';
  }else{
    el.innerHTML = '<div class="glass rounded-[24px] p-5 mt-3 text-center">'
      + '<div class="w-12 h-12 mx-auto rounded-full bg-white/10 flex items-center justify-center">\uD83D\uDC64</div>'
      + '<p class="font-black text-[12px] mt-2">'+ (cur.name||'مستخدم') +'</p>'
      + '<p class="text-[10px] text-[#9aa4b2]">'+ cur.email +'</p>'
      + '<p class="text-[9px] mt-2 px-2 py-1 rounded-full bg-white/5 inline-block">'+ (cur.department||'عضو') +'</p>'
      + '</div>';
  }
}

function adminShowUsers(){
  if(!isAdmin()){ alert('⛔ هذه الميزة للأدمن فقط - jury تقييم فقط'); return; }
  let html='<div class="glass rounded-[20px] p-4"><h4 class="font-black text-[11px]">\uD83D\uDC65 المستخدمين (6)</h4><div class="mt-2 space-y-2">'+ users.map(u=>'<div class="flex items-center justify-between glass rounded-xl p-2"><div><p class="text-[11px] font-bold">'+u.name+'</p><p class="text-[8px] text-[#9aa4b2]">'+u.email+' • '+u.role+'</p></div><button onclick="adminDeleteUser(\\''+u.id+'\\')" class="text-[9px] px-2 py-1 rounded-full bg-red-500/20 text-red-300">حذف</button></div>').join('') +'</div></div>';
  document.getElementById('adminLists').innerHTML=html;
}
function adminShowPosts(){
  // Jury allowed to view/rating, but not delete
  let html='<div class="glass rounded-[20px] p-4"><h4 class="font-black text-[11px]">\uD83D\uDCC4 المشاريع للتقييم ('+posts.length+')</h4><div class="mt-2 space-y-3">'+ posts.map(p=>'<div class="glass rounded-xl p-3"><p class="font-bold text-[11px]">'+p.title+'</p><p class="text-[9px] text-[#9aa4b2] mt-1">'+p.desc.substring(0,80)+'...</p><div class="flex gap-2 mt-2"><button onclick="ratePost(\\''+p.id+'\\',5)" class="flex-1 bg-amber-500 text-black py-1.5 rounded-full text-[10px] font-black">⭐ 5 ممتاز</button><button onclick="ratePost(\\''+p.id+'\\',4)" class="flex-1 glass py-1.5 rounded-full text-[10px]">4 جيد جدا</button><button onclick="ratePost(\\''+p.id+'\\',3)" class="flex-1 glass py-1.5 rounded-full text-[10px]">3 جيد</button></div>'+ (isAdmin()?'<button onclick="adminDeletePost(\\''+p.id+'\\')" class="mt-2 w-full bg-red-500/10 text-red-300 py-1 rounded-full text-[9px]">حذف المنشور (أدمن فقط)</button>':'<p class="text-[8px] text-amber-300/70 mt-2 text-center">\uD83D\uDC68‍⚖️ وضع التقييم فقط - لا يمكنك الحذف</p>') +'</div>').join('') +'</div></div>';
  document.getElementById('adminLists').innerHTML=html;
}
function adminShowChats(){
  if(!isAdmin()){ alert('⛔ الشاتات الخاصة للأدمن فقط'); return; }
  let html='<div class="glass rounded-[20px] p-4"><h4 class="font-black text-[11px]">\uD83D\uDCAC الشاتات (22)</h4><div class="mt-2 space-y-1 max-h-[300px] overflow-auto">'+ msgs.map(m=>'<div class="flex justify-between text-[9px] glass rounded-lg p-2"><span>'+m.from+': '+m.text.substring(0,30)+'</span><button onclick="adminDeleteMsg(\\''+m.id+'\\')" class="text-red-300">حذف</button></div>').join('') +'</div></div>';
  document.getElementById('adminLists').innerHTML=html;
}

function adminDeleteUser(id){
  if(!isAdmin()){ alert('⛔ ليس لديك صلاحية الحذف - التقييم فقط'); return; }
  if(confirm('حذف المستخدم؟')){ users=users.filter(u=>u.id!==id); document.getElementById('stUsers').textContent=users.length; adminShowUsers(); }
}
function adminCleanDuplicates(){
  if(!isAdmin()){ alert('⛔ أدمن فقط'); return; }
  alert('✅ تم تنظيف المكررات');
}
function adminDeletePost(id){
  if(!isAdmin()){ alert('⛔ لجنة التحكيم لا يمكنها حذف المشاريع - التقييم فقط'); return; }
  if(confirm('حذف المشروع؟')){ posts=posts.filter(p=>p.id!==id); document.getElementById('stPosts').textContent=posts.length; render(); adminShowPosts(); }
}
function adminDeleteMsg(id){
  if(!isAdmin()){ alert('⛔ أدمن فقط'); return; }
  msgs=msgs.filter(m=>m.id!==id); document.getElementById('stMsgs').textContent=msgs.length; adminShowChats();
}

function likePost(id){
  let p=posts.find(x=>x.id===id); if(p){ p.likes++; render(); }
}
function ratePost(id,stars){
  let p=posts.find(x=>x.id===id); if(p){ p.ratings.push(stars); p.rating = p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length; render(); adminShowPosts(); alert('✅ تم التقييم '+stars+' نجوم - شكراً لجنة الفيوم'); }
}
function doLogout(){
  localStorage.removeItem('tk_cur');
  alert('تم تسجيل الخروج - للتجربة سجل دخول بـ jury@technokhareeg.com أو ahmed@admin.com');
  cur={email:'jury@technokhareeg.com', role:'jury', name:'لجنة التحكيم - الفيوم', department:'الفيوم'};
  render();
}
function quickLogin(type){
  if(type==='admin') cur={email:'ahmed@admin.com', role:'admin', name:'أحمد أدمن'};
  else if(type==='jury') cur={email:'jury@technokhareeg.com', role:'jury', name:'لجنة التحكيم - الفيوم', department:'الفيوم'};
  else cur={email:'user@test.com', role:'user', name:'مستخدم عادي'};
  localStorage.setItem('tk_cur', JSON.stringify(cur));
  render();
}

window.onload=()=>{
  try{
    if(window._fb){
      const app = window._fb.initializeApp(window._fb.firebaseConfig);
      const auth = window._fb.getAuth(app);
      window._fb.onAuthStateChanged(auth, (u)=>{
        if(u){
          cur.email=u.email; cur.role = (u.email==='ahmed@admin.com'?'admin': (u.email.includes('jury')?'jury':'user'));
          localStorage.setItem('tk_cur', JSON.stringify(cur));
          render();
        }
      });
    }
  }catch(e){ console.log('Firebase offline preview', e); }
  render();
};
<\/script>
